# 卫戍协议小助手 · Nginx 站点配置
# 用法：放到 /etc/nginx/conf.d/garrison.conf，改 root 与 server_name 后
#       nginx -t && systemctl reload nginx
#
# 说明：
#   · 站点是纯静态 + hash 路由（#/op/幽灵鲨），不需要任何重写规则，也不需要后端。
#   · 安全头只在 server 层写一次；缓存用 expires（不额外 add_header），
#     避免子 location 里的 add_header 覆盖掉 server 层的安全头（Nginx 的继承规则）。
#   · 默认部署在域名根目录；子目录方案见文件末尾注释。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # dist/ 上传到这里
    root /var/www/garrison;
    index index.html;
    charset utf-8;

    # 纯静态站只开放读方法
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # 带 ?v=指纹的静态资源：一年强缓存
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location ^~ /js/ {
        expires 1y;
        try_files $uri =404;
    }
    location ^~ /data/ {
        expires 1h;
        try_files $uri =404;
    }

    # 入口与单文件版：不缓存，保证发新版本立刻生效
    location = /index.html {
        expires -1;
    }
    location = /standalone.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml;

    # ---- 安全响应头（server 层统一下发）----
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 想更严格时再加 CSP（注意：样式里用了内联 style，需要 'unsafe-inline'）：
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; frame-ancestors 'self'" always;
}

# ---------------------------------------------------------------------------
# 部署在子目录（例如 https://example.com/garrison/）时，把上面的 server 换成：
#
# server {
#     listen 80;
#     server_name example.com;
#
#     location /garrison/ {
#         alias /var/www/garrison/;
#         index index.html;
#         try_files $uri $uri/ =404;
#     }
# }
#
# 前端资源全部是相对路径（assets/…、js/…、data/…），子目录部署不需要改代码，
# 也不需要配置 <base href>。
# ---------------------------------------------------------------------------
