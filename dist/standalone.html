    global.setTimeout(function () { writing = false; }, 0);
  }

  /* ---------------- 订阅与提交 ---------------- */
  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function notify() {
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](state); } catch (e) {
        if (global.console && console.error) console.error(e);
      }
    }
  }

  function commit(next, opts) {
    opts = opts || {};
    var changed = !eq(state, next);
    state = next;
    writeUrl(buildUrl(next), !!opts.push);
    if (changed) notify();
    return changed;
  }

  function set(patch, opts) {
    var next = clone(state);
    for (var k in patch) {
      if (patch.hasOwnProperty(k)) next[k] = patch[k];
    }
    return commit(next, opts);
  }

  /** 切换一级视图：保留关键词，清掉只属于上一个视图的筛选 */
  function switchView(view, opts) {
    if (VIEWS.indexOf(view) < 0) return false;

    // 再点一次当前 tab：不清筛选，只关掉详情
    if (view === state.view) {
      if (!state.sel) return false;
      return set({ sel: null }, opts);
    }

    var next = clone(DEFAULTS);
    next.view = view;
    next.q = state.q;
    next.team = clone(state.team);
    return commit(next, opts);
  }

  function resetFilters() {
    var next = clone(DEFAULTS);
    next.view = state.view;
    next.q = '';
    next.team = clone(state.team);
    return commit(next, { push: false });
  }

  /** 从地址栏同步（浏览器前进/后退、手动改 hash） */
  function syncFromUrl() {
    var next = parseHash(currentHash());
    if (eq(next, state)) return false;
    state = next;
    notify();
    return true;
  }

  function loadFromUrl() {
    state = parseHash(currentHash());
    return state;
  }

  /** 当前选中项是否仍然有效（切换视图或改名后自动丢弃） */
  function validateSelection() {
    if (!state.sel) return false;
    if (!entity(state.view, state.sel)) {
      var next = clone(state);
      next.sel = null;
      state = next;
      writeUrl(buildUrl(state), false);
      notify();
      return true;
    }
    return false;
  }

  function activeFilterCount(s) {
    s = s || state;
    var n = 0;
    if (s.q) n++;
    if (s.tiers.length) n++;
    if (s.tags.length) n++;
    if (s.triggers.length) n++;
    if (s.prices.length) n++;
    if (s.itypes.length) n++;
    if (s.icats.length) n++;
    if (s.otypes.length) n++;
    if (s.ranks.length) n++;
    if (s.hidden) n++;
    return n;
  }

  /* ---------------- 队伍 ---------------- */
  /**
   * 深拷贝一个席位。
   * 注意：getTeam() 必须返回深拷贝 —— 曾经直接返回 state 里的对象引用，
   * 于是「切精锐 / 改层数」先改了 state 再提交，commit 判定「没变化」就不通知，
   * 界面不重渲染，看起来就像精锐无效。
   */
  function normItem(v) {
    if (!v) return null;
    if (typeof v === 'string') return { k: v, e: false };
    if (v.k) return { k: String(v.k), e: !!v.e };
    return null;
  }

  function cloneSlot(s) {
    if (!s || (!s.k && !s.p)) return null;
    var out = { e: !!s.e };
    if (s.k) out.k = String(s.k);
    if (s.p) out.p = String(s.p);
    if (s.it && s.it.length) {
      out.it = [];
      for (var i = 0; i < s.it.length && out.it.length < ITEMS_MAX; i++) {
        var it = normItem(s.it[i]);
        if (!it) continue;
        var dup = false;
        for (var j = 0; j < out.it.length; j++) if (out.it[j].k === it.k) dup = true;
        if (!dup) out.it.push(it);
      }
    }
    if (s.m) out.m = String(s.m);
    return out;
  }

  function cloneLayers(src) {
    var out = {};
    src = src || {};
    for (var k in src) {
      if (!src.hasOwnProperty(k)) continue;
      var n = toInt(src[k]);
      if (n !== null && n > 0) out[k] = n;
    }
    return out;
  }

  function getTeam() {
    var t = state.team || DEFAULTS.team;
    var size = clampSize(t.size);
    var slots = [];
    for (var i = 0; i < size; i++) slots.push(cloneSlot(t.slots[i]));
    return { size: size, slots: slots, layers: cloneLayers(t.layers) };
  }

  function normalizeTeam(team) {
    var size = clampSize(team && team.size);
    var slots = [];
    var pickSeen = 0;
    for (var i = 0; i < size; i++) {
      var s = cloneSlot(team && team.slots ? team.slots[i] : null);
      // 自选干员全队最多 2 名：URL / 导入 / 旧数据都在这里截断
      if (s && s.p) {
        if (pickSeen >= 2) { slots.push(null); continue; }
        pickSeen++;
      }
      slots.push(s);
    }
    return { size: size, slots: slots, layers: cloneLayers(team && team.layers) };
  }

  function setTeam(team, opts) {
    return set({ team: normalizeTeam(team) }, opts);
  }

  global.Store = {
    VIEWS: VIEWS,
    DEFAULTS: DEFAULTS,
    TEAM_SIZE: TEAM_SIZE,
    TEAM_MAX: TEAM_MAX,
    ITEMS_MAX: ITEMS_MAX,
    init: init,
    getData: getData,
    entity: entity,
    listOf: listOf,
    covenantByName: covenantByName,
    getTeam: getTeam,
    setTeam: setTeam,
    parseHash: parseHash,
    buildUrl: buildUrl,
    subscribe: subscribe,
    set: set,
    switchView: switchView,
    resetFilters: resetFilters,
    loadFromUrl: loadFromUrl,
    syncFromUrl: syncFromUrl,
    validateSelection: validateSelection,
    activeFilterCount: activeFilterCount,
    equals: eq,
    isWriting: function () { return writing; },
    get state() { return state; }
  };
})(window);

</script>
<script>
/* ==========================================================================
   search.js — 索引、分词、筛选、排序、高亮
   --------------------------------------------------------------------------
   · 数据量 312 条，全量线性扫描 < 2ms，不做倒排索引，代码更短更好维护。
   · 每个条目的 haystack 在启动时预建一次（小写、字段拼接）。
   · 高亮在渲染时做：先转义再加 <mark>，避免任何 HTML 注入。
   ========================================================================== */
(function (global) {
  'use strict';

  var SEP = '\u0001';
  var index = { op: [], item: [], strategy: [], covenant: [] };
  var data = null;

  function pickOp(p) {
    return {
      key: p.name, name: p.name, tier: 0, tierLabel: '自选',
      tags: p.tags || [], type: '自选干员', hidden: false, price: 4,
      normalText: '无特质（自选干员）', eliteText: '无特质（自选干员）',
      normalTrigger: '—', eliteTrigger: '—',
      normalTriggers: [], eliteTriggers: [],
      avatar: p.avatar, avatarFull: p.avatarFull,
      pick: true, rarity: 6, star: '6★',
      class: p.class, branch: p.branch, nation: p.nation,
      factions: p.factions || [], hiddenFactions: p.hiddenFactions || [],
      tagsSource: p.tagsSource, charId: p.charId, prts: p.prts, note: p.note
    };
  }

  /* ---------------- 初始化索引 ---------------- */
  function init(payload) {
    data = payload;

    // 特殊干员档案只挂在干员上；策略索引需要反查，方便「优等生」「Pith」也能命中。
    var specialByStrategy = {};
    for (var s = 0; s < payload.operators.length; s++) {
      var sp = payload.operators[s];
      if (sp.special && sp.special.strategyKey) specialByStrategy[sp.special.strategyKey] = sp;
    }

    var allOps = payload.operators.concat((payload.picks || []).map(pickOp));
    index.op = allOps.map(function (o) {
      return {
        e: o,
        h: low([
          o.name, o.tierLabel, o.type, (o.tags || []).join(' '),
          o.normalText, o.eliteText, o.normalTrigger, o.eliteTrigger, o.price,
          specialText(o)
        ].join(SEP))
      };
    });

    index.item = payload.items.map(function (o) {
      return {
        e: o,
        h: low([
          o.name, o.type, o.tier, o.normalText, o.eliteText, o.price,
          o.hasElite ? o.elitePrice : '', o.fuseCount ? '合成' : ''
        ].join(SEP))
      };
    });

    index.strategy = payload.strategies.map(function (o) {
      var st = [];
      for (var i = 0; i < o.stages.length; i++) {
        st.push(o.stages[i].effect, o.stages[i].state, o.stages[i].rule);
      }
      var sp = o.specialOperator ? specialByStrategy[o.key] : null;
      var spText = '';
      if (sp) spText = sp.name + ' ' + (sp.special.aliases || []).join(' ');
      var fuText = '';
      if (o.fixedUnits) {
        for (var q = 0; q < o.fixedUnits.units.length; q++) fuText += ' ' + o.fixedUnits.units[q].name;
      }
      return {
        e: o,
        h: low([o.role, o.name, o.category, o.text, o.unlock, o.banned, spText, fuText]
          .concat(st).join(SEP))
      };
    });

    index.covenant = payload.covenants.map(function (o) {
      return {
        e: o,
        h: low([
          o.name, o.desc, (o.activation.empower || []).join(' '),
          (o.members || []).join(' '), (o.pickMembers || []).join(' '), kindLabel(o.activation.kind),
          rankLabel(o.rank), familyLabel(o.family),
          (o.functions || []).map(funcLabel).join(' ')
        ].join(SEP))
      };
    });

    return index;
  }

  function low(s) {
    return String(s == null ? '' : s).toLowerCase();
  }

  /** 特殊干员的别称 / 职业 / 技能名也进搜索索引（优等生、Pith、森蚺…） */
  function specialText(o) {
    if (!o.special) return '';
    var s = o.special;
    var p = s.prts || {};
    var out = [
      (s.aliases || []).join(' '),
      s.strategyRole, s.strategyName, s.strategyKey,
      s.chessId, s.debutSeason,
      p.class, p.branch, p.trait, p.charId, (p.tags || []).join(' ')
    ];
    var i;
    for (i = 0; i < (p.talents || []).length; i++) out.push(p.talents[i].name);
    for (i = 0; i < (p.skills || []).length; i++) out.push(p.skills[i].name);
    return out.join(' ');
  }

  function kindLabel(kind) {
    if (kind === 'count') return '人数';
    if (kind === 'count_layer') return '人数+层数';
    if (kind === 'elite') return '精锐数';
    return '特殊';
  }

  var RANK_LABEL = { core: '主盟约', additional: '副盟约' };
  var FAMILY_LABEL = { faction: '阵营', combat: '战斗', growth: '成长', special: '特殊' };
  var FUNC_LABEL = {
    output: '输出', survival: '生存', sustain: '续航', stack: '叠层',
    economy: '经济', summon: '召唤', rule: '规则'
  };
  var RANK_ORDER = { core: 0, additional: 1 };
  var FAMILY_ORDER = { faction: 0, combat: 1, growth: 2, special: 3 };

  function rankLabel(rank) { return RANK_LABEL[rank] || rank || ''; }
  function familyLabel(family) { return FAMILY_LABEL[family] || family || ''; }
  function funcLabel(fn) { return FUNC_LABEL[fn] || fn || ''; }

  /* ---------------- 分词 / 匹配 ---------------- */
  function tokens(q) {
    var out = [];
    if (!q) return out;
    var parts = String(q).toLowerCase().split(/[\s\u3000]+/);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p && out.indexOf(p) < 0) out.push(p);
    }
    return out;
  }

  function matchHay(hay, toks) {
    for (var i = 0; i < toks.length; i++) {
      if (hay.indexOf(toks[i]) < 0) return false;
    }
    return true;
  }

  function anyOverlap(list, selected) {
    if (!selected || !selected.length) return true;
    for (var i = 0; i < selected.length; i++) {
      if (list.indexOf(selected[i]) >= 0) return true;
    }
    return false;
  }

  function allMatch(list, selected) {
    if (!selected || !selected.length) return true;
    for (var i = 0; i < selected.length; i++) {
      if (list.indexOf(selected[i]) < 0) return false;
    }
    return true;
  }

  /* ---------------- 筛选 ---------------- */
  /**
   * @param {string} view
   * @param {object} st  Store.state
   * @param {object} [opts] {skipTags:true} 用于计算盟约 chip 计数
   */
  function filter(view, st, opts) {
    opts = opts || {};
    var recs = index[view] || [];
    var toks = tokens(st.q);
    var out = [];

    for (var i = 0; i < recs.length; i++) {
      var rec = recs[i];
      var e = rec.e;

      if (toks.length && !matchHay(rec.h, toks)) continue;

      if (view === 'op') {
        if (st.tiers.length && st.tiers.indexOf(e.tier) < 0) continue;
        if (st.prices.length && st.prices.indexOf(e.price) < 0) continue;
        if (st.otypes.length && st.otypes.indexOf(e.type) < 0) continue;
        if (st.triggers.length) {
          var trg = e.normalTriggers.concat(e.eliteTriggers);
          if (!anyOverlap(trg, st.triggers)) continue;
        }
        // 特殊干员默认也是隐藏条目，但直接搜名字/别称时要能命中
        if (!st.hidden && e.hidden && !(e.special && toks.length)) continue;
        if (!opts.skipTags && st.tags.length) {
          if (st.tagMode === 'and' ? !allMatch(e.tags, st.tags) : !anyOverlap(e.tags, st.tags)) continue;
        }
      } else if (view === 'item') {
        if (st.tiers.length && st.tiers.indexOf(e.tier) < 0) continue;
        if (st.itypes.length && st.itypes.indexOf(e.type) < 0) continue;
        if (st.prices.length && e.price != null && st.prices.indexOf(e.price) < 0) continue;
      } else if (view === 'strategy') {
        if (st.icats.length && st.icats.indexOf(e.category) < 0) continue;
      } else if (view === 'covenant') {
        if (st.ranks && st.ranks.length && st.ranks.indexOf(e.rank) < 0) continue;
      }

      out.push(e);
    }

    return sortList(view, out, st.sort);
  }

  /* ---------------- 排序 ---------------- */
  function cmpName(a, b) {
    try {
      return String(a).localeCompare(String(b), 'zh-Hans-CN');
    } catch (err) {
      return String(a) < String(b) ? -1 : String(a) > String(b) ? 1 : 0;
    }
  }

  function byTierName(a, b) {
    var ta = a.tier || 99, tb = b.tier || 99;
    if (ta !== tb) return ta - tb;
    return cmpName(a.name || a.role, b.name || b.role);
  }

  function sortList(view, list, sort) {
    var arr = list.slice();
    if (sort === 'name') {
      arr.sort(function (a, b) {
        return cmpName(a.name || a.role || '', b.name || b.role || '');
      });
    } else if (sort === 'price') {
      arr.sort(function (a, b) {
        var pa = a.price == null ? 99 : a.price;
        var pb = b.price == null ? 99 : b.price;
        if (pa !== pb) return pa - pb;
        return byTierName(a, b);
      });
    } else if (sort === 'tagcount') {
      arr.sort(function (a, b) {
        var ta = (a.tags || []).length;
        var tb = (b.tags || []).length;
        if (ta !== tb) return tb - ta;
        return byTierName(a, b);
      });
    } else if (sort === 'members') {
      arr.sort(function (a, b) {
        if (a.memberCount !== b.memberCount) return b.memberCount - a.memberCount;
        return cmpName(a.name, b.name);
      });
    } else if (sort === 'category') {
      arr.sort(function (a, b) {
        var c = cmpName(a.category, b.category);
        if (c) return c;
        return cmpName(a.role || a.name, b.role || b.name);
      });
    } else if (sort === 'hp') {
      arr.sort(function (a, b) {
        if (a.hp !== b.hp) return b.hp - a.hp;
        return cmpName(a.role || a.name, b.role || b.name);
      });
    } else if (view === 'op' || view === 'item') {
      arr.sort(byTierName);
    } else if (view === 'strategy') {
      // 默认按角色名，和「策略以角色为主体」的展示口径一致
      arr.sort(function (a, b) {
        return cmpName(a.role || '', b.role || '');
      });
    } else if (view === 'covenant') {
      arr.sort(function (a, b) {
        // 默认按「主盟约 → 副盟约」，同层再按大类、成员数。
        var ra = RANK_ORDER[a.rank], rb = RANK_ORDER[b.rank];
        if (ra == null) ra = 99;
        if (rb == null) rb = 99;
        if (ra !== rb) return ra - rb;
        var ga = FAMILY_ORDER[a.family], gb = FAMILY_ORDER[b.family];
        if (ga == null) ga = 99;
        if (gb == null) gb = 99;
        if (ga !== gb) return ga - gb;
        if (a.memberCount !== b.memberCount) return b.memberCount - a.memberCount;
        return cmpName(a.name, b.name);
      });
    }
    return arr;
  }

  /* ---------------- 分面计数 ---------------- */
  function countFacet(list, valuesOf) {
    var m = {};
    for (var i = 0; i < list.length; i++) {
      var vals = valuesOf(list[i]);
      for (var j = 0; j < vals.length; j++) {
        m[vals[j]] = (m[vals[j]] || 0) + 1;
      }
    }
    return m;
  }

  /* ---------------- 高亮 / 文本格式化 ---------------- */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }

  function highlight(text, toks) {
    var s = String(text == null ? '' : text);
    if (!toks || !toks.length || !s) return esc(s);

    var lower = s.toLowerCase();
    var ranges = [];
    for (var t = 0; t < toks.length; t++) {
      var tok = toks[t];
      if (!tok) continue;
      var from = 0, at;
      while ((at = lower.indexOf(tok, from)) >= 0) {
        ranges.push([at, at + tok.length]);
        from = at + tok.length;
      }
    }
    if (!ranges.length) return esc(s);

    ranges.sort(function (a, b) { return a[0] - b[0]; });

    var merged = [ranges[0]];
    for (var i = 1; i < ranges.length; i++) {
      var cur = merged[merged.length - 1];
      if (ranges[i][0] <= cur[1]) {
        if (ranges[i][1] > cur[1]) cur[1] = ranges[i][1];
      } else {
        merged.push(ranges[i]);
      }
    }

    var out = '', pos = 0;
    for (var k = 0; k < merged.length; k++) {
      out += esc(s.slice(pos, merged[k][0]));
      out += '<mark>' + esc(s.slice(merged[k][0], merged[k][1])) + '</mark>';
      pos = merged[k][1];
    }
    out += esc(s.slice(pos));
    return out;
  }

  var TAG_RE = /(【[^】]{1,24}】|<[^<>]{1,24}>)/g;

  /** 【盟约】 与 <触发时机> 着色，换行保留，关键词高亮 */
  function format(text, toks) {
    var s = String(text == null ? '' : text);
    if (!s) return '';
    var out = '';
    var last = 0, m;
    TAG_RE.lastIndex = 0;
    while ((m = TAG_RE.exec(s)) !== null) {
      out += highlight(s.slice(last, m.index), toks);
      var chunk = m[0];
      var cls = chunk.charAt(0) === '【' ? 'kw' : 'trg';
      out += '<span class="' + cls + '">' + esc(chunk) + '</span>';
      last = m.index + chunk.length;
    }
    out += highlight(s.slice(last), toks);
    return out.replace(/\n/g, '<br>');
  }

  /* ---------------- 对外 ---------------- */
  global.Search = {
    init: init,
    tokens: tokens,
    filter: filter,
    sortList: sortList,
    countFacet: countFacet,
    esc: esc,
    highlight: highlight,
    format: format,
    kindLabel: kindLabel,
    index: index
  };
})(window);

</script>
<script>
/* ==========================================================================
   calc.js — 配队的盟约判定内核（纯函数，不碰 DOM）
   --------------------------------------------------------------------------
   口径来源：盟约表 desc 与「激活/强化」两列，逐条核对后的结论：

   · count        主盟约 3 人激活 / 6 人强化；副盟约 2 人激活 / 3 人强化。
   · count_layer  先按人数激活（2 人，投资人 3 人），再按层数点亮节点；
                  层数由用户手填，不参与激活门槛。
   · elite        绝技：场上精锐状态干员数 ≥2 激活 / ≥5 强化，与盟约标签无关。
   · special      独行：恰好 1 名时生效，≥2 名时「失效」（conflict）；
                  调和：≥1 名激活，随后给**每个主盟约**的激活人数 +1；
                  协防干员：按表内人数列 2 人。

   装备：
   · 每名干员最多 2 件装备，只影响「变形同构体」这一类改变盟约归属的效果；
     其它装备只做展示（数值加成不进盟约计数）。
   · 变形同构体：携带者获得「另一件携带装备」所属的盟约；另一件装备的盟约
     未收录时用 slot.m（手动指定）兜底。已有该盟约则不重复计数。

   层数数值：data 里的 valueText 来自 PRTS 本期盟约页，形如 (23+0.9×层数)，
   由 substLayers() 按当前层数代入算成具体值。

   全部使用 ES5/ES2017 语法，避免老 WebView 白屏。
   ========================================================================== */
(function (global) {
  'use strict';

  var RULES = {
    size: 8,           // 默认场上席位
    maxSize: 9,        // 人事部文档后可到 9
    itemsMax: 2,       // 每名干员最多携带装备数
    nearGap: 3,        // 缺 1–3 人算「待激活」
    harmonyBonus: 1,   // 调和给核心盟约的人数加成
    pickLimit: 2       // 自选干员最多 2 名
  };

  var MORPH_ITEM = '变形同构体';

  var RANK_ORDER = { core: 0, additional: 1 };
  var STATE_ORDER = { empowered: 0, active: 1, conflict: 2, near: 3, inactive: 4 };

  /** (23+0.9×层数)% / (-30-0.05×层数) / (5000+25×层数)点 */
  var LAYER_SEG = /\((-?\d+(?:\.\d+)?)([+-])(\d+(?:\.\d+)?)×层数\)(%?)/g;

  function num(v) {
    var n = parseFloat(v);
    return isNaN(n) || n < 0 ? 0 : n;
  }

  function indexBy(list, key) {
    var m = {};
    for (var i = 0; i < (list || []).length; i++) m[list[i][key]] = list[i];
    return m;
  }

  function round3(v) {
    return String(Math.round(v * 1000) / 1000);
  }

  /**
   * 把数值文本切成「普通文字 / 带算式的数值」片段，供界面排版。
   * 例：(23+0.9×层数)% 在 100 层 → { t:'num', v:'+113%', f:'23%+0.9%×100' }
   * 百分数才带 + 号；秒 / 点这类单位只给数值。
   * 层数为 0 时不做替换（返回整段文字），避免满屏 (23+0.9×0)。
   */
  function layerSegments(text, layer) {
    var s = String(text == null ? '' : text);
    var L = num(layer);
    var out = [];
    if (!s) return out;
    if (!L) { out.push({ t: 'text', v: s }); return out; }

    var last = 0, m;
    LAYER_SEG.lastIndex = 0;
    while ((m = LAYER_SEG.exec(s)) !== null) {
      if (m.index > last) out.push({ t: 'text', v: s.slice(last, m.index) });

      var base = parseFloat(m[1]);
      var sign = m[2];
      var per = parseFloat(m[3]) * (sign === '-' ? -1 : 1);
      var pct = m[4] || '';
      var value = base + per * L;
      var head = (pct && value > 0 ? '+' : '') + round3(value) + pct;

      out.push({
        t: 'num',
        v: head,
        f: round3(base) + pct + sign + round3(Math.abs(per)) + pct + '×' + L
      });
      last = m.index + m[0].length;
    }
    if (last < s.length) out.push({ t: 'text', v: s.slice(last) });
    return out;
  }

  /**
   * 纯文本版：数值在前、算式在后。例：+113%（23%+0.9%×100）
   * 层数为 0 时原样返回。
   */
  function substLayers(text, layer) {
    var segs = layerSegments(text, layer);
    var out = '';
    for (var i = 0; i < segs.length; i++) {
      out += segs[i].t === 'num' ? (segs[i].v + '（' + segs[i].f + '）') : segs[i].v;
    }
    return out;
  }

  /** 文本里是否含层数公式（用来决定要不要提示「填层数」） */
  function hasLayerFormula(text) {
    LAYER_SEG.lastIndex = 0;
    var hit = LAYER_SEG.test(String(text == null ? '' : text));
    LAYER_SEG.lastIndex = 0;
    return hit;
  }

  /**
   * @param {{size:number, slots:Array, layers:Object}} team
   * @param {{operators:Array, items:Array, covenants:Array}} data
   */
  function evaluate(team, data) {
    var ops = data._opIndex || (data._opIndex = indexBy(data.operators, 'name'));
    var items = data._itemIndex || (data._itemIndex = indexBy(data.items, 'name'));
    var picks = data._pickIndex || (data._pickIndex = indexBy(data.picks || [], 'name'));
    var size = (team && team.size) || RULES.size;
    var slots = (team && team.slots) || [];
    var layers = (team && team.layers) || {};

    var pieces = [];
    var seen = {};
    var dupes = [];
    var morphIssues = [];
    var i, j;

    for (i = 0; i < size; i++) {
      var s = slots[i];
      if (!s || (!s.k && !s.p)) continue;
      var op = s.k ? ops[s.k] : null;
      var pick = s.p ? picks[s.p] : null;
      if (!op && !pick) continue;

      // 自选干员单独占席（不再有「自选配置」占位行）：
      // 名字/头像/盟约来自 picks，售价固定 4。
      var effective = pick ? {
        name: pick.name, tags: pick.tags || [],
        tier: op ? op.tier : 0, tierLabel: op ? op.tierLabel : '',
        price: op ? op.price : (pick.price || 4),
        avatar: pick.avatar, avatarFull: pick.avatarFull,
        type: '自选干员', pick: true
      } : op;
      var name = effective.name;
      if (seen[name]) { dupes.push(name); continue; }
      seen[name] = 1;

      var piece = { op: effective, pick: pick, elite: !!s.e, slot: i, items: [], extra: [] };
      var names = s.it || [];
      for (j = 0; j < names.length && j < RULES.itemsMax; j++) {
        var raw = names[j];
        var nm = raw && typeof raw === 'string' ? raw : (raw && raw.k);
        var eliteItem = raw && typeof raw === 'object' ? !!raw.e : false;
        var it = items[nm];
        if (it && it.type === '装备') piece.items.push({ item: it, elite: eliteItem });
      }
      resolveMorph(piece, s);
      if (piece.morph && !piece.morph.covenant) morphIssues.push({ slot: i, name: name });
      pieces.push(piece);
    }

    var tagCount = {};
    var eliteCount = 0;
    var price = 0;
    var equipCount = 0;

    for (i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      var tags = p.op.tags || [];
      for (j = 0; j < tags.length; j++) {
        tagCount[tags[j]] = (tagCount[tags[j]] || 0) + 1;
      }
      // 变形同构体：获得另一件装备的盟约（已有该盟约则不重复计）
      for (j = 0; j < p.extra.length; j++) {
        var cov = p.extra[j];
        if (tags.indexOf(cov) >= 0) continue;
        tagCount[cov] = (tagCount[cov] || 0) + 1;
      }
      if (p.elite) eliteCount++;
      price += p.op.price || 0;
      for (j = 0; j < p.items.length; j++) {
        price += itemPrice(p.items[j].item, p.items[j].elite);
        equipCount++;
      }
    }

    var harmonyOn = (tagCount['调和'] || 0) >= 1;
    var pickCount = 0;
    for (i = 0; i < pieces.length; i++) if (pieces[i].pick) pickCount++;

    var rows = [];
    for (i = 0; i < data.covenants.length; i++) {
      rows.push(judge(data.covenants[i], tagCount, eliteCount, harmonyOn, layers));
    }
    rows.sort(cmpRows);

    var summary = {
      size: size, filled: pieces.length, elite: eliteCount, price: price,
      equip: equipCount, picks: pickCount, pickLimit: RULES.pickLimit,
      active: 0, empowered: 0, near: 0, conflict: 0, total: rows.length
    };
    for (i = 0; i < rows.length; i++) {
      var st = rows[i].state;
      if (st === 'empowered') { summary.active++; summary.empowered++; }
      else if (st === 'active') summary.active++;
      else if (st === 'near') summary.near++;
      else if (st === 'conflict') summary.conflict++;
    }

    return {
      rows: rows, summary: summary, dupes: dupes, pieces: pieces,
      morphIssues: morphIssues, pickOverflow: pickCount > RULES.pickLimit
    };
  }

  /** 进阶装备按进阶售价算（没有进阶价就退回普通价） */
  function itemPrice(it, elite) {
    if (!it) return 0;
    if (elite && it.hasElite && it.elitePrice != null) return it.elitePrice;
    return it.price || 0;
  }

  /** 变形同构体：另一件装备的盟约，取不到就用 slot.m 兜底 */
  function resolveMorph(piece, slot) {
    var hasMorph = false;
    var partner = null;
    for (var i = 0; i < piece.items.length; i++) {
      if (piece.items[i].item.name === MORPH_ITEM) hasMorph = true;
      else if (!partner) partner = piece.items[i];
    }
    if (!hasMorph) return;

    var cov = (partner && partner.item.covenant) || slot.m || '';
    if (cov) piece.extra.push(cov);
    piece.morph = {
      item: partner ? partner.item.name : '',
      covenant: cov,
      manual: !!(partner && !partner.item.covenant && slot.m)
    };
  }

  function judge(c, tagCount, eliteCount, harmonyOn, layers) {
    var a = c.activation || {};
    var kind = a.kind || 'count';
    var threshold = a.threshold || 0;
    var empower = a.empowerThreshold;
    var nodes = a.nodes || [];
    var n = tagCount[c.name] || 0;

    var row = {
      name: c.name, key: c.id || c.key, rank: c.rank, kind: kind,
      threshold: threshold, empowerThreshold: empower, nodes: nodes,
      count: 0, bonus: 0, grants: 0, state: 'inactive', missing: 0, missingEmpower: null,
      layer: num(layers[c.name]), node: 0, garrison: !!c.garrison
    };

    /* ---- 绝技：按精锐数 ---- */
    if (kind === 'elite') {
      row.count = eliteCount;
      row.missing = Math.max(0, threshold - eliteCount);
      row.missingEmpower = empower == null ? null : Math.max(0, empower - eliteCount);
      if (empower != null && eliteCount >= empower) row.state = 'empowered';
      else if (eliteCount >= threshold) row.state = 'active';
      // 空队伍时不把「缺 2 名精锐」算作待激活，避免开局满屏提示
      else if (eliteCount > 0 && row.missing <= RULES.nearGap) row.state = 'near';
      return row;
    }

    /* ---- 特殊三条：不能套 count >= threshold ---- */
    if (kind === 'special') {
      if (c.name === '独行') {
        row.count = n;
        row.missing = Math.max(0, 1 - n);
        if (n >= 2) row.state = 'conflict';
        else if (n === 1) row.state = 'active';
        return row;
      }
      if (c.name === '调和') {
        row.count = n;
        // 调和自身不吃自己的 +1；它「给出」加成，给主盟约的地方在下面 count 分支
        row.grants = n >= 1 ? RULES.harmonyBonus : 0;
        row.missing = Math.max(0, 1 - n);
        row.state = n >= 1 ? 'active' : 'inactive';
        return row;
      }
      // 协防干员
      row.count = n;
      row.missing = Math.max(0, threshold - n);
      if (n >= threshold) row.state = 'active';
      else if (n > 0 && row.missing <= RULES.nearGap) row.state = 'near';
      return row;
    }

    /* ---- 人数 / 人数 + 层数 ---- */
    row.bonus = (c.rank === 'core' && harmonyOn) ? RULES.harmonyBonus : 0;
    row.count = n + row.bonus;
    row.missing = Math.max(0, threshold - row.count);
    row.missingEmpower = empower == null ? null : Math.max(0, empower - row.count);

    if (kind === 'count_layer') {
      for (var k = 0; k < nodes.length; k++) {
        if (row.layer >= nodes[k]) row.node = nodes[k];
      }
      if (row.count < threshold) row.state = 'inactive';
      else if (nodes.length && row.layer >= nodes[nodes.length - 1]) row.state = 'empowered';
      else row.state = 'active';
    } else if (empower != null && row.count >= empower) {
      row.state = 'empowered';
    } else if (row.count >= threshold) {
      row.state = 'active';
    }

    if (row.state === 'inactive' && row.count > 0 && row.missing <= RULES.nearGap) {
      row.state = 'near';
    }
    return row;
  }

  function cmpRows(a, b) {
    var sa = STATE_ORDER[a.state], sb = STATE_ORDER[b.state];
    if (sa !== sb) return sa - sb;
    var ra = RANK_ORDER[a.rank] == null ? 9 : RANK_ORDER[a.rank];
    var rb = RANK_ORDER[b.rank] == null ? 9 : RANK_ORDER[b.rank];
    if (ra !== rb) return ra - rb;
    if (a.missing !== b.missing) return a.missing - b.missing;
    return String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
  }

  /** 空队伍（保持 size 个空位） */
  function emptyTeam(size) {
    var n = Math.min(RULES.maxSize, Math.max(1, size || RULES.size));
    var slots = [];
    for (var i = 0; i < n; i++) slots.push(null);
    return { size: n, slots: slots, layers: {} };
  }

  /** 从 from 之后环形找下一个空席，没有返回 -1（连续添加用） */
  function nextEmptySlot(slots, from) {
    var n = (slots || []).length;
    if (!n) return -1;
    for (var k = 1; k <= n; k++) {
      var idx = (from + k) % n;
      if (idx < 0) idx += n;
      if (!slots[idx]) return idx;
    }
    return -1;
  }

  global.Calc = {
    RULES: RULES,
    MORPH_ITEM: MORPH_ITEM,
    evaluate: evaluate,
    emptyTeam: emptyTeam,
    nextEmptySlot: nextEmptySlot,
    layerSegments: layerSegments,
    substLayers: substLayers,
    hasLayerFormula: hasLayerFormula
  };
})(window);

</script>
<script>
/* ==========================================================================
   code.js — 配队分享码的编解码（纯函数，不碰 DOM）
   --------------------------------------------------------------------------
   目标：能在微信/QQ 里安全传播、越短越好。

   做法：**变长位流 + 字典索引 + base64url**。
   · 干员 / 装备 / 盟约都用「在 data.json 里的下标」，不用名字（中文 base64 后太长）。
   · 绝大多数席位没有装备，所以「有没有装备」只占 1 bit，有才写 17 bit。
   · 8 人满编无装备 ≈ 96 bit = 12 字节 ≈ base64 后 16 字符（加前缀 22 字符）。

   位流布局（MSB first）：
     1 bit  席位数标志（0=8 席，1=9 席）
     4 bit  已占席位数 N
     8 bit  数据指纹（名单变了会变，用来提示跨期分享）
     N × { 8 bit 干员下标+1 ，1 bit 精锐 ，1 bit 有装备 }
           有装备时再跟：6 bit 装备1+1，6 bit 装备2+1，5 bit 转职盟约+1
     3 bit  层数条数 M
     M × { 5 bit 盟约下标，14 bit 数值 }

   文本形态：`GSPA2.<base64url>`，前缀用来在一段聊天记录里被正则捞出来。
   ========================================================================== */
(function (global) {
  'use strict';

  var PREFIX = 'GSPA3.';
  var PREFIX2 = 'GSPA2.';
  var VERSION = 3;
  var RE = /GSPA([23])\.([A-Za-z0-9_-]+)/;

  var BITS_SIZE = 1, BITS_COUNT = 4, BITS_TAG = 8;
  var BITS_OP = 8, BITS_FLAG = 1, BITS_PICK = 8;
  var BITS_ITEM = 6, BITS_ITEM_ELITE = 1, BITS_COV = 5;
  var BITS_LAYER_N = 3, BITS_LAYER_VAL = 14;

  function fnv1a(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  /** 数据指纹：名单变了（换赛季）就会变，用来提示「分享码可能对不上」 */
  function tagOf(data) {
    if (data._codeTag != null) return data._codeTag;
    var parts = [];
    var i;
    for (i = 0; i < data.operators.length; i++) parts.push('o:' + data.operators[i].name);
    for (i = 0; i < (data.picks || []).length; i++) parts.push('p:' + data.picks[i].name);
    for (i = 0; i < data.items.length; i++) parts.push('i:' + data.items[i].name);
    for (i = 0; i < data.covenants.length; i++) parts.push('c:' + data.covenants[i].name);
    var tag = fnv1a(parts.join('|')) & 0xff;
    // 不可枚举：避免被 JSON 深拷贝带出去（否则克隆体的指纹会「假装相同」）
    Object.defineProperty(data, '_codeTag', { value: tag, writable: true, configurable: true });
    return tag;
  }

  function indexOf(data) {
    if (data._codeIndex) return data._codeIndex;
    var idx = { op: {}, pick: {}, item: {}, cov: {} };
    var i;
    for (i = 0; i < data.operators.length; i++) idx.op[data.operators[i].name] = i;
    for (i = 0; i < (data.picks || []).length; i++) idx.pick[data.picks[i].name] = i;
    for (i = 0; i < data.items.length; i++) idx.item[data.items[i].name] = i;
    for (i = 0; i < data.covenants.length; i++) idx.cov[data.covenants[i].name] = i;
    Object.defineProperty(data, '_codeIndex', { value: idx, writable: true, configurable: true });
    return idx;
  }

  /* ---------------- 位流 ---------------- */
  function BitWriter() {
    this.bytes = [];
    this.cur = 0;
    this.n = 0;
  }
  BitWriter.prototype.write = function (value, bits) {
    for (var i = bits - 1; i >= 0; i--) {
      this.cur = ((this.cur << 1) | ((value >> i) & 1)) & 0xff;
      this.n++;
      if (this.n === 8) {
        this.bytes.push(this.cur);
        this.cur = 0;
        this.n = 0;
      }
    }
  };
  BitWriter.prototype.finish = function () {
    if (this.n) this.bytes.push((this.cur << (8 - this.n)) & 0xff);
    return this.bytes;
  };

  function BitReader(bytes) {
    this.bytes = bytes;
    this.i = 0;
    this.bit = 0;
  }
  BitReader.prototype.read = function (bits) {
    var v = 0;
    for (var k = 0; k < bits; k++) {
      if (this.i >= this.bytes.length) return null;
      var bit = (this.bytes[this.i] >> (7 - this.bit)) & 1;
      v = (v << 1) | bit;
      this.bit++;
      if (this.bit === 8) {
        this.bit = 0;
        this.i++;
      }
    }
    return v;
  };

  /* ---------------- base64url ---------------- */
  function toB64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i] & 0xff);
    return global.btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromB64(str) {
    var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = global.atob(s);
    var out = [];
    for (var i = 0; i < bin.length; i++) out.push(bin.charCodeAt(i));
    return out;
  }

  /* ---------------- 编码 ---------------- */
  /**
   * @param {{size:number, slots:Array, layers:Object}} team
   * @param {object} data data.json
   * @returns {string} GSPA2.xxxx
   */
  function encode(team, data) {
    var idx = indexOf(data);
    var size = Math.min(9, Math.max(8, team.size || 8));
    var w = new BitWriter();

    w.write(size === 9 ? 1 : 0, BITS_SIZE);
    w.write(tagOf(data), BITS_TAG);

    var recs = [];
    var i;
    var pickCount = 0;
    for (i = 0; i < size; i++) {
      var s = team.slots[i];
      if (!s || (!s.k && !s.p)) continue;

      var gear = [];
      var list = s.it || [];
      for (var g = 0; g < list.length && gear.length < 2; g++) {
        var raw = list[g];
        var nm = raw && typeof raw === 'string' ? raw : (raw && raw.k);
        if (!nm || idx.item[nm] == null) continue;
        gear.push({ i: idx.item[nm] + 1, e: (raw && typeof raw === 'object' && raw.e) ? 1 : 0 });
      }

      var morph = s.m && idx.cov[s.m] != null ? idx.cov[s.m] + 1 : 0;
      var pick = s.p && idx.pick[s.p] != null ? idx.pick[s.p] + 1 : 0;
      // 自选干员上限 2：第 3 名起不再编码（UI 也会拦截）
      if (pick) {
        if (pickCount >= 2) continue;
        pickCount++;
      }
      var opIdx = s.k && idx.op[s.k] != null ? idx.op[s.k] + 1 : 0;
      if (!opIdx && !pick) continue;
      recs.push({
        op: opIdx,
        elite: s.e ? 1 : 0,
        pick: pick,
        items: [gear[0] || { i: 0, e: 0 }, gear[1] || { i: 0, e: 0 }],
        morph: morph
      });
    }

    w.write(Math.min(15, recs.length), BITS_COUNT);
    for (i = 0; i < recs.length; i++) {
      var r = recs[i];
      var hasGear = (r.items[0].i || r.items[1].i || r.morph) ? 1 : 0;
      w.write(r.op, BITS_OP);
      w.write(r.elite, BITS_FLAG);
      w.write(r.pick ? 1 : 0, BITS_FLAG);
      if (r.pick) w.write(r.pick, BITS_PICK);
      w.write(hasGear, BITS_FLAG);
      if (hasGear) {
        w.write(r.items[0].i, BITS_ITEM);
        w.write(r.items[0].e, BITS_ITEM_ELITE);
        w.write(r.items[1].i, BITS_ITEM);
        w.write(r.items[1].e, BITS_ITEM_ELITE);
        w.write(r.morph, BITS_COV);
      }
    }

    var layers = [];
    var rawLayers = team.layers || {};
    for (var name in rawLayers) {
      if (!rawLayers.hasOwnProperty(name)) continue;
      var ci = idx.cov[name];
      var v = Math.min(16383, Math.max(0, Math.floor(rawLayers[name] || 0)));
      if (ci == null || !v) continue;
      layers.push([ci, v]);
    }
    w.write(Math.min(7, layers.length), BITS_LAYER_N);
    for (i = 0; i < layers.length; i++) {
      w.write(layers[i][0], BITS_COV);
      w.write(layers[i][1], BITS_LAYER_VAL);
    }

    return PREFIX + toB64(w.finish());
  }

  /* ---------------- 解码 ---------------- */
  /**
   * @returns {{team:object, warnings:string[], placed:number}|null}
   */
  function decode(text, data) {
    var m = String(text == null ? '' : text).match(RE);
    if (!m) return null;
    var ver = m[1];

    var bytes;
    try { bytes = fromB64(m[2]); } catch (e) { return null; }
    if (!bytes.length) return null;

    var r = new BitReader(bytes);
    var sizeFlag = r.read(BITS_SIZE);
    var tag = r.read(BITS_TAG);
    if (sizeFlag === null || tag === null) return null;

    var warnings = [];
    if (tag !== tagOf(data)) warnings.push('分享码来自不同的数据版本，请核对干员');

    var size = sizeFlag ? 9 : 8;
    var n = r.read(BITS_COUNT);
    if (n === null) return null;

    var team = { size: size, slots: [], layers: {} };
    var i;
    for (i = 0; i < size; i++) team.slots.push(null);

    var placed = 0;
    var pickSeen = 0;
    for (i = 0; i < n && i < size; i++) {
      var opIdx = r.read(BITS_OP);
      var elite = r.read(BITS_FLAG);
      var hasPick = 0, pickIdx = 0;
      if (ver === '3') {
        hasPick = r.read(BITS_FLAG);
        if (hasPick) pickIdx = r.read(BITS_PICK);
      }
      var hasGear = r.read(BITS_FLAG);
      if (opIdx === null || elite === null || hasPick === null || hasGear === null) break;

      // 先读完整个记录，再校验下标；避免坏码把后续位流读错位。
      var ai = 0, ae = 0, bi = 0, be = 0, mo = 0;
      if (hasGear) {
        ai = r.read(BITS_ITEM);
        ae = r.read(BITS_ITEM_ELITE);
        bi = r.read(BITS_ITEM);
        be = r.read(BITS_ITEM_ELITE);
        mo = r.read(BITS_COV);
        if (ai === null || ae === null || bi === null || be === null || mo === null) break;
      }

      var slot = null;
      if (opIdx === 0) {
        // op=0 是「纯自选干员」哨兵：没有占位干员，只有 picks 下标。
        if (!hasPick || pickIdx <= 0) {
          warnings.push('第 ' + (i + 1) + ' 席缺少自选干员下标，已跳过');
          continue;
        }
        var pk0 = (data.picks || [])[pickIdx - 1];
        if (!pk0) {
          warnings.push('第 ' + (i + 1) + ' 席的自选干员在当前数据里不存在，已跳过');
          continue;
        }
        if (pickSeen >= 2) {
          warnings.push('自选干员最多 2 名，已忽略第 3 名');
          continue;
        }
        pickSeen++;
        slot = { p: pk0.name, e: !!elite };
      } else {
        var op = data.operators[opIdx - 1];
        if (!op) { warnings.push('第 ' + (i + 1) + ' 席的干员在当前数据里不存在，已跳过'); continue; }
        slot = { k: op.name, e: !!elite };
        if (hasPick && pickIdx > 0) {
          var pk = (data.picks || [])[pickIdx - 1];
          if (!pk) {
            warnings.push('第 ' + (i + 1) + ' 席的自选干员在当前数据里不存在，已忽略');
          } else if (pickSeen >= 2) {
            warnings.push('自选干员最多 2 名，已忽略第 3 名');
          } else {
            slot.p = pk.name;
            pickSeen++;
          }
        }
      }
      if (hasGear) {
        var gear = [];
        if (ai > 0 && data.items[ai - 1]) gear.push({ k: data.items[ai - 1].name, e: !!ae });
        if (bi > 0 && data.items[bi - 1]) {
          var second = { k: data.items[bi - 1].name, e: !!be };
          if (!gear.length || gear[0].k !== second.k) gear.push(second);
        }
        if (gear.length) slot.it = gear.slice(0, 2);
        if (mo > 0 && data.covenants[mo - 1]) slot.m = data.covenants[mo - 1].name;
      }
      if (placed < size) team.slots[placed++] = slot;
    }

    var mCount = r.read(BITS_LAYER_N);
    if (mCount) {
      for (i = 0; i < mCount; i++) {
        var ci = r.read(BITS_COV);
        var v = r.read(BITS_LAYER_VAL);
        if (ci === null || v === null) break;
        var cov = data.covenants[ci];
        if (cov && v > 0) team.layers[cov.name] = v;
      }
    }

    return { team: team, warnings: warnings, placed: placed };
  }

  global.Code = {
    PREFIX: PREFIX,
    PREFIX2: PREFIX2,
    VERSION: VERSION,
    encode: encode,
    decode: decode,
    dataTag: tagOf,
    _toB64: toB64,
    _fromB64: fromB64
  };
})(window);

</script>
<script>
/* ==========================================================================
   ui.js — DOM 构造：筛选面板、卡片、详情、关于页、页脚
   --------------------------------------------------------------------------
   全部字符串拼接 + 统一转义（Search.esc / Search.format），不信任数据里的任何
   HTML 片段；数据里本来就有 <进入休整期时> 这类尖括号文本。
   ========================================================================== */
(function (global) {
  'use strict';

  var Store = global.Store;
  var Search = global.Search;

  var refs = {};
  var data = null;
  var currentList = [];
  var hueCache = {};
  var opByName = {};
  var NO_AVATARS = !!global.GSPA_NO_AVATARS;
  var NO_ICONS = !!global.GSPA_NO_ICONS;

  var KIND_LABEL = {
    count: '人数',
    count_layer: '人数 + 层数',
    elite: '精锐数',
    special: '特殊'
  };

  // 盟约一级分类：主盟约（核心）/ 副盟约（附加）
  var RANK_LABEL = { core: '主盟约', additional: '副盟约' };
  var FAMILY_LABEL = { faction: '阵营', combat: '战斗', growth: '成长', special: '特殊' };
  var FUNC_LABEL = {
    output: '输出', survival: '生存', sustain: '续航', stack: '叠层',
    economy: '经济', summon: '召唤', rule: '规则'
  };

  function rankLabel(v) { return RANK_LABEL[v] || v || ''; }
  function familyLabel(v) { return FAMILY_LABEL[v] || v || ''; }
  function funcsLabel(list) {
    var out = [];
    for (var i = 0; i < (list || []).length; i++) out.push(FUNC_LABEL[list[i]] || list[i]);
    return out.join(' / ');
  }

  function esc(s) { return Search.esc(s); }

  function init() {
    data = Store.getData();
    refs = {
      filters: document.getElementById('filters'),
      cards: document.getElementById('cards'),
      toolbar: document.getElementById('toolbar'),
      drawer: document.getElementById('drawer'),
      empty: document.getElementById('empty'),
      footer: document.getElementById('footer'),
      tabs: document.getElementById('tabs')
    };
    fillTabCounts();
    renderFooter();

    opByName = {};
    for (var i = 0; i < data.operators.length; i++) {
      opByName[data.operators[i].name] = data.operators[i];
    }
    return refs;
  }

  function fillTabCounts() {
    var c = data.counts;
    var map = { op: c.operators + (c.picks || 0), item: c.items, strategy: c.strategies, covenant: c.covenants };
    var nodes = refs.tabs ? refs.tabs.querySelectorAll('[data-n]') : [];
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i].getAttribute('data-n');
      nodes[i].textContent = map[k] || '';
    }
  }

  /* ---------------- 盟约固定色相 ---------------- */
  function hue(name) {
    var key = String(name || '');
    if (hueCache[key] != null) return hueCache[key];
    var h = 2166136261;
    for (var i = 0; i < key.length; i++) {
      h ^= key.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    var v = Math.abs(h) % 360;
    // 往两侧压一点，避开纯黄/纯青这类在深色底上发飘的色相
    if (v > 40 && v < 75) v = 40;
    hueCache[key] = v;
    return v;
  }

  /* ---------------- 头像 ---------------- */
  function initial(name) {
    var s = String(name == null ? '' : name).replace(/^[“"'\s]+/, '');
    return s ? s.charAt(0) : '?';
  }

  /**
   * 头像块：有图显示图，无图（或图坏了）露出色块首字。
   * @param {object|null} entry 有 avatar / avatarFull 的对象
   * @param {string} name 用于取首字与色相
   * @param {number} size 像素
   * @param {boolean} full 是否优先用大图
   */
  function avatarHtml(entry, name, size, full, eager) {
    if (NO_AVATARS) return '';
    var src = entry ? (full ? (entry.avatarFull || entry.avatar) : entry.avatar) : null;
    var img = src
      ? '<img class="avatar-img" src="' + esc(src) + '" alt="" width="' + size + '" height="' + size +
        '" loading="' + (eager ? 'eager' : 'lazy') + '" decoding="async">'
      : '';
    return '<span class="avatar' + (src ? ' has-img' : '') + '" style="--h:' + hue(name) +
      ';--size:' + size + 'px" aria-hidden="true">' +
      '<span class="avatar-letter">' + esc(initial(name)) + '</span>' + img + '</span>';
  }

  /* ---------------- 道具 / 策略 / 盟约图标 ----------------
   * 三套图标都来自本期「卫戍协议·规程」的 PRTS 页面，透明底白色线稿居多，
   * 因此统一放在深色底座上（浅色主题也清楚）；缺图/坏图回退「色块 + 首字」。
   */
  function iconHtml(entry, name, size, kind, full, eager) {
    if (NO_ICONS) return '';
    var src = entry ? (full ? (entry.iconFull || entry.icon) : entry.icon) : null;
    var img = src
      ? '<img class="icon-img" src="' + esc(src) + '" alt="" width="' + size + '" height="' + size +
        '" loading="' + (eager ? 'eager' : 'lazy') + '" decoding="async">'
      : '';
    return '<span class="icon icon-' + kind + (src ? ' has-img' : '') + '" style="--h:' + hue(name) +
      ';--size:' + size + 'px" aria-hidden="true">' +
      '<span class="icon-letter">' + esc(initial(name)) + '</span>' + img + '</span>';
  }

  /* ======================================================================
     总渲染
     ====================================================================== */
  function render() {
    var st = Store.state;
    var toks = Search.tokens(st.q);

    renderTabs(st);
    document.body.classList.toggle('view-about', st.view === 'about');
    document.body.classList.toggle('view-team', st.view === 'team');
    if (st.view !== 'team' && global.Team) {
      global.Team.closeSheet();
      global.Team.hideTip();
    }

    if (st.view === 'about') {
      currentList = [];
      refs.filters.innerHTML = '';
      refs.filters.hidden = true;
      refs.toolbar.hidden = true;
      refs.toolbar.innerHTML = '';
      refs.empty.hidden = true;
      refs.cards.hidden = false;
      refs.cards.className = 'cards is-about';
      refs.cards.innerHTML = aboutHtml(st);
      renderDrawer(st, toks);
      updateTitle(st);
      return currentList;
    }

    refs.filters.hidden = false;
    refs.toolbar.hidden = false;
    refs.cards.className = 'cards';

    if (st.view === 'team') {
      currentList = [];
      refs.filters.hidden = true;
      refs.filters.innerHTML = '';
      refs.toolbar.hidden = true;
      refs.toolbar.innerHTML = '';
      refs.empty.hidden = true;
      refs.cards.hidden = false;
      refs.cards.className = 'cards is-team';
      refs.cards.innerHTML = global.Team ? global.Team.render(st) : '';
      renderDrawer(st, toks);
      updateTitle(st);
      return currentList;
    }

    currentList = Search.filter(st.view, st);
    renderFilters(st);
    renderToolbar(st);
    renderCards(st, toks);
    renderDrawer(st, toks);
    updateTitle(st);
    return currentList;
  }

  function updateTitle(st) {
    var t = {
      op: '干员图鉴',
      item: '道具图鉴',
      strategy: '策略图鉴',
      covenant: '盟约图鉴',
      team: '模拟配队',
      about: '关于'
    }[st.view] || 'GSPA · 眼镜卫戍协议小助手';
    document.title = t + ' · GSPA 眼镜卫戍协议小助手';
  }

  function renderTabs(st) {
    var tabs = refs.tabs ? refs.tabs.querySelectorAll('[data-view]') : [];
    for (var i = 0; i < tabs.length; i++) {
      var on = tabs[i].getAttribute('data-view') === st.view;
      tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
      tabs[i].tabIndex = on ? 0 : -1;
    }
  }

  /* ======================================================================
     筛选面板
     ====================================================================== */
  function facetBase(st, facet) {
    var copy = {};
    for (var k in st) if (st.hasOwnProperty(k)) copy[k] = st[k];
    copy.tiers = st.tiers.slice();
    copy.tags = st.tags.slice();
    copy.triggers = st.triggers.slice();
    copy.prices = st.prices.slice();
    copy.itypes = st.itypes.slice();
    copy.icats = st.icats.slice();
    copy.otypes = st.otypes.slice();
    copy.ranks = st.ranks.slice();

    if (facet === 'tags') {
      return Search.filter(st.view, copy, { skipTags: true });
    }
    copy[facet] = [];
    return Search.filter(st.view, copy);
  }

  function groupHtml(opts) {
    var st = Store.state;
    var sel = st[opts.id];
    var isArr = Array.isArray(sel);
    var active = opts.toggle ? !!sel : (isArr ? sel.length > 0 : !!sel);
    var counts = opts.counts || {};

    var chips = '';
    for (var i = 0; i < opts.items.length; i++) {
      var it = opts.items[i];
      if (it.breakBefore) {
        chips += '<span class="chip-break" aria-hidden="true"></span>';
      }
      var val = it.v;
      var pressed = opts.toggle ? !!sel : (isArr ? sel.indexOf(val) >= 0 : sel === val);
      var c = counts[String(val)];
      var count = (it.count === false) ? null : (c == null ? 0 : c);
      var extra = '';
      if (it.tier) extra += ' tier-chip" data-tier="' + it.tier;
      var lead = it.icon || (it.hue != null ? '<i class="dot" style="--h:' + it.hue + '"></i>' : '');
      chips += '<button type="button" class="chip' + extra + '"' +
        ' data-fid="' + opts.id + '" data-fval="' + esc(String(val)) + '"' +
        ' aria-pressed="' + (pressed ? 'true' : 'false') + '"' +
        (it.hue != null ? ' title="' + esc(it.label) + '"' : '') + '>' +
        lead +
        esc(it.label) +
        (count != null ? '<span class="chip-count">' + count + '</span>' : '') +
        '</button>';
    }

    var modeHtml = '';
    if (opts.mode) {
      modeHtml = '<div class="seg" role="group" aria-label="盟约匹配方式">' +
        '<button type="button" data-tm="and" aria-pressed="' + (st.tagMode === 'and' ? 'true' : 'false') + '">全部</button>' +
        '<button type="button" data-tm="or" aria-pressed="' + (st.tagMode === 'or' ? 'true' : 'false') + '">任一</button>' +
        '</div>';
    }

    return '<div class="fgroup"' + (opts.wide ? ' data-wide' : '') + '>' +
      '<div class="fgroup-head"><span class="fgroup-title">' + esc(opts.title) + '</span>' +
      (active ? '<button type="button" class="fgroup-clear" data-fclear="' + opts.id + '">清除</button>' : '') +
      '</div>' +
      '<div class="chips">' + chips + '</div>' +
      modeHtml +
      '</div>';
  }

  var lastFilterView = null;

  function renderFilters(st) {
    var groups = buildGroups(st);
    var html = '<div class="filters-head"><span class="filters-title">筛选</span>' +
      '<span class="filters-head-actions">' +
      '<button type="button" class="fgroup-clear" data-reset="1">全部清空</button>' +
      '<button type="button" class="fgroup-clear filters-x" data-close-filters="1" aria-label="关闭筛选">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>' +
      '</span></div>';

    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (!g) continue;
      var base = (g.countsFrom === 'none') ? [] : facetBase(st, g.id);
      g.counts = g.countOf ? Search.countFacet(base, g.countOf) : {};
      html += groupHtml(g);
    }

    if (st.view === 'op') {
      html += '<div class="filters-foot">' +
        '<button type="button" class="btn btn-primary" data-close-filters="1">查看结果（' + currentList.length + '）</button>' +
        '</div>';
    } else {
      html += '<div class="filters-foot">' +
        '<button type="button" class="btn" data-close-filters="1">收起</button>' +
        '</div>';
    }

    // 选中一个筛选条件后不要跳回顶部：抽屉 / 侧栏滚动位置按视图保留
    var sameView = lastFilterView === st.view;
    var top = sameView ? refs.filters.scrollTop : 0;
    lastFilterView = st.view;
    refs.filters.innerHTML = html;
    if (top) refs.filters.scrollTop = top;
  }

  function buildGroups(st) {
    var groups = [];

    if (st.view === 'op') {
      groups.push({
        id: 'tiers', title: '阶数', wide: false,
        items: data.tiers.map(function (t, i) {
          return { v: i + 1, label: t, tier: String(i + 1) };
        }).concat([{ v: 0, label: '自选', tier: '0' }]),
        countOf: function (o) { return [o.tier]; }
      });
      groups.push({
        id: 'tags', title: '盟约', wide: true, mode: true,
        items: data.covenants.map(function (c, ci) {
          return {
            v: c.name, label: c.name, hue: hue(c.name),
            icon: iconHtml(c, c.name, 18, 'covenant'),
            // 主盟约排完后换行，再列副盟约
            breakBefore: c.rank !== 'core' && ci > 0 && data.covenants[ci - 1].rank === 'core'
          };
        }),
        countOf: function (o) { return o.tags; }
      });
      groups.push({
        id: 'triggers', title: '触发时机', wide: true,
        items: triggerOptions(),
        countOf: function (o) { return o.normalTriggers.concat(o.eliteTriggers); }
      });
      groups.push({
        id: 'prices', title: '售价', wide: false,
        items: [1, 2, 3, 4].map(function (n) { return { v: n, label: '◈' + n }; }),
        countOf: function (o) { return [o.price]; }
      });
      groups.push({
        id: 'otypes', title: '条目类型', wide: true,
        items: ['特许条目', '普通条目', '自选干员'].map(function (t) { return { v: t, label: t }; }),
        countOf: function (o) { return [o.type]; }
      });
      groups.push({
        id: 'hidden', title: '其他', wide: false, toggle: true,
        items: [{ v: '1', label: '显示隐藏条目（特殊干员）', count: false }],
        countsFrom: 'none'
      });
      return groups;
    }

    if (st.view === 'item') {
      groups.push({
        id: 'itypes', title: '类型', wide: true,
        items: ['装备', '消耗道具', '合成成品'].map(function (t) { return { v: t, label: t }; }),
        countOf: function (o) { return [o.type]; }
      });
      groups.push({
        id: 'tiers', title: '阶数', wide: false,
        items: [1, 2, 3, 4, 5, 6].map(function (n) {
          return { v: n, label: n + ' 阶', tier: String(n) };
        }),
        countOf: function (o) { return [o.tier]; }
      });
      groups.push({
        id: 'prices', title: '普通售价', wide: false,
        items: [1, 2, 3, 4, 5, 6].map(function (n) { return { v: n, label: '◈' + n }; }),
        countOf: function (o) { return [o.price]; }
      });
      return groups;
    }

    if (st.view === 'strategy') {
      groups.push({
        id: 'icats', title: '类别', wide: true,
        items: ['通用策略', '盟约策略'].map(function (t) { return { v: t, label: t }; }),
        countOf: function (o) { return [o.category]; }
      });
      return groups;
    }

    if (st.view === 'covenant') {
      groups.push({
        id: 'ranks', title: '盟约分类', wide: true,
        items: [
          { v: 'core', label: '主盟约' },
          { v: 'additional', label: '副盟约' }
        ],
        countOf: function (o) { return [o.rank]; }
      });
      return groups;
    }

    return groups;
  }

  function triggerOptions() {
    var seen = {};
    var out = [];
    var ops = data.operators;
    for (var i = 0; i < ops.length; i++) {
      var t = ops[i].normalTriggers.concat(ops[i].eliteTriggers);
      for (var j = 0; j < t.length; j++) {
        if (!seen[t[j]]) { seen[t[j]] = 1; out.push(t[j]); }
      }
    }
    var order = ['获得时', '进入休整期时', '休整期开始时', '休整期结束时', '战斗中',
      '战斗开始时', '战斗结束时', '售出时', '刷新时'];
    out.sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia < 0) ia = 99;
      if (ib < 0) ib = 99;
      if (ia !== ib) return ia - ib;
      return a.localeCompare(b, 'zh-Hans-CN');
    });
    return out.map(function (t) { return { v: t, label: t }; });
  }

  /* ======================================================================
     工具条
     ====================================================================== */
  function renderToolbar(st) {
    var total = currentList.length;
    var viewTotal = Store.listOf(st.view).length;
    var nActive = Store.activeFilterCount(st);

    var sortOpts = sortOptions(st.view);
    var sortHtml = '<label class="sort">排序<select id="sort" aria-label="排序方式">';
    for (var i = 0; i < sortOpts.length; i++) {
      sortHtml += '<option value="' + esc(sortOpts[i].v) + '"' +
        (st.sort === sortOpts[i].v ? ' selected' : '') + '>' + esc(sortOpts[i].label) + '</option>';
    }
    sortHtml += '</select></label>';

    var filterBtn = '<button type="button" class="btn btn-filter" data-filters-toggle="1">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-filter"/></svg>筛选' +
      (nActive ? '<span class="badge">' + nActive + '</span>' : '') + '</button>';

    var countHtml = '<div class="result-count">共 <b>' + total + '</b> 条' +
      (total !== viewTotal ? '<span style="color:var(--fg3)"> / ' + viewTotal + '</span>' : '') +
      '</div>';

    var chips = activeFilterChips(st);

    refs.toolbar.innerHTML =
      filterBtn + countHtml +
      '<div class="toolbar-spacer"></div>' +
      sortHtml +
      (nActive ? '<button type="button" class="btn" data-reset="1"><svg class="ico" aria-hidden="true"><use href="#i-reset"/></svg>重置</button>' : '') +
      (chips ? '<div class="active-filters">' + chips + '</div>' : '');
  }

  function sortOptions(view) {
    if (view === 'op') {
      return [
        { v: 'default', label: '阶数 → 名称' },
        { v: 'name', label: '名称' },
        { v: 'price', label: '售价' },
        { v: 'tagcount', label: '盟约数' }
      ];
    }
    if (view === 'item') {
      return [
        { v: 'default', label: '阶数 → 名称' },
        { v: 'name', label: '名称' },
        { v: 'price', label: '售价' }
      ];
    }
    if (view === 'strategy') {
      return [
        { v: 'default', label: '角色名' },
        { v: 'category', label: '类别 → 角色' },
        { v: 'name', label: '策略名' },
        { v: 'hp', label: '生命值' }
      ];
    }
    return [
      { v: 'default', label: '主/副 → 成员数' },
      { v: 'members', label: '成员数' },
      { v: 'name', label: '名称' }
    ];
  }

  function activeFilterChips(st) {
    var out = [];
    var i;

    if (st.q) out.push(afChip('q', '搜索：' + st.q));
    if (st.tiers.length) {
      var tl = [];
      for (i = 0; i < st.tiers.length; i++) {
        if (st.view === 'item') tl.push(String(st.tiers[i]));
        else if (st.tiers[i] === 0) tl.push('自选');
        else tl.push(data.tiers[st.tiers[i] - 1]);
      }
      out.push(afChip('tiers', '阶数 ' + tl.join('/')));
    }
    if (st.tags.length) {
      var names = [];
      for (i = 0; i < st.tags.length; i++) names.push(st.tags[i]);
      out.push(afChip('tags', '盟约 ' + (st.tagMode === 'or' ? '任一：' : '全部：') + names.join(' + ')));
    }
    if (st.triggers.length) out.push(afChip('triggers', '时机 ' + st.triggers.join('/')));
    if (st.prices.length) out.push(afChip('prices', '售价 ' + st.prices.join('/')));
    if (st.itypes.length) out.push(afChip('itypes', st.itypes.join('/')));
    if (st.icats.length) out.push(afChip('icats', st.icats.join('/')));
    if (st.otypes.length) out.push(afChip('otypes', st.otypes.join('/')));
    if (st.ranks.length) {
      var rl = [];
      for (i = 0; i < st.ranks.length; i++) rl.push(rankLabel(st.ranks[i]));
      out.push(afChip('ranks', '分类 ' + rl.join('/')));
    }
    if (st.hidden) out.push(afChip('hidden', '含隐藏/特殊'));

    return out.join('');
  }

  function afChip(id, label) {
    return '<span class="af">' + esc(label) +
      '<button type="button" data-fclear="' + id + '" aria-label="移除筛选：' + esc(label) + '">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button></span>';
  }

  /* ======================================================================
     卡片
     ====================================================================== */
  function renderCards(st, toks) {
    var list = currentList;
    if (!list.length) {
      refs.cards.innerHTML = '';
      refs.cards.hidden = true;
      refs.empty.hidden = false;
      return;
    }
    refs.cards.hidden = false;
    refs.empty.hidden = true;

    // 盟约视图：主盟约 / 副盟约分区显示，各自保留当前排序
    if (st.view === 'covenant') {
      var core = [];
      var additional = [];
      for (var c = 0; c < list.length; c++) {
        var card = cardHtml(st.view, list[c], toks, st);
        if (list[c].rank === 'core') core.push(card);
        else additional.push(card);
      }
      var covHtml = '';
      if (core.length) covHtml += cardsSection('主盟约', core.length) + core.join('');
      if (additional.length) covHtml += cardsSection('副盟约', additional.length) + additional.join('');
      refs.cards.innerHTML = covHtml;
      return;
    }

    var parts = [];
    for (var i = 0; i < list.length; i++) {
      parts.push(cardHtml(st.view, list[i], toks, st));
    }
    refs.cards.innerHTML = parts.join('');
  }

  function cardsSection(title, count) {
    return '<div class="cards-sec"><h2>' + esc(title) + '</h2>' +
      '<span>' + count + ' 个</span></div>';
  }

  function cardHtml(view, e, toks, st) {
    if (view === 'op') return e.pick ? pickCard(e, toks, st) : opCard(e, toks, st);
    if (view === 'item') return itemCard(e, toks, st);
    if (view === 'strategy') return strategyCard(e, toks, st);
    return covenantCard(e, toks, st);
  }

  function cardOpen(view, key, label, extraClass) {
    return '<div class="card' + (extraClass ? ' ' + extraClass : '') + '" role="button" tabindex="0"' +
      ' data-sel="' + esc(key) + '" aria-label="' + esc(label) + '">';
  }

  function tagsHtml(tags) {
    if (!tags || !tags.length) {
      return '<span class="tag tag-muted">无盟约</span>';
    }
    var out = '';
    for (var i = 0; i < tags.length; i++) {
      out += '<button type="button" class="tag" data-tag="' + esc(tags[i]) + '"' +
        ' style="--h:' + hue(tags[i]) + '" title="按【' + esc(tags[i]) + '】筛选">' +
        '<i class="dot"></i>' + esc(tags[i]) + '</button>';
    }
    return out;
  }

  function trgHtml(list) {
    if (!list || !list.length) return '';
    var out = '';
    for (var i = 0; i < list.length; i++) {
      out += '<span class="trg">' + esc(list[i]) + '</span>';
    }
    return out;
  }

  /* ---------------- 特殊干员 ---------------- */
  function starText(n) {
    if (!n) return '';
    return n + '★';
  }

  function specialAliasLine(o) {
    var s = o.special;
    var bits = [];
    var alias = [];
    for (var i = 0; i < (s.aliases || []).length && alias.length < 2; i++) {
      if (s.aliases[i] !== s.strategyName) alias.push(s.aliases[i]);
    }
    if (alias.length) bits.push('又称 ' + alias.join(' / '));
    if (s.strategyName) bits.push('由策略「' + s.strategyName + '」召唤');
    return esc(bits.join(' · '));
  }

  function prtsMetaLine(p) {
    var bits = [];
    if (p.class) bits.push(p.class + (p.branch ? ' / ' + p.branch : ''));
    if (p.rarity) bits.push(starText(p.rarity));
    if (p.position) bits.push(p.position);
    return bits.join(' · ');
  }

  function statTable(p) {
    var rows = p.stats || [];
    if (!rows.length) return '';
    var html = '<table class="d-table"><thead><tr>' +
      '<th>阶段</th><th>生命</th><th>攻击</th><th>防御</th><th>法抗</th>' +
      '</tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<tr><td>' + esc(r.phase) +
        ((r.level && r.phase.indexOf('1级') < 0) ? '（' + r.level + '）' : '') + '</td>' +
        '<td>' + (r.hp == null ? '—' : r.hp) + '</td>' +
        '<td>' + (r.atk == null ? '—' : r.atk) + '</td>' +
        '<td>' + (r.def == null ? '—' : r.def) + '</td>' +
        '<td>' + (r.res == null ? '—' : r.res) + '</td></tr>';
    }
    html += '</tbody></table>';
    return html;
  }

  function moduleTable(m) {
    var rows = (m && m.stats) || [];
    if (!rows.length) return '';
    var html = '<table class="d-table"><thead><tr>' +
      '<th>模组等级</th><th>生命</th><th>攻击</th><th>防御</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<tr><td>' + r.level + ' 级</td>' +
        '<td>' + (r.hp == null ? '—' : '+' + r.hp) + '</td>' +
        '<td>' + (r.atk == null ? '—' : '+' + r.atk) + '</td>' +
        '<td>' + (r.def == null ? '—' : '+' + r.def) + '</td></tr>';
    }
    html += '</tbody></table>';
    return html;
  }

  function isInTeam(name) {
    var team = Store.getTeam();
    for (var i = 0; i < team.slots.length; i++) {
      var s = team.slots[i];
      if (s && (s.k === name || s.p === name)) return true;
    }
    return false;
  }

  function teamToggleHtml(name, big) {
    var on = isInTeam(name);
    return '<button type="button" class="' + (big ? 'btn ' : '') + 'team-toggle' + (on ? ' is-in' : '') +
      '" data-team-toggle="' + esc(name) + '">' + (on ? '移出配队' : '加入配队') + '</button>';
  }

  function opCard(o, toks, st) {
    var active = st.sel === o.name ? 'is-active' : '';
    var label = '干员 ' + o.name + '，' + o.tierLabel + ' 阶，售价 ' + o.price +

  function covenantCard(c, toks, st) {

  function activationShort(c) {
    var a = c.activation;
    var emp = a.empowerThreshold;
    if (a.kind === 'count') {
      return '在场 ' + a.threshold + ' 人激活' + (emp ? ' / ' + emp + ' 人强化' : '');
    }
    if (a.kind === 'count_layer') {
      return a.threshold + ' 人激活 / ' + (a.nodes.join('·') || '-') + ' 层';
    }
    if (a.kind === 'elite') {
      return '精锐 ' + a.threshold + ' 名' + (emp ? ' / ' + emp + ' 名强化' : '');
    }
    if (c.name === '独行') return '仅 1 人时生效';
    if (c.name === '调和') return '核心盟约 +1 人';
    return '特殊规则';
  }

  /* ======================================================================
     详情
     ====================================================================== */
  function renderDrawer(st, toks) {
    var drawer = refs.drawer;
    if (!st.sel || st.view === 'about') {
      drawer.hidden = true;
      drawer.innerHTML = '';
      document.body.classList.remove('has-detail');
      document.body.classList.remove('detail-open');
      return;
    }
    var e = Store.entity(st.view, st.sel);
    if (!e) {
      drawer.hidden = true;
      drawer.innerHTML = '';
      document.body.classList.remove('has-detail');
      document.body.classList.remove('detail-open');
      return;
    }

    var html = '';
    if (st.view === 'op') html = e.pick ? pickDetail(e, toks) : opDetail(e, toks);
    else if (st.view === 'item') html = itemDetail(e, toks);
    else if (st.view === 'strategy') html = strategyDetail(e, toks);
    else html = covenantDetail(e, toks);

    drawer.innerHTML = html;
    drawer.hidden = false;
    document.body.classList.add('has-detail');
    if (global.matchMedia && global.matchMedia('(max-width: 1023px)').matches) {
      document.body.classList.add('detail-open');
    }
  }

  function specialSection(o, toks) {
    var s = o.special;
    var p = s.prts || {};
    var st = Store.entity('strategy', s.strategyKey);
    var html = '';

    html += '<div class="d-sec"><h3>特殊干员来源</h3>' +
      '<button type="button" class="d-box d-link" data-strategy="' + esc(s.strategyKey) + '">' +

      '<span class="pill">' + esc(s.strategyRole) + '</span></h4>' +
      '<p>' + (st ? Search.format(st.text, toks) : '第 1 回合获得该特殊干员') + '</p>' +
      '</button>' +
      '<p class="d-note">它不是普通干员池里的条目，默认不显示；直接搜索「' +
      esc((s.aliases || []).slice(0, 3).join('」「')) + '」或从策略详情进入。</p>' +
      (s.unpackNote ? '<p class="d-note">解包溯源：' + esc(s.unpackNote) + '</p>' : '') +
      '</div>';

    html += '<div class="d-sec"><h3>干员档案（PRTS）</h3><div class="d-box"><dl class="rule">' +
      '<dt>职业</dt><dd>' + esc(p.class || '—') + (p.branch ? ' / ' + esc(p.branch) : '') + '</dd>' +
      '<dt>星级</dt><dd>' + esc(starText(p.rarity) || '—') + '</dd>' +
      '<dt>特性</dt><dd>' + Search.format(p.trait || '—', toks) + '</dd>' +
      '<dt>位置</dt><dd>' + esc(p.position || '—') + '</dd>' +
      '<dt>标签</dt><dd>' + esc((p.tags || []).join(' / ') || '—') + '</dd>' +
      '<dt>上线</dt><dd>' + esc(s.debut || '—') + (s.debutSeason ? '（' + esc(s.debutSeason) + '）' : '') + '</dd>' +
      '<dt>召唤 ID</dt><dd><code>' + esc(s.chessId || '—') + '</code></dd>' +
      '</dl></div></div>';

    if ((p.stats || []).length) {
      html += '<div class="d-sec"><h3>属性</h3><div class="d-box">' + statTable(p) +
        '<p class="d-note">再部署 ' + esc(p.redeploy || '—') + ' · 部署费用 ' + esc(p.deployCost || '—') +
        ' · 阻挡 ' + esc(p.block || '—') + ' · 攻击间隔 ' + esc(p.attackInterval || '—') + '</p></div></div>';
    }

    var i, j;
    if ((p.talents || []).length) {
      html += '<div class="d-sec"><h3>天赋</h3>';
      for (i = 0; i < p.talents.length; i++) {
        var t = p.talents[i];
        html += '<div class="d-box"><h4>' + esc(t.slot || '') + ' · ' + esc(t.name || '') + '</h4>';
        for (j = 0; j < t.rows.length; j++) {
          html += '<p><b>' + esc(t.rows[j].cond || '—') + '</b>：' +
            Search.format(t.rows[j].effect, toks) + '</p>';
        }
        if (t.note) html += '<p class="d-note">' + Search.format(t.note, toks) + '</p>';
        html += '</div>';
      }
      html += '</div>';
    }

    if ((p.skills || []).length) {
      html += '<div class="d-sec"><h3>技能</h3>';
      for (i = 0; i < p.skills.length; i++) {
        var sk = p.skills[i];
        var rows = sk.rows || [];
        var show = [];
        for (j = 0; j < rows.length; j++) {
          if (rows[j].level === '7' || rows[j].level === '专精3') show.push(rows[j]);
        }
        if (!show.length && rows.length) show = rows.slice(-2);
        html += '<div class="d-box"><h4>' + esc(sk.name) +
          (sk.recovery ? '<span class="pill">' + esc(sk.recovery) + '</span>' : '') +
          (sk.trigger ? '<span class="pill">' + esc(sk.trigger) + '</span>' : '') +
          '</h4>';
        for (j = 0; j < show.length; j++) {
          var r = show[j];
          var lv = r.level === '专精3' ? '专精 3' : (r.level + ' 级');
          html += '<div class="skill-line"><b>' + esc(lv) + '</b>' +
            '<p>' + Search.format(r.desc, toks) + '</p>' +
            '<small>初始 ' + esc(r.init || '—') + ' · 消耗 ' + esc(r.cost || '—') +
            ' · 持续 ' + esc(r.dur || '—') + '</small></div>';
        }
        if (sk.note) html += '<p class="d-note">' + Search.format(sk.note, toks) + '</p>';
        html += '</div>';
      }
      html += '</div>';
    }

    if (p.module) {
      var m = p.module;
      html += '<div class="d-sec"><h3>模组</h3><div class="d-box"><h4>' + esc(m.name || '') +
        (m.type ? '<span class="pill">' + esc(m.type) + '</span>' : '') + '</h4>' +

        (m.trait ? '<p><b>特性追加</b>：' + Search.format(m.trait, toks) + '</p>' : '') +
        (m.talent ? '<p><b>天赋更新</b>：' + Search.format(m.talent, toks) + '</p>' : '') +
        '<p class="d-note">解锁等级 ' + esc(m.unlock || '—') + '；以上为模组 1–3 级增量。</p>' +
        '</div></div>';
    }

    var versions = (data.specialMeta && data.specialMeta.versions) || [];
    var meta = data.specialMeta || {};
    html += '<div class="d-sec"><h3>版本说明</h3><div class="d-box">' +
      '<p><b>本期主表</b>：' + esc(meta.season || data.version) + '（V3_1）</p>' +
      '<p>' + esc(s.versionNote || '') + '</p>' +
      '<p class="d-note">PRTS 页面修订 ' + esc((p.revAt || '').slice(0, 10)) +
      '（revid ' + esc(p.revid || '—') + '）。特殊干员档案只作补充，条目数值仍以解包主表为准。</p>';
    if (versions.length) {
      html += '<h4 style="margin-top:10px">卫戍协议版本对照</h4><dl class="rule">';

        '<p><b>' + esc(asResult.m1) + '</b>（' + esc(asResult.m1Tier) + ' 阶） + <b>' +

<script>

   --------------------------------------------------------------------------
   设计要点
   · 判定全部交给 calc.js（纯函数，有单测）；这里只负责渲染与交互。

   · 盟约详情走 #tip：桌面悬停、键盘聚焦、手机点按都能看，层数按当前输入代入数值。

  };
