}
[data-theme="light"] .avatar { color: hsl(var(--h, 210), 55%, 38%); }
.avatar-letter { position: relative; z-index: 0; }
.avatar-img {
  position: absolute; inset: 0; z-index: 1;
  width: 100%; height: 100%; object-fit: cover;
  background: var(--bg2);
}
.avatar-img.is-broken { display: none; }
/* 有图时隐藏底层首字：透明底图标不会再把首字透出来；坏图时 JS 移除 has-img 恢复 */
.avatar.has-img .avatar-letter { visibility: hidden; }
body.no-avatars .avatar { display: none; }

/* 道具 / 策略 / 盟约图标：透明底白色线稿统一放在深色底座上，浅色主题也清楚 */
.icon {
  position: relative; display: grid; place-items: center; flex: none;
  width: var(--size, 44px); height: var(--size, 44px);
  border-radius: 10px; overflow: hidden;
  background:
    radial-gradient(130% 120% at 30% 12%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 46%),
    linear-gradient(155deg, #2c3540 0%, #161b21 72%, #101419 100%);
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.18);
  color: hsl(var(--h, 210), 70%, 74%);
  font-weight: 700; font-size: calc(var(--size, 44px) * 0.38);
  line-height: 1; -webkit-user-select: none; user-select: none;
}
[data-theme="light"] .icon {
  border-color: rgba(15, 23, 32, 0.22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 1px 2px rgba(0, 0, 0, 0.12);
}
.icon-letter { position: relative; z-index: 0; }
.icon-img {
  position: absolute; inset: 0; z-index: 1;
  width: 100%; height: 100%; object-fit: contain;
}
.icon-img.is-broken { display: none; }
.icon.has-img .icon-letter { visibility: hidden; }
.icon-strategy { border-radius: 12px; }
.icon-strategy .icon-img { object-fit: cover; }
/* 盟约徽记：让方形透明画布铺满圆形底座；留白已在生成图里，不再用 inset 缩一次 */
.icon-covenant { border-radius: 50%; border-color: hsla(var(--h, 210), 62%, 62%, 0.42); }
body.no-avatars .icon { display: none; }

.card-badges { display: flex; align-items: center; gap: 5px; flex: none; }

.tier {
  display: inline-grid; place-items: center;
  min-width: 24px; height: 21px; padding: 0 5px;
  border-radius: 6px; font-size: 11.5px; font-weight: 800;
  font-family: var(--mono); letter-spacing: 0.01em;
  color: var(--tc, #8b98a6);
  background: var(--bg3);
  background: color-mix(in srgb, var(--tc, #8b98a6) 17%, transparent);
  border: 1px solid var(--line2);
  border-color: color-mix(in srgb, var(--tc, #8b98a6) 42%, transparent);
}
[data-tier="1"] { --tc: #8b98a6; }
[data-tier="2"] { --tc: #5fc98a; }
[data-tier="3"] { --tc: #5aa9f5; }
[data-tier="4"] { --tc: #b98cf0; }
[data-tier="5"] { --tc: #f0a04b; }
[data-tier="6"] { --tc: #f06a6a; }

.price {
  display: inline-flex; align-items: center; gap: 2px;
  height: 21px; padding: 0 6px;
  border-radius: 6px; background: var(--bg3);
  color: var(--fg2); font-size: 11.5px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.price::before { content: "◈"; font-size: 9px; opacity: 0.7; }

.card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px; border-radius: 6px;
  font: inherit; font-size: 11.5px; line-height: 1.6;
  color: hsl(var(--h, 200), 66%, 70%);
  background: hsla(var(--h, 200), 66%, 60%, 0.13);
  border: 1px solid hsla(var(--h, 200), 66%, 60%, 0.26);
  cursor: pointer; text-align: left;
  transition: filter 0.13s, border-color 0.13s;
}
.tag:hover { filter: brightness(1.14); border-color: hsla(var(--h, 200), 66%, 60%, 0.5); }
.tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
[data-theme="light"] .tag { color: hsl(var(--h, 200), 58%, 36%); }
.tag-muted {
  color: var(--fg3); background: var(--bg2); border-color: var(--line);
  --h: 210;
}

.eff {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  border-top: 1px solid var(--line); padding-top: 8px;
}
.eff-col { min-width: 0; }
.eff-h {
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  margin-bottom: 3px; font-size: 11px; color: var(--fg3);
}
.eff-h b {
  font-weight: 700; font-size: 11px; letter-spacing: 0.04em;
  color: var(--fg2);
}
.eff-h .elite { color: var(--accent2); }
.eff-col p {
  margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--fg2);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
  overflow: hidden; word-break: break-word;
}
.eff-full { grid-column: 1 / -1; }

.trg {
  display: inline-block; padding: 0 5px; border-radius: 4px;
  font-size: 10.5px; line-height: 1.6;
  color: color-mix(in srgb, var(--accent) 88%, var(--fg));
  background: rgba(91, 209, 230, 0.12);
  border: 1px solid rgba(91, 209, 230, 0.2);
  white-space: nowrap;
}
.kw { color: color-mix(in srgb, var(--accent2) 82%, var(--fg)); font-weight: 600; }
.card .kw, .card .trg { pointer-events: none; }

.card-foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 9px; padding-top: 7px; border-top: 1px dashed var(--line);
  font-size: 11px; color: var(--fg3);
}
.card-foot .sp { flex: 1 1 auto; }
.pill {
  padding: 0 6px; border-radius: 5px;
  background: var(--bg3); color: var(--fg2); font-size: 10.5px; line-height: 1.7;
}
.pill-warn { background: rgba(255, 180, 84, 0.14); color: var(--accent2); }
.pill-elite { background: rgba(255, 180, 84, 0.12); color: var(--accent2); }
.pill-core { background: rgba(91, 209, 230, 0.14); color: var(--accent); }
.pill-add { background: var(--bg3); color: var(--fg3); }
.pill-special { background: rgba(176, 132, 255, 0.16); color: #c9a7ff; }
[data-theme="light"] .pill-special { background: rgba(110, 60, 200, 0.12); color: #5b3ba8; }
.pill-pick { background: rgba(64, 196, 140, 0.16); color: #55d6a2; }
[data-theme="light"] .pill-pick { background: rgba(20, 130, 90, 0.12); color: #147a55; }
.tier-pick { background: rgba(64, 196, 140, 0.16); color: #55d6a2; }
[data-theme="light"] .tier-pick { background: rgba(20, 130, 90, 0.12); color: #147a55; }
.d-members-pick button { border-color: rgba(64, 196, 140, 0.35); }

.desc {
  margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--fg2);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
  overflow: hidden; word-break: break-word;
}
.members-mini {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;
  max-height: 24px; overflow: hidden;
}
.members-mini span {
  padding: 0 5px; border-radius: 4px;
  background: var(--bg2); color: var(--fg3); font-size: 10.5px; line-height: 1.7;
}

/* 空状态 */
.empty { padding: 64px 16px; text-align: center; }
.empty-t { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.empty-d { margin: 0 0 18px; font-size: 13.5px; color: var(--fg3); }

/* ---------- 9. 详情 ---------- */
.drawer { min-width: 0; }
@media (max-width: 1023px) {
  .drawer {
    position: fixed; z-index: 70; left: 0; right: 0; bottom: 0;
    max-height: 88vh; overflow-y: auto; overflow-x: hidden;
    padding: 6px 16px calc(26px + env(safe-area-inset-bottom, 0px));
    background: var(--bg1);
    border-top: 1px solid var(--line2);
    border-radius: 20px 20px 0 0;
    box-shadow: var(--shadow);
    animation: sheet-up 0.2s cubic-bezier(0.32, 0.72, 0.28, 1);
    overscroll-behavior: contain;
  }
  .drawer::before {
    content: ""; display: block; width: 40px; height: 4px; margin: 6px auto 10px;
    border-radius: 2px; background: var(--line2);
  }
}
@media (min-width: 1024px) {
  .drawer {
    position: sticky; top: calc(var(--topbar-h) + 46px);
    max-height: calc(100vh - var(--topbar-h) - 60px);
    overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding: 16px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg1);
    animation: fade-in 0.16s ease-out;
  }
  .drawer::-webkit-scrollbar { width: 6px; }
  .drawer::-webkit-scrollbar-track { background: transparent; }
  .drawer::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
  .drawer::-webkit-scrollbar-button { display: none; }
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.d-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.d-head-main { flex: 1 1 auto; min-width: 0; }
.d-title {
  flex: 1 1 auto; margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35;
  word-break: break-word;
}
.d-close {
  display: grid; place-items: center;
  width: 30px; height: 30px; padding: 0; flex: none;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg2); color: var(--fg2); cursor: pointer;
}
.d-close:hover { color: var(--fg); border-color: var(--line2); }
.d-sub { color: var(--fg3); font-size: 12px; margin-bottom: 10px; }
.d-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.d-meta .pill { font-size: 11px; line-height: 1.8; }

.d-sec { margin-top: 16px; }
.d-sec > h3 {
  margin: 0 0 7px; font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.d-sec > h3::after {
  content: ""; flex: 1 1 auto; height: 1px; background: var(--line);
}
.d-text { margin: 0; font-size: 13.5px; line-height: 1.7; color: var(--fg2); word-break: break-word; }
.d-text + .d-text { margin-top: 8px; }

.d-box {
  padding: 10px 12px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line);
}
.d-box + .d-box { margin-top: 8px; }
.d-box h4 {
  margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--fg2);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.d-box p { margin: 0; font-size: 13px; line-height: 1.65; color: var(--fg2); word-break: break-word; }

.d-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.d-tags .tag { font-size: 12px; padding: 2px 8px; cursor: pointer; }
.d-tags .tag:hover { filter: brightness(1.15); text-decoration: underline; }

.d-members { display: flex; flex-wrap: wrap; gap: 5px; }
.d-members button {
  padding: 3px 8px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--bg2);
  color: var(--fg2); font-size: 12px; cursor: pointer;
}
.d-members button:hover { border-color: var(--accent); color: var(--accent); }

.rule {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
  font-size: 12.5px;
}
.rule dt { color: var(--fg3); white-space: nowrap; }
.rule dd { margin: 0; color: var(--fg2); }

.nodes { display: flex; flex-wrap: wrap; gap: 6px; }
.node {
  display: inline-flex; align-items: baseline; gap: 2px;
  padding: 2px 8px; border-radius: 7px;
  background: rgba(255, 180, 84, 0.12);
  color: var(--accent2); font-size: 12px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.node small { font-size: 10px; font-weight: 500; opacity: 0.8; }

.stages { display: grid; gap: 8px; }
.stage {
  padding: 9px 11px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line);
}
.stage-h {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-bottom: 4px; font-size: 11.5px; color: var(--fg3);
}
.stage-no {
  display: inline-grid; place-items: center;
  width: 18px; height: 18px; border-radius: 5px;
  background: var(--bg3); color: var(--fg2);
  font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.stage p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--fg2); }

/* 特殊干员：PRTS 档案表格 / 技能行 / 说明 */
.d-table {
  width: 100%; border-collapse: collapse; table-layout: fixed;
  font-size: 12px; font-variant-numeric: tabular-nums;
}
.d-table th {
  padding: 3px 4px; border-bottom: 1px solid var(--line2);
  color: var(--fg3); font-weight: 600; text-align: right;
  white-space: normal; word-break: break-word;
}
.d-table td {
  padding: 4px; border-bottom: 1px solid var(--line);
  color: var(--fg2); text-align: right;
  white-space: normal; word-break: break-word;
}
.d-table th:first-child, .d-table td:first-child {
  width: 36%; text-align: left; white-space: normal;
}
.d-table tr:last-child td { border-bottom: 0; }

.skill-line { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.skill-line > b {
  display: inline-block; padding: 0 6px; border-radius: 5px;
  background: rgba(255, 180, 84, 0.12); color: var(--accent2);
  font-size: 10.5px; line-height: 1.8;
}
.skill-line p { margin: 4px 0 2px; }
.skill-line small { color: var(--fg3); font-size: 11px; font-variant-numeric: tabular-nums; }

.d-note {
  margin: 6px 0 0; font-size: 11.5px; line-height: 1.65; color: var(--fg3);
  overflow-wrap: anywhere; word-break: break-word;
}
.d-box p, .d-box h4 { overflow-wrap: anywhere; }
.d-box code {
  font-family: var(--mono); font-size: 11.5px;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bg3); color: var(--accent);
}
.d-special { display: flex; align-items: center; gap: 10px; }
.d-special .avatar { flex: none; }
.d-special h4 { margin: 0 0 2px; }
.d-special p { margin: 0; }

.d-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.d-actions .btn { flex: 1 1 auto; justify-content: center; }

/* ---------- 10. 遮罩 ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 65;
  background: rgba(0, 0, 0, 0.52);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  animation: fade-in 0.16s ease-out;
}
@media (min-width: 1024px) { body.detail-open .scrim { display: none; } }

/* ---------- 11. 关于 ---------- */
.about {
  max-width: 720px;
  background: var(--bg1); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 22px 26px;
}
.about h2 { margin: 0 0 4px; font-size: 19px; }
.about h3 {
  margin: 22px 0 8px; font-size: 13px;
  letter-spacing: 0.06em; color: var(--fg3); text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.about h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.about p, .about li { font-size: 13.5px; line-height: 1.75; color: var(--fg2); }
.about p { margin: 0 0 8px; }
.about ul { margin: 0 0 8px; padding-left: 1.15em; }
.about li { margin-bottom: 3px; }
.about code {
  font-family: var(--mono); font-size: 12px;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bg3); color: var(--accent);
}
.stats {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  margin: 6px 0 4px;
}
.stat {
  padding: 9px 11px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line);
}
.stat b {
  display: block; font-size: 18px; font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--fg);
}
.stat span { font-size: 11.5px; color: var(--fg3); }

/* ---------- 12. 页脚 ---------- */
.footer {
  max-width: var(--maxw); margin: 8px auto 0;
  padding: 18px 16px 44px;
  border-top: 1px solid var(--line);
  color: var(--fg3); font-size: 11.5px; line-height: 1.8;
}
.footer-inner { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.footer .dot-sep { opacity: 0.5; }
.footer a { color: var(--fg3); text-decoration: underline; text-underline-offset: 2px; }
.footer a:hover { color: var(--accent); }
.footer-meta { font-variant-numeric: tabular-nums; }
.footer button.linklike {
  border: 0; background: transparent; padding: 0; cursor: pointer;
  color: var(--fg3); font-size: inherit; text-decoration: underline;
  text-underline-offset: 2px;
}
.footer button.linklike:hover { color: var(--accent); }

.noscript {
  max-width: var(--maxw); margin: 20px auto; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg2); color: var(--fg2); font-size: 13px;
}

/* ---------- 12.5 补充：关于页 / 详情交叉链接 / 面板标题 ---------- */
body.view-about .layout { grid-template-columns: minmax(0, 1fr); }
body.view-about .filters,
body.view-about .drawer { display: none !important; }
.cards.is-about { display: block; }
.about { margin-bottom: 8px; }
.about .btn { margin-top: 2px; }

.filters-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px;
}
.filters-title {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--fg3); text-transform: uppercase;
}
.filters-head .fgroup-clear { color: var(--fg3); }
.filters-head .fgroup-clear:hover { color: var(--accent); text-decoration: none; }
.seg { margin-top: 8px; }
.filters-foot .btn { width: 100%; justify-content: center; }

.d-box.d-link {
  display: block; width: 100%; text-align: left;
  font: inherit; color: inherit; cursor: pointer;
  transition: border-color 0.13s, background 0.13s;
}
.d-box.d-link:hover { border-color: var(--line2); background: var(--bg3); }
.d-box.d-link:hover p { color: var(--fg); }
.d-box.d-link + .d-box.d-link { margin-top: 8px; }

.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty code, .noscript code {
  font-family: var(--mono); font-size: 12px;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bg3); color: var(--accent);
}
.members-mini span { white-space: nowrap; }

/* ---------- 13. 提示气泡 ---------- */
.toast {
  position: fixed; left: 50%; z-index: 120;
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px);
  padding: 8px 16px; border-radius: 999px;
  background: var(--fg); color: var(--bg);
  font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  max-width: 82vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 768px) {
  .toast { bottom: 32px; }
}

/* ---------- 14. 减少动效 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- 15. 配队（模拟配队 · BETA） ---------- */
body.sheet-open { overflow: hidden; }
.cards.is-team { display: block; }

@media (min-width: 1024px) {
  body.view-team .layout { grid-template-columns: minmax(0, 1fr); }
}

.tab-badge { display: none; }
@media (min-width: 768px) {
  .tab-badge {
    display: inline-block; font-style: normal;
    font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
    padding: 0 4px; border-radius: 4px; line-height: 1.7;
    color: var(--accent2); background: rgba(255, 180, 84, 0.14);
  }
}

.team { display: grid; gap: 14px; }

/* 词条工具栏：固定悬浮在界面右侧，不占内容宽度；收起后缩成贴边的竖排工具栏 */
.tm-traits {
  position: fixed; top: 160px; right: 0; z-index: 55;
  width: 320px; max-width: calc(100vw - 24px);
  max-height: calc(100vh - 180px);
  display: flex; flex-direction: column;
  min-width: 0;
  border: 1px solid var(--line); border-right: 0;
  border-radius: 14px 0 0 14px;
  background: var(--bg1);
  box-shadow: -16px 14px 38px rgba(0, 0, 0, 0.34);
  overflow: hidden;
  transition: width 0.18s ease;
}
[data-theme="light"] .tm-traits { box-shadow: -14px 12px 34px rgba(20, 40, 60, 0.16); }
.tm-traits-panel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.tm-traits-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
}
.tm-traits-title {
  flex: 1 1 auto; display: flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 650; color: var(--fg); min-width: 0;
}
.tm-traits-count {
  flex: none; padding: 0 6px; border-radius: 999px;
  background: rgba(91, 209, 230, 0.14); color: var(--accent);
  font-size: 10.5px; font-weight: 700; line-height: 1.75;
  font-variant-numeric: tabular-nums;
}
.tm-traits-toggle {
  flex: none; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg2); color: var(--fg3);
  font-size: 11px; line-height: 1.7; cursor: pointer;
  transition: border-color 0.12s, color 0.12s;
}
.tm-traits-toggle:hover { border-color: var(--line2); color: var(--fg); }
.tm-traits-layer {
  flex: none; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg2); color: var(--fg3);
  font-size: 11px; line-height: 1.7; cursor: pointer;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
}
.tm-traits-layer:hover { border-color: var(--line2); color: var(--fg); }
.tm-traits-layer[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  background: rgba(91, 209, 230, 0.14);
  color: var(--accent);
}
.tm-traits-sub {
  margin: 0; padding: 0 12px 8px;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; line-height: 1.5; color: var(--fg3);
}
.tm-traits-body { flex: 1 1 auto; padding: 2px 12px 10px; overflow-y: auto; min-height: 0; }

/* 收起后的竖排工具栏 */
.tm-traits-rail {
  display: none;
  width: 100%; min-height: 168px;
  flex-direction: column; align-items: center; justify-content: center; gap: 9px;
  padding: 14px 0;
  border: 0; background: transparent; color: var(--fg3);
  font: inherit; cursor: pointer;
}
.tm-traits-rail:hover { background: rgba(91, 209, 230, 0.06); color: var(--fg); }
.tm-traits-rail-text {
  writing-mode: vertical-rl; text-orientation: upright;
  font-size: 12px; font-weight: 650; line-height: 1;
  letter-spacing: 0.18em; color: var(--fg2);
}
.tm-traits-rail-count {
  font-size: 10.5px; font-weight: 700; line-height: 1;
  color: var(--accent); font-variant-numeric: tabular-nums;
}
.tm-traits-rail-arrow { font-size: 13px; line-height: 1; color: var(--fg3); }

.tm-traits.is-collapsed {
  width: 42px; max-height: none;
  border-radius: 12px 0 0 12px;
}
.tm-traits.is-collapsed .tm-traits-panel { display: none; }
.tm-traits.is-collapsed .tm-traits-rail { display: flex; }

@media (max-width: 1023px) {
  .tm-traits {
    top: 200px;
    width: min(320px, calc(100vw - 28px));
    max-height: calc(100vh - 280px);
  }
  .tm-traits.is-collapsed { width: 42px; }
}

.tm-tr-group { padding-top: 8px; }
.tm-tr-group + .tm-tr-group { margin-top: 7px; border-top: 1px solid var(--line); }
.tm-tr-grouphead {
  display: flex; align-items: center; gap: 6px;
  margin: 0 0 3px; font-size: 11.5px; font-weight: 600; color: var(--fg2);
}
.tm-tr-grouphead .dot {
  flex: none; width: 6px; height: 6px; border-radius: 50%;
  background: hsl(var(--h, 200), 66%, 64%);
  box-shadow: 0 0 6px hsla(var(--h, 200), 66%, 60%, 0.55);
}
.tm-tr-group.is-none .dot { background: var(--fg3); box-shadow: none; }
.tm-tr-n {
  margin-left: auto; font-size: 10px; font-weight: 500;
  color: var(--fg3); font-variant-numeric: tabular-nums;
}
.tm-tr-list { list-style: none; margin: 0; padding: 0; }
.tm-tr-item { display: flex; gap: 7px; padding: 6px 0; border-top: 1px dashed var(--line); }
.tm-tr-item:first-child { border-top: 0; }
.tm-tr-main { flex: 1 1 auto; min-width: 0; }
.tm-tr-name {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; color: var(--fg);
}
.tm-tr-elite {
  flex: none; padding: 0 4px; border-radius: 4px;
  background: rgba(255, 180, 84, 0.14); color: var(--accent2);
  font-size: 9px; font-weight: 600; line-height: 1.65;
}
.tm-tr-text {
  margin: 2px 0 0; font-size: 11.5px; line-height: 1.55;
  color: var(--fg2); word-break: break-word;
}
.tm-tr-empty {
  margin: 0; padding: 14px 2px;
  font-size: 12px; line-height: 1.6; color: var(--fg3);
}
.tm-tr-note { margin: 9px 0 0; font-size: 10.5px; color: var(--fg3); }

.tm-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tm-stats { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; }
.tm-stat {
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 4px 9px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg1);
  font-size: 11.5px; color: var(--fg3); white-space: nowrap;
}
.tm-stat b {
  font-size: 14px; font-weight: 700; color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.tm-clear { flex: none; }
.tm-hint {
  margin: 0; padding: 8px 11px; border-radius: 9px;
  border: 1px dashed var(--line2); background: var(--bg1);
  font-size: 12.5px; line-height: 1.6; color: var(--fg3);
}
.tm-hint b { color: var(--accent2); font-weight: 600; }
.tm-warn {
  margin: 0; padding: 7px 11px; border-radius: 9px;
  border: 1px solid rgba(255, 180, 84, 0.34); background: rgba(255, 180, 84, 0.1);
  font-size: 12.5px; color: var(--accent2);
}

/* 席位 */
.tm-slots {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 142px), 1fr));
}
.slot {
  position: relative; min-height: 94px;
  padding: 9px 10px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg1); color: var(--fg);
  text-align: left; font: inherit;
}
.slot-empty {
  display: grid; place-items: center; gap: 1px;
  border-style: dashed; background: transparent;
  color: var(--fg3); cursor: pointer;
  transition: border-color 0.13s, color 0.13s, background 0.13s;
}
.slot-empty:hover { border-color: var(--accent); color: var(--accent); background: rgba(91, 209, 230, 0.06); }
.slot-plus { font-size: 19px; line-height: 1; font-weight: 300; }
.slot-hint { font-size: 11px; }

.slot-filled { display: flex; flex-direction: column; gap: 6px; }
.slot-filled > * { flex: 0 0 auto; }   /* 别把「姓名/盟约」压扁 */
.slot-body {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 0; border: 0; background: transparent;
  color: inherit; text-align: left; cursor: pointer;
}
.slot-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.slot-name-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
.slot-name-row .slot-name { flex: 1 1 auto; min-width: 0; }
.slot-name-row .tier { flex: none; min-width: 20px; height: 18px; font-size: 10px; padding: 0 4px; }
.slot-name {
  font-size: 12.5px; font-weight: 650; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.slot-tags { display: flex; flex-wrap: nowrap; gap: 3px; overflow: hidden; min-height: 14px; }
.slot-tag {
  flex: none; padding: 0 3px; border-radius: 4px; font-size: 9.5px; line-height: 1.7;
  white-space: nowrap;
  color: hsl(var(--h, 200), 66%, 70%);
  background: hsla(var(--h, 200), 66%, 60%, 0.14);
}
.slot-tag-pick { --h: 155; font-weight: 600; }
[data-theme="light"] .slot-tag { color: hsl(var(--h, 200), 58%, 36%); }
.slot-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.slot-acts { display: flex; align-items: center; gap: 5px; margin-top: auto; }
.slot-price {
  flex: none; padding: 0 5px; border-radius: 5px;
  background: var(--bg3); color: var(--fg3);
  font-size: 10.5px; line-height: 1.9; font-variant-numeric: tabular-nums;
}
.slot-btn {
  flex: 1 1 auto; padding: 2px 0;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg2); color: var(--fg3);
  font-size: 10.5px; line-height: 1.7; cursor: pointer;
  transition: border-color 0.13s, color 0.13s, background 0.13s;
}
.slot-btn:hover { border-color: var(--line2); color: var(--fg); }
.slot-btn.is-on {
  border-color: color-mix(in srgb, var(--accent2) 55%, transparent);
  background: rgba(255, 180, 84, 0.16); color: var(--accent2); font-weight: 600;
}
.slot-x { flex: 0 0 30px; font-size: 13px; }
.slot-x:hover { border-color: var(--danger); color: var(--danger); }

/* 第 9 席：按网格顺序落在第 9 个格子。不要强制 grid-column: -2/-1 ——
   2 列的窄屏上那会把它推到新一行的右格，左侧留一大块空白，像是「掉队」了。 */
.slot-add {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 96px;
  border-style: dashed; background: transparent;
  color: var(--fg2); cursor: pointer;
  transition: border-color 0.13s, background 0.13s;
}
.slot-add:hover { border-color: var(--accent2); background: rgba(255, 180, 84, 0.07); }
.slot-add-icon { position: relative; flex: none; display: inline-flex; }
.slot-add-plus {
  position: absolute; right: -6px; bottom: -5px;
  display: grid; place-items: center;
  width: 17px; height: 17px; border-radius: 50%;
  background: var(--accent2); color: #22160a;
  font-size: 12px; font-weight: 800; font-style: normal; line-height: 1;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
}
.slot-add-fb {
  display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--bg3); color: var(--fg2); font-size: 15px;
}
.slot-add-text { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; text-align: center; }
.slot-add-text b { font-size: 12.5px; color: var(--fg); }
.slot-add-text small { font-size: 10.5px; color: var(--fg3); }
.tm-slots-foot { margin-top: -4px; }
.tm-slots-foot .linklike {
  border: 0; background: transparent; padding: 0; cursor: pointer;
  color: var(--fg3); font-size: 11.5px; text-decoration: underline; text-underline-offset: 2px;
}
.tm-slots-foot .linklike:hover { color: var(--accent); }

/* 盟约面板 */
.tm-cov-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tm-cov-head h2 {
  margin: 0; font-size: 12px; font-weight: 600;
  letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase;
}
.tm-cov-sum { font-size: 11.5px; color: var(--fg3); }
.tm-cov-sum b { color: var(--fg2); font-variant-numeric: tabular-nums; }
.tm-cov-sum .dot-sep { opacity: 0.5; margin: 0 4px; }

.tm-covs {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 174px), 1fr));
}
.cov {
  display: grid; gap: 6px;
  padding: 8px 9px 8px;
  border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg1);
  opacity: 0.62;
  transition: opacity 0.15s, border-color 0.15s, background 0.15s;
}
.cov.is-active { opacity: 1; border-color: rgba(91, 209, 230, 0.42); background: rgba(91, 209, 230, 0.07); }
.cov.is-empowered { opacity: 1; border-color: rgba(255, 180, 84, 0.5); background: rgba(255, 180, 84, 0.08); }
.cov.is-near { opacity: 0.92; border-color: rgba(255, 180, 84, 0.32); }
.cov.is-conflict { opacity: 1; border-color: rgba(255, 107, 107, 0.5); background: rgba(255, 107, 107, 0.08); }

.cov-top { display: flex; align-items: center; gap: 7px; }
.cov-main { flex: 1 1 auto; min-width: 0; }
.cov-name {
  font-size: 12.5px; font-weight: 650; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cov-name em { font-style: normal; font-size: 9px; font-weight: 500; color: var(--fg3); }
.cov-num { font-size: 10.5px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.cov-num b { font-size: 13px; color: var(--fg2); }
.cov.is-active .cov-num b { color: var(--accent); }
.cov.is-empowered .cov-num b { color: var(--accent2); }

.cov-bar { height: 3px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
.cov-bar i { display: block; height: 100%; background: var(--line2); transition: width 0.2s ease; }
.cov.is-near .cov-bar i { background: var(--accent2); opacity: 0.6; }
.cov.is-active .cov-bar i { background: var(--accent); }
.cov.is-empowered .cov-bar i { background: var(--accent2); }

.cov-foot { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-height: 16px; }
.cov-state { font-size: 10.5px; color: var(--fg3); }
.cov.is-active .cov-state { color: var(--accent); }
.cov.is-empowered .cov-state { color: var(--accent2); }
.cov.is-near .cov-state { color: var(--accent2); }
.cov.is-conflict .cov-state { color: var(--danger); }
.cov-bonus {
  font-size: 9.5px; padding: 0 4px; border-radius: 4px; line-height: 1.7;
  background: rgba(255, 180, 84, 0.16); color: var(--accent2);
}
.cov-layer { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--fg3); }
.cov-layer input {
  width: 46px; height: 22px; padding: 0 4px;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg2); color: var(--fg); font: inherit; font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.cov-layer input:focus { outline: none; border-color: var(--accent); }
.cov-nodes { display: inline-flex; gap: 1px; font-variant-numeric: tabular-nums; }
.cov-nodes b { color: var(--accent2); }
.cov-nodes i { font-style: normal; opacity: 0.5; }

/* 点亮 / 灰暗：同一张线稿，用滤镜与光晕表达状态 */
.cov .icon { transition: filter 0.18s, box-shadow 0.18s; }
.cov.is-inactive .icon-img, .cov.is-near .icon-img { filter: grayscale(0.55) brightness(0.7); opacity: 0.8; }
.cov.is-active .icon { box-shadow: 0 0 0 1px rgba(91, 209, 230, 0.5), 0 0 14px rgba(91, 209, 230, 0.32); }
.cov.is-active .icon-img { filter: brightness(1.18) saturate(1.1); }
.cov.is-empowered .icon { box-shadow: 0 0 0 1px rgba(255, 180, 84, 0.55), 0 0 16px rgba(255, 180, 84, 0.36); }
.cov.is-empowered .icon-img { filter: brightness(1.2) saturate(1.15); }
.cov.is-conflict .icon { box-shadow: 0 0 0 1px rgba(255, 107, 107, 0.5); }
.cov.is-conflict .icon-img { filter: grayscale(0.3) brightness(0.85); }

/* 选人面板 */
.sheet {
  position: fixed; z-index: 72;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 24px));
  max-height: min(78vh, 720px);
  display: flex; flex-direction: column;
  background: var(--bg1);
  border: 1px solid var(--line2); border-radius: 16px;
  box-shadow: var(--shadow);
  animation: fade-in 0.14s ease-out;
  overflow: hidden;
}
@media (max-width: 639px) {
  .sheet {
    left: 0; right: 0; top: auto; bottom: 0;
    transform: none; width: auto;
    max-height: 86vh;
    border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    animation: sheet-up 0.2s cubic-bezier(0.32, 0.72, 0.28, 1);
  }
}
/* 矮屏（手机横屏等）：面板尽量占满可用高度，别只剩两行列表 */
@media (max-height: 560px) {
  .sheet { max-height: calc(100vh - 16px); }
}
.sheet-in { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 8px; border-bottom: 1px solid var(--line);
  flex: none;
}
.sheet-title { flex: 1 1 auto; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.sheet-title b { font-size: 15px; font-weight: 650; }
.sheet-title small { font-size: 11px; color: var(--fg3); }
.sheet-search { position: relative; display: flex; align-items: center; padding: 10px 14px 6px; flex: none; }
.sheet-search .ico { position: absolute; left: 25px; color: var(--fg3); pointer-events: none; }
.sheet-search input {
  width: 100%; height: 36px; padding: 0 12px 0 34px;
  border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg2); color: var(--fg);
  font: inherit; font-size: 13.5px;
}
.sheet-search input:focus { outline: none; border-color: var(--accent); }
.sheet-filters {
  display: grid; gap: 6px; padding: 4px 14px 9px;
  border-bottom: 1px solid var(--line); flex: none;
}
.sheet-filters.is-collapsed { display: none; }
.sheet-row { display: flex; flex-wrap: wrap; gap: 5px; }
/* 盟约标签完整换行显示，不再放进固定高的小滚动区里 */
.sheet-row-tags { overflow: visible; }
.chip-tag { font-size: 11px; padding: 2px 6px; min-height: 23px; }
.sheet-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
.sheet-list::-webkit-scrollbar { width: 6px; }
.sheet-list::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }

.pick {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 8px; border: 0; border-radius: 9px;
  background: transparent; color: var(--fg);
  text-align: left; cursor: pointer;
  transition: background 0.12s;
}
.pick:hover { background: var(--bg2); }
.pick.is-used { opacity: 0.45; cursor: default; }
.pick.is-used:hover { background: transparent; }
.pick-flex-entry { border: 1px solid rgba(64, 196, 140, 0.3); background: rgba(64, 196, 140, 0.05); }
.pick-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pick-name {
  font-size: 13.5px; font-weight: 600; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pick-tags { display: flex; flex-wrap: wrap; gap: 3px; }
.pick-tag {
  padding: 0 4px; border-radius: 4px; font-size: 10px; line-height: 1.6;
  color: hsl(var(--h, 200), 66%, 70%);
  background: hsla(var(--h, 200), 66%, 60%, 0.13);
}
[data-theme="light"] .pick-tag { color: hsl(var(--h, 200), 58%, 36%); }
.pick-tag.is-muted { color: var(--fg3); background: var(--bg3); }
.pick-tier { flex: none; }
.pick-act {
  flex: none; width: 44px; text-align: right;
  font-size: 14px; color: var(--accent); font-weight: 600;
}
.pick.is-used .pick-act { font-size: 10px; color: var(--fg3); font-weight: 500; }
.pick-empty { margin: 0; padding: 28px 12px; text-align: center; font-size: 13px; color: var(--fg3); }

/* 配队视图里没有「全站搜索」，搜索框让位给选人面板自己的搜索 */
body.view-team .search { display: none; }

/* ---------- 16. 配队：装备 / 转职 / 悬停详情 / 拖拽 ---------- */
.slot { min-height: 96px; }

/* 装备栏 */
.slot-gear { display: flex; align-items: center; gap: 4px; }
.gear-chip {
  display: grid; place-items: center;
  width: 24px; height: 24px; padding: 0;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg2); cursor: pointer;
  transition: border-color 0.12s, transform 0.12s;
}
.gear-chip:hover { border-color: var(--accent); transform: translateY(-1px); }
.gear-chip .icon { border: 0; background: #11161c; box-shadow: none; }
.gear-fb { font-size: 10px; color: var(--fg3); }
.gear-add {
  width: 24px; height: 24px; padding: 0;
  border: 1px dashed var(--line2); border-radius: 6px;
  background: transparent; color: var(--fg3);
  font-size: 12px; line-height: 1; cursor: pointer;
}
.gear-add:hover { border-color: var(--accent); color: var(--accent); }

/* 转职（变形同构体） */
.slot-morph { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--fg3); }
.slot-morph b { font-weight: 650; color: hsl(var(--h, 200), 66%, 70%); }
[data-theme="light"] .slot-morph b { color: hsl(var(--h, 200), 58%, 36%); }
.slot-morph select {
  flex: 1 1 auto; min-width: 0; height: 22px; padding: 0 4px;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg2); color: var(--fg); font: inherit; font-size: 11px;
}
.slot-morph.is-ask span { color: var(--accent2); }

/* 拖拽 */
.slot-grip { flex: 0 0 22px; cursor: grab; touch-action: none; letter-spacing: -1px; }
body.is-dragging { cursor: grabbing; -webkit-user-select: none; user-select: none; }
body.is-dragging .slot { pointer-events: none; }
.drag-ghost {
  position: fixed; z-index: 100; pointer-events: none;
  opacity: 0.92; transform: rotate(-1.2deg);
  box-shadow: var(--shadow);
}
.slot.is-drag-source { opacity: 0.3; }
.slot.is-drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; }

/* 盟约块可点开详情 */
.cov { cursor: pointer; }
.cov:hover { border-color: var(--line2); }
.cov:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cov-cal { font-style: normal; color: var(--accent); font-size: 10px; }

/* 悬停 / 点按详情 */
.tip {
  position: fixed; z-index: 90;
  max-width: 360px; max-height: 70vh; overflow: hidden;
  padding: 12px 14px;
  border: 1px solid var(--line2); border-radius: 12px;
  background: var(--bg1);
  box-shadow: var(--shadow);
  font-size: 12.5px; line-height: 1.65; color: var(--fg2);
  animation: fade-in 0.12s ease-out;
  pointer-events: none;
}
.tip-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.tip-head b { font-size: 14.5px; font-weight: 700; color: var(--fg); }
.tip-sec { margin-top: 8px; }
.tip-sec h4 {
  margin: 0 0 3px; font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase;
}
.tip-sec p { margin: 0; word-break: break-word; }
.tip-sec p + p { margin-top: 4px; }
.tip-now b { color: var(--accent); font-variant-numeric: tabular-nums; }
.tip-foot {
  margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--fg3);
}
[data-theme="light"] .tip { box-shadow: 0 14px 40px rgba(20, 40, 60, 0.2); }

/* 选装备列表 */
.pick-gear .pick-eff {
  font-size: 10.5px; color: var(--fg3); line-height: 1.45;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pick-tier em { font-style: normal; font-size: 10px; color: var(--fg3); margin-left: 4px; }
.pick-unequip { color: var(--danger); }
.pick-unequip .pick-name { font-weight: 600; }

/* 点按固定（手机）后允许在详情里滚动查看长文本 */
.tip[data-pinned="1"] { pointer-events: auto; overflow-y: auto; }
.tip[data-pinned="1"]::-webkit-scrollbar { width: 6px; }
.tip[data-pinned="1"]::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }

/* 批量添加 */
.tm-actions { display: flex; gap: 6px; flex: none; }
.sheet-fltbtn {
  flex: none; padding: 3px 8px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg2); color: var(--fg3);
  font-size: 11.5px; line-height: 1.6; cursor: pointer;
  transition: border-color 0.13s, color 0.13s, background 0.13s;
}
.sheet-fltbtn:hover { border-color: var(--line2); color: var(--fg); }
.sheet-fltbtn[aria-expanded="true"] {
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  background: rgba(91, 209, 230, 0.14);
  color: var(--accent);
}
.sheet-fltbtn .badge { margin-left: 4px; }
.sheet-batch {
  flex: none; padding: 3px 8px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg2); color: var(--fg3);
  font-size: 11.5px; line-height: 1.6; cursor: pointer;
  transition: border-color 0.13s, color 0.13s, background 0.13s;
}
.sheet-batch:hover { border-color: var(--line2); color: var(--fg); }
.sheet-batch[aria-pressed="true"] {

  .sheet-title small { display: none; }   /* 窄屏优先留出开关与关闭 */
}

/* 搜索框的焦点环用边框表达，避免和全局 focus-visible 叠成双层 */
.sheet-search input:focus-visible { outline: none; }

/* 数值排版：结果蓝色在前、算式灰色在后 */
.num {
  color: #4aa8ff; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
[data-theme="light"] .num { color: #0b6bcb; }
.formula { color: var(--fg3); font-size: 11.5px; }

.share-box { display: grid; gap: 8px; padding: 12px 14px; min-height: 0; }
.sheet-ta {
  width: 100%; min-height: 118px; resize: vertical;
  padding: 10px 12px;

}

.share-hint { margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--fg3); }

.import-state {

}
.import-state.is-bad {
  border-style: solid; border-color: rgba(255, 107, 107, 0.45);
  background: rgba(255, 107, 107, 0.08); color: var(--danger);

.import-state b { color: var(--fg); }
.import-state .is-warn { display: block; margin-top: 4px; font-style: normal; color: var(--accent2); }
.sheet-foot {
  display: flex; gap: 8px; justify-content: flex-end; flex: none;
  padding: 10px 14px 14px; border-top: 1px solid var(--line);

<script>
/* ==========================================================================
   store.js — 状态 + URL hash 双向同步
   --------------------------------------------------------------------------
   设计要点
   · 所有状态可序列化，URL 即状态：复制地址栏即可还原视图 / 搜索 / 筛选 / 详情。
   · 只依赖 location.hash，不依赖 history API 的服务端回退，所以：
       - file:// 双击可开
       - 部署在任意子目录（/gspa/、B站 Toy 静态包）都能用
       - 不需要 nginx try_files 重写
   · history.replaceState 在 file:// (origin null) 会抛 SecurityError，
     这里统一 try/catch 回退到 location.hash，保证双击打开也能分享。
   ========================================================================== */
(function (global) {
  'use strict';

  var VIEWS = ['op', 'item', 'strategy', 'covenant', 'team', 'about'];

  // URL 里的短名（#/cov/炎 与 #/covenant/炎 都认，输出用 cov）
  var PATH_OF = { op: 'op', item: 'item', strategy: 'strategy', covenant: 'cov', team: 'team', about: 'about' };
  var VIEW_OF_PATH = {
    op: 'op', item: 'item', strategy: 'strategy',
    cov: 'covenant', covenant: 'covenant', team: 'team', about: 'about'
  };

  var TEAM_SIZE = 8;
  var TEAM_MAX = 9;
  var ITEMS_MAX = 2;

  var DEFAULTS = {
    view: 'op',
    q: '',
    tiers: [],
    tags: [],
    tagMode: 'and',      // 'and' | 'or'
    triggers: [],
    prices: [],
    itypes: [],
    icats: [],
    otypes: [],
    ranks: [],
    sort: 'default',
    hidden: false,
    sel: null,
    team: { size: TEAM_SIZE, slots: [], layers: {} }
  };

  var state = clone(DEFAULTS);
  var listeners = [];
  var data = null;
  var maps = { op: null, item: null, strategy: null, covenant: null };
  var writing = false;

  /* ---------------- 工具 ---------------- */
  function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function eq(a, b) {
    return JSON.stringify(a) === JSON.stringify(b);
  }

  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  function toInt(s) {
    var n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  function uniq(arr) {
    var out = [], seen = {};
    for (var i = 0; i < arr.length; i++) {
      var k = String(arr[i]);
      if (!seen[k]) { seen[k] = 1; out.push(arr[i]); }
    }
    return out;
  }

  function splitList(value) {
    if (!value) return [];
    var parts = String(value).split(',');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var p = safeDecode(parts[i]);
      if (p) out.push(p);
    }
    return uniq(out);
  }

  var ROMAN_TIER = { I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6 };

  function parseTiers(value) {
    var out = [];
    var list = splitList(value);
    for (var i = 0; i < list.length; i++) {
      var n = toInt(list[i]);
      if (n === null) n = ROMAN_TIER[String(list[i]).toUpperCase()] || null;
      if (n !== null && n >= 0 && n <= 6 && out.indexOf(n) < 0) out.push(n);
    }
    return out;
  }

  function encodeList(arr) {
    var out = [];
    for (var i = 0; i < arr.length; i++) out.push(encodeURIComponent(String(arr[i])));
    return out.join(',');
  }

  /* 自选干员的查询投影：和普通干员放进同一个 op 列表，
     用 tier=0 / tierLabel=自选 作为与阶数并列的标签。 */
  function pickOps(picks) {
    var out = [];
    for (var i = 0; i < (picks || []).length; i++) {
      var p = picks[i];
      out.push({
        key: p.name, name: p.name, tier: 0, tierLabel: '自选',
        tags: p.tags || [], type: '自选干员', hidden: false, price: 4,
        normalText: '无特质（自选干员）', eliteText: '无特质（自选干员）',
        normalTrigger: '—', eliteTrigger: '—',
        normalTriggers: [], eliteTriggers: [],
        avatar: p.avatar, avatarFull: p.avatarFull,
        pick: true, rarity: 6, star: '6★',
        class: p.class, branch: p.branch, nation: p.nation,

      });
    }
    return out;
  }

  function allOps(payload) {
    return (payload.operators || []).concat(pickOps(payload.picks || []));
  }

  /* ---------------- 初始化 ---------------- */
  function init(payload) {
    data = payload;
    data._allOps = allOps(payload);
    maps.op = indexBy(data._allOps, function (o) { return o.name; });
    maps.item = indexBy(payload.items, function (o) { return o.name; });
    maps.strategy = indexBy(payload.strategies, function (o) { return o.key; });
    maps.covenant = indexBy(payload.covenants, function (o) { return o.name; });
    var byId = indexBy(payload.covenants, function (o) { return o.id; });
    for (var id in byId) {
      if (byId.hasOwnProperty(id) && !maps.covenant[id]) maps.covenant[id] = byId[id];
    }
    return data;
  }

  function indexBy(list, keyFn) {
    var m = {};
    for (var i = 0; i < list.length; i++) m[keyFn(list[i])] = list[i];
    return m;
  }

  function getData() { return data; }

  function entity(view, key) {
    if (!key) return null;
    var m = maps[view];
    return (m && m[key]) || null;
  }

  function listOf(view) {
    if (!data) return [];
    if (view === 'op') return data._allOps || data.operators;
    if (view === 'item') return data.items;
    if (view === 'strategy') return data.strategies;
    if (view === 'covenant') return data.covenants;
    return [];
  }

  function covenantByName(name) {
    return (maps.covenant && maps.covenant[name]) || null;
  }

  /* ---------------- URL 解析 ---------------- */
  function parseHash(hash) {
    var next = clone(DEFAULTS);
    var raw = String(hash || '').replace(/^#/, '');
    if (!raw) return next;

    var qi = raw.indexOf('?');
    var path = qi < 0 ? raw : raw.slice(0, qi);
    var query = qi < 0 ? '' : raw.slice(qi + 1);

    var segs = path.split('/');
    var parts = [];
    for (var i = 0; i < segs.length; i++) {
      if (segs[i]) parts.push(safeDecode(segs[i]));
    }
    var view = parts[0] || 'op';
    view = VIEW_OF_PATH[view] || 'op';
    next.view = view;
    if (parts[1]) next.sel = parts[1];

    if (!query) return next;
    var pairs = query.split('&');
    var rawT = null, rawBs = null, rawL = null, rawE = null, rawIt = null, rawM = null, rawC = null, rawP = null;
    for (var p = 0; p < pairs.length; p++) {
      if (!pairs[p]) continue;
      var idx = pairs[p].indexOf('=');
      var key = idx < 0 ? pairs[p] : pairs[p].slice(0, idx);
      var val = idx < 0 ? '' : pairs[p].slice(idx + 1);
      switch (key) {
        case 'q': next.q = safeDecode(val.replace(/\+/g, ' ')); break;
        case 'tier': next.tiers = parseTiers(val); break;
        case 'tag': next.tags = splitList(val); break;
        case 'tm': next.tagMode = val === 'or' ? 'or' : 'and'; break;
        case 'trg': next.triggers = splitList(val); break;
        case 'price': next.prices = onlyNums(splitList(val)); break;
        case 'itype': next.itypes = splitList(val); break;
        case 'icat': next.icats = splitList(val); break;
        case 'otype': next.otypes = splitList(val); break;
        case 'rank': next.ranks = splitList(val); break;
        case 'sort': next.sort = val || 'default'; break;
        case 'hidden': next.hidden = oflag(val); break;
        case 't': rawT = val; break;
        case 'bs': rawBs = val; break;
        case 'L': rawL = val; break;
        case 'e': rawE = val; break;
        case 'it': rawIt = val; break;
        case 'm': rawM = val; break;
        case 'p': rawP = val; break;
        case 'c': rawC = val; break;
        default: break;
      }
    }

    // 配队：先定席位数，再按位解析（空位用空串占位，保持位置）
    var size = clampSize(toInt(rawBs));
    var slots = parseSlots(rawT, size);
    applyElites(rawE, slots);
    applyItems(rawIt, slots);
    applyMorph(rawM, slots);
    applyPicks(rawP, slots);
    next.team = {
      size: Math.max(size, slots.length),
      slots: slots,
      layers: parseLayers(rawL)
    };

    // ?c=GSPA2.xxx：分享链接直接带整队，优先级最高
    if (rawC && global.Code && data) {
      var dec = global.Code.decode(safeDecode(rawC), data);
      if (dec && dec.team) next.team = dec.team;
    }
    next.team = normalizeTeam(next.team);
    return next;
  }

  function clampSize(n) {
    if (n === null || n === undefined) return TEAM_SIZE;
    if (n < 1) return 1;
    if (n > TEAM_MAX) return TEAM_MAX;
    return n;
  }

  function parseSlots(value, size) {
    var out = [];
    if (value) {
      var parts = String(value).split(',');
      for (var i = 0; i < parts.length && i < TEAM_MAX; i++) {
        var raw = parts[i];
        if (!raw) { out.push(null); continue; }
        var elite = false;
        if (raw.charAt(raw.length - 1) === '*') { elite = true; raw = raw.slice(0, -1); }
        var name = safeDecode(raw);
        out.push(name ? { k: name, e: elite } : null);
      }
    }
    var n = Math.min(TEAM_MAX, Math.max(size || TEAM_SIZE, out.length));
    while (out.length < n) out.push(null);
    return out.slice(0, n);
  }

  function parseLayers(value) {
    var out = {};
    if (!value) return out;
    var parts = String(value).split(',');
    for (var i = 0; i < parts.length; i++) {
      var raw = parts[i];
      if (!raw) continue;
      var idx = raw.lastIndexOf(':');
      if (idx <= 0) continue;
      var name = safeDecode(raw.slice(0, idx));
      var n = toInt(raw.slice(idx + 1));
      if (name && n !== null && n > 0) out[name] = n;
    }
    return out;
  }

  function encodeSlots(slots) {
    var out = [];
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      out.push(s && s.k ? encodeURIComponent(String(s.k)) : '');
    }
    // 末尾空位可以省掉；解析时按 bs 补齐
    while (out.length && out[out.length - 1] === '') out.pop();
    return out.join(',');
  }

  function applyElites(value, slots) {
    if (!value) return;
    var parts = String(value).split(',');
    for (var i = 0; i < parts.length; i++) {
      var idx = toInt(parts[i]);
      if (idx !== null && idx >= 0 && idx < slots.length && slots[idx]) slots[idx].e = true;
    }
  }

  function applyItems(value, slots) {
    if (!value) return;
    var parts = String(value).split(',');
    for (var i = 0; i < parts.length; i++) {
      var raw = parts[i];
      if (!raw) continue;
      var at = raw.indexOf(':');
      if (at <= 0) continue;
      var idx = toInt(raw.slice(0, at));
      if (idx === null || idx < 0 || idx >= slots.length || !slots[idx]) continue;
      var names = raw.slice(at + 1).split('+');
      var out = [];
      for (var j = 0; j < names.length && out.length < ITEMS_MAX; j++) {
        var seg = names[j];
        var elite = false;
        if (seg.charAt(seg.length - 1) === '*') { elite = true; seg = seg.slice(0, -1); }
        var n = safeDecode(seg);
        if (!n) continue;
        var dup = false;
        for (var k = 0; k < out.length; k++) if (out[k].k === n) dup = true;
        if (!dup) out.push({ k: n, e: elite });
      }
      if (out.length) slots[idx].it = out;
    }
  }

  function applyMorph(value, slots) {
    if (!value) return;
    var parts = String(value).split(',');
    for (var i = 0; i < parts.length; i++) {
      var raw = parts[i];
      if (!raw) continue;
      var at = raw.indexOf(':');
      if (at <= 0) continue;
      var idx = toInt(raw.slice(0, at));
      var cov = safeDecode(raw.slice(at + 1));
      if (idx !== null && idx >= 0 && idx < slots.length && slots[idx] && cov) slots[idx].m = cov;
    }
  }

  /* 自选干员：p= 与 t= 平行，按席位、空段占位；p-only 席位不依赖占位行 */
  function applyPicks(value, slots) {
    if (!value) return;
    var parts = String(value).split(',');
    for (var i = 0; i < parts.length && i < slots.length; i++) {
      var raw = parts[i];
      if (!raw) continue;
      var name = safeDecode(raw);
      if (!name) continue;
      if (!slots[i]) slots[i] = { e: false };
      slots[i].p = name;
    }
  }

  function encodePicks(slots) {
    var out = [];
    var any = false;
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      if (s && s.p) { out.push(encodeURIComponent(String(s.p))); any = true; }
      else out.push('');
    }
    while (out.length && out[out.length - 1] === '') out.pop();
    return any ? out.join(',') : '';
  }

  function encodeElites(slots) {
    var out = [];
    for (var i = 0; i < slots.length; i++) {
      if (slots[i] && slots[i].e) out.push(i);
    }
    return out.join(',');
  }

  function encodeItems(slots) {
    var out = [];
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      if (!s || !s.it || !s.it.length) continue;
      var names = [];
      for (var j = 0; j < s.it.length && j < ITEMS_MAX; j++) {
        var it = normItem(s.it[j]);
        if (!it) continue;
        names.push(encodeURIComponent(it.k) + (it.e ? '*' : ''));
      }
      if (names.length) out.push(i + ':' + names.join('+'));
    }
    return out.join(',');
  }

  function encodeMorph(slots) {
    var out = [];
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      if (s && s.m) out.push(i + ':' + encodeURIComponent(s.m));
    }
    return out.join(',');
  }  function encodeLayers(layers) {
    var out = [];
    for (var k in layers) {
      if (!layers.hasOwnProperty(k)) continue;
      var n = toInt(layers[k]);
      if (n !== null && n > 0) out.push(encodeURIComponent(k) + ':' + n);
    }
    return out.join(',');
  }

  function hasSlots(slots) {
    for (var i = 0; i < slots.length; i++) {
      if (slots[i] && (slots[i].k || slots[i].p)) return true;
    }
    return false;
  }

  function onlyNums(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var n = toInt(list[i]);
      if (n !== null && out.indexOf(n) < 0) out.push(n);
    }
    return out;
  }

  function oflag(v) {
    return v === '1' || v === 'true' || v === 'yes';
  }

  /* ---------------- URL 生成 ---------------- */
  function buildUrl(s) {
    var path = '/' + (PATH_OF[s.view] || s.view);
    if (s.sel) path += '/' + encodeURIComponent(s.sel);

    var qs = [];
    if (s.q) qs.push('q=' + encodeURIComponent(s.q));
    if (s.tiers && s.tiers.length) qs.push('tier=' + encodeList(s.tiers));
    if (s.tags && s.tags.length) qs.push('tag=' + encodeList(s.tags));
    if (s.tags && s.tags.length && s.tagMode === 'or') qs.push('tm=or');
    if (s.triggers && s.triggers.length) qs.push('trg=' + encodeList(s.triggers));
    if (s.prices && s.prices.length) qs.push('price=' + encodeList(s.prices));
    if (s.itypes && s.itypes.length) qs.push('itype=' + encodeList(s.itypes));
    if (s.icats && s.icats.length) qs.push('icat=' + encodeList(s.icats));
    if (s.otypes && s.otypes.length) qs.push('otype=' + encodeList(s.otypes));
    if (s.ranks && s.ranks.length) qs.push('rank=' + encodeList(s.ranks));
    if (s.sort !== 'default') qs.push('sort=' + encodeURIComponent(s.sort));
    if (s.hidden) qs.push('hidden=1');

    // 配队状态在所有视图里都带上，切视图 / 刷新 / 分享都不会丢队
    if (s.team) {
      if (hasSlots(s.team.slots)) qs.push('t=' + encodeSlots(s.team.slots));
      if (s.team.size === TEAM_MAX) qs.push('bs=' + TEAM_MAX);
      var el = encodeElites(s.team.slots);
      if (el) qs.push('e=' + el);
      var its = encodeItems(s.team.slots);
      if (its) qs.push('it=' + its);
      var mo = encodeMorph(s.team.slots);
      if (mo) qs.push('m=' + mo);
      var pk = encodePicks(s.team.slots);
      if (pk) qs.push('p=' + pk);
      var ly = encodeLayers(s.team.layers || {});
      if (ly) qs.push('L=' + ly);
    }

    return '#' + path + (qs.length ? '?' + qs.join('&') : '');
  }

  function currentHash() {
    return global.location.hash || '';
  }

  function writeUrl(hash, push) {
    if (hash === currentHash()) return;
    writing = true;
    try {
      if (push && global.history && global.history.pushState) {
        global.history.pushState(null, '', hash);
      } else if (global.history && global.history.replaceState) {
        global.history.replaceState(null, '', hash);
      } else {
        global.location.hash = hash.slice(1);
      }
    } catch (e) {
      // file:// 等 origin 为 null 的环境
      try { global.location.hash = hash.slice(1); } catch (e2) { /* 忽略 */ }
    }
