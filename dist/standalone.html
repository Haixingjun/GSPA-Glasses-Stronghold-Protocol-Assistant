  color: var(--tc, #8b98a6);
  background: var(--bg3);
  background: color-mix(in srgb, var(--tc, #8b98a6) 17%, transparent);
  border: 1px solid var(--line2);
  border-color: color-mix(in srgb, var(--tc, #8b98a6) 42%, transparent);
}
[data-tier="1"] { --tc: #8b98a6; }
[data-tier="2"] { --tc: #5fc98a; }
[data-tier="3"] { --tc: #5aa9f5; }
[data-tier="4"] { --tc: #b98cf0; }
[data-tier="5"] { --tc: #f0a04b; }
[data-tier="6"] { --tc: #f06a6a; }

.price {
  display: inline-flex; align-items: center; gap: 2px;
  height: 21px; padding: 0 6px;
  border-radius: 6px; background: var(--bg3);
  color: var(--fg2); font-size: 11.5px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.price::before { content: "◈"; font-size: 9px; opacity: 0.7; }

.card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px; border-radius: 6px;
  font: inherit; font-size: 11.5px; line-height: 1.6;
  color: hsl(var(--h, 200), 66%, 70%);
  background: hsla(var(--h, 200), 66%, 60%, 0.13);
  border: 1px solid hsla(var(--h, 200), 66%, 60%, 0.26);
  cursor: pointer; text-align: left;
  transition: filter 0.13s, border-color 0.13s;
}
.tag:hover { filter: brightness(1.14); border-color: hsla(var(--h, 200), 66%, 60%, 0.5); }
.tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
[data-theme="light"] .tag { color: hsl(var(--h, 200), 58%, 36%); }
.tag-muted {
  color: var(--fg3); background: var(--bg2); border-color: var(--line);
  --h: 210;
}

.eff {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  border-top: 1px solid var(--line); padding-top: 8px;
}
.eff-col { min-width: 0; }
.eff-h {
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  margin-bottom: 3px; font-size: 11px; color: var(--fg3);
}
.eff-h b {
  font-weight: 700; font-size: 11px; letter-spacing: 0.04em;
  color: var(--fg2);
}
.eff-h .elite { color: var(--accent2); }
.eff-col p {
  margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--fg2);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
  overflow: hidden; word-break: break-word;
}
.eff-full { grid-column: 1 / -1; }

.trg {
  display: inline-block; padding: 0 5px; border-radius: 4px;
  font-size: 10.5px; line-height: 1.6;
  color: color-mix(in srgb, var(--accent) 88%, var(--fg));
  background: rgba(91, 209, 230, 0.12);
  border: 1px solid rgba(91, 209, 230, 0.2);
  white-space: nowrap;
}
.kw { color: color-mix(in srgb, var(--accent2) 82%, var(--fg)); font-weight: 600; }
.card .kw, .card .trg { pointer-events: none; }

.card-foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 9px; padding-top: 7px; border-top: 1px dashed var(--line);
  font-size: 11px; color: var(--fg3);
}
.card-foot .sp { flex: 1 1 auto; }
.pill {
  padding: 0 6px; border-radius: 5px;
  background: var(--bg3); color: var(--fg2); font-size: 10.5px; line-height: 1.7;
}
.pill-warn { background: rgba(255, 180, 84, 0.14); color: var(--accent2); }
.pill-elite { background: rgba(255, 180, 84, 0.12); color: var(--accent2); }

.desc {
  margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--fg2);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
  overflow: hidden; word-break: break-word;
}
.members-mini {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;
  max-height: 24px; overflow: hidden;
}
.members-mini span {
  padding: 0 5px; border-radius: 4px;
  background: var(--bg2); color: var(--fg3); font-size: 10.5px; line-height: 1.7;
}

/* 空状态 */
.empty { padding: 64px 16px; text-align: center; }
.empty-t { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.empty-d { margin: 0 0 18px; font-size: 13.5px; color: var(--fg3); }

/* ---------- 9. 详情 ---------- */
.drawer { min-width: 0; }
@media (max-width: 1023px) {
  .drawer {
    position: fixed; z-index: 70; left: 0; right: 0; bottom: 0;
    max-height: 88vh; overflow-y: auto;
    padding: 6px 16px calc(26px + env(safe-area-inset-bottom, 0px));
    background: var(--bg1);
    border-top: 1px solid var(--line2);
    border-radius: 20px 20px 0 0;
    box-shadow: var(--shadow);
    animation: sheet-up 0.2s cubic-bezier(0.32, 0.72, 0.28, 1);
    overscroll-behavior: contain;
  }
  .drawer::before {
    content: ""; display: block; width: 40px; height: 4px; margin: 6px auto 10px;
    border-radius: 2px; background: var(--line2);
  }
}
@media (min-width: 1024px) {
  .drawer {
    position: sticky; top: calc(var(--topbar-h) + 46px);
    max-height: calc(100vh - var(--topbar-h) - 60px);
    overflow-y: auto; overscroll-behavior: contain;
    padding: 16px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg1);
    animation: fade-in 0.16s ease-out;
  }
  .drawer::-webkit-scrollbar { width: 6px; }
  .drawer::-webkit-scrollbar-track { background: transparent; }
  .drawer::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
  .drawer::-webkit-scrollbar-button { display: none; }
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.d-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.d-head-main { flex: 1 1 auto; min-width: 0; }
.d-title {
  flex: 1 1 auto; margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35;
  word-break: break-word;
}
.d-close {
  display: grid; place-items: center;
  width: 30px; height: 30px; padding: 0; flex: none;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg2); color: var(--fg2); cursor: pointer;
}
.d-close:hover { color: var(--fg); border-color: var(--line2); }
.d-sub { color: var(--fg3); font-size: 12px; margin-bottom: 10px; }
.d-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.d-meta .pill { font-size: 11px; line-height: 1.8; }

.d-sec { margin-top: 16px; }
.d-sec > h3 {
  margin: 0 0 7px; font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.d-sec > h3::after {
  content: ""; flex: 1 1 auto; height: 1px; background: var(--line);
}
.d-text { margin: 0; font-size: 13.5px; line-height: 1.7; color: var(--fg2); word-break: break-word; }
.d-text + .d-text { margin-top: 8px; }

.d-box {
  padding: 10px 12px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line);
}
.d-box + .d-box { margin-top: 8px; }
.d-box h4 {
  margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--fg2);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.d-box p { margin: 0; font-size: 13px; line-height: 1.65; color: var(--fg2); word-break: break-word; }

.d-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.d-tags .tag { font-size: 12px; padding: 2px 8px; cursor: pointer; }
.d-tags .tag:hover { filter: brightness(1.15); text-decoration: underline; }

.d-members { display: flex; flex-wrap: wrap; gap: 5px; }
.d-members button {
  padding: 3px 8px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--bg2);
  color: var(--fg2); font-size: 12px; cursor: pointer;
}
.d-members button:hover { border-color: var(--accent); color: var(--accent); }

.rule {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
  font-size: 12.5px;
}
.rule dt { color: var(--fg3); white-space: nowrap; }
.rule dd { margin: 0; color: var(--fg2); }

.nodes { display: flex; flex-wrap: wrap; gap: 6px; }
.node {
  display: inline-flex; align-items: baseline; gap: 2px;
  padding: 2px 8px; border-radius: 7px;
  background: rgba(255, 180, 84, 0.12);
  color: var(--accent2); font-size: 12px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.node small { font-size: 10px; font-weight: 500; opacity: 0.8; }

.stages { display: grid; gap: 8px; }
.stage {
  padding: 9px 11px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line);
}
.stage-h {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-bottom: 4px; font-size: 11.5px; color: var(--fg3);
}
.stage-no {
  display: inline-grid; place-items: center;
  width: 18px; height: 18px; border-radius: 5px;
  background: var(--bg3); color: var(--fg2);
  font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.stage p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--fg2); }

.d-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.d-actions .btn { flex: 1 1 auto; justify-content: center; }

/* ---------- 10. 遮罩 ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 65;
  background: rgba(0, 0, 0, 0.52);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  animation: fade-in 0.16s ease-out;
}
@media (min-width: 1024px) { body.detail-open .scrim { display: none; } }

/* ---------- 11. 关于 ---------- */
.about {
  max-width: 720px;
  background: var(--bg1); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 22px 26px;
}
.about h2 { margin: 0 0 4px; font-size: 19px; }
.about h3 {
  margin: 22px 0 8px; font-size: 13px;
  letter-spacing: 0.06em; color: var(--fg3); text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.about h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.about p, .about li { font-size: 13.5px; line-height: 1.75; color: var(--fg2); }
.about p { margin: 0 0 8px; }
.about ul { margin: 0 0 8px; padding-left: 1.15em; }
.about li { margin-bottom: 3px; }
.about code {
  font-family: var(--mono); font-size: 12px;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bg3); color: var(--accent);
}
.stats {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  margin: 6px 0 4px;
}
.stat {
  padding: 9px 11px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line);
}
.stat b {
  display: block; font-size: 18px; font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--fg);
}
.stat span { font-size: 11.5px; color: var(--fg3); }

/* ---------- 12. 页脚 ---------- */
.footer {
  max-width: var(--maxw); margin: 8px auto 0;
  padding: 18px 16px 44px;
  border-top: 1px solid var(--line);
  color: var(--fg3); font-size: 11.5px; line-height: 1.8;
}
.footer-inner { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.footer .dot-sep { opacity: 0.5; }
.footer a { color: var(--fg3); text-decoration: underline; text-underline-offset: 2px; }
.footer a:hover { color: var(--accent); }
.footer-meta { font-variant-numeric: tabular-nums; }
.footer button.linklike {
  border: 0; background: transparent; padding: 0; cursor: pointer;
  color: var(--fg3); font-size: inherit; text-decoration: underline;
  text-underline-offset: 2px;
}
.footer button.linklike:hover { color: var(--accent); }

.noscript {
  max-width: var(--maxw); margin: 20px auto; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg2); color: var(--fg2); font-size: 13px;
}

/* ---------- 12.5 补充：关于页 / 详情交叉链接 / 面板标题 ---------- */
body.view-about .layout { grid-template-columns: minmax(0, 1fr); }
body.view-about .filters,
body.view-about .drawer { display: none !important; }
.cards.is-about { display: block; }
.about { margin-bottom: 8px; }
.about .btn { margin-top: 2px; }

.filters-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px;
}
.filters-title {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--fg3); text-transform: uppercase;
}
.filters-head .fgroup-clear { color: var(--fg3); }
.filters-head .fgroup-clear:hover { color: var(--accent); text-decoration: none; }
.seg { margin-top: 8px; }
.filters-foot .btn { width: 100%; justify-content: center; }

.d-box.d-link {
  display: block; width: 100%; text-align: left;
  font: inherit; color: inherit; cursor: pointer;
  transition: border-color 0.13s, background 0.13s;
}
.d-box.d-link:hover { border-color: var(--line2); background: var(--bg3); }
.d-box.d-link:hover p { color: var(--fg); }
.d-box.d-link + .d-box.d-link { margin-top: 8px; }

.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty code, .noscript code {
  font-family: var(--mono); font-size: 12px;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bg3); color: var(--accent);
}
.members-mini span { white-space: nowrap; }

/* ---------- 13. 提示气泡 ---------- */
.toast {
  position: fixed; left: 50%; z-index: 120;
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px);
  padding: 8px 16px; border-radius: 999px;
  background: var(--fg); color: var(--bg);
  font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  max-width: 82vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 768px) {
  .toast { bottom: 32px; }
}

/* ---------- 14. 减少动效 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

<script>
/* ==========================================================================
   store.js — 状态 + URL hash 双向同步
   --------------------------------------------------------------------------
   设计要点
   · 所有状态可序列化，URL 即状态：复制地址栏即可还原视图 / 搜索 / 筛选 / 详情。
   · 只依赖 location.hash，不依赖 history API 的服务端回退，所以：
       - file:// 双击可开
       - 部署在任意子目录（/garrison/、B站 Toy 静态包）都能用
       - 不需要 nginx try_files 重写
   · history.replaceState 在 file:// (origin null) 会抛 SecurityError，
     这里统一 try/catch 回退到 location.hash，保证双击打开也能分享。
   ========================================================================== */
(function (global) {
  'use strict';

  var VIEWS = ['op', 'item', 'strategy', 'covenant', 'about'];

  // URL 里的短名（#/cov/炎 与 #/covenant/炎 都认，输出用 cov）
  var PATH_OF = { op: 'op', item: 'item', strategy: 'strategy', covenant: 'cov', about: 'about' };
  var VIEW_OF_PATH = {
    op: 'op', item: 'item', strategy: 'strategy',
    cov: 'covenant', covenant: 'covenant', about: 'about'
  };

  var DEFAULTS = {
    view: 'op',
    q: '',
    tiers: [],
    tags: [],
    tagMode: 'and',      // 'and' | 'or'
    triggers: [],
    prices: [],
    itypes: [],
    icats: [],
    otypes: [],
    kinds: [],
    sort: 'default',
    hidden: false,
    sel: null
  };

  var state = clone(DEFAULTS);
  var listeners = [];
  var data = null;
  var maps = { op: null, item: null, strategy: null, covenant: null };
  var writing = false;

  /* ---------------- 工具 ---------------- */
  function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function eq(a, b) {
    return JSON.stringify(a) === JSON.stringify(b);
  }

  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  function toInt(s) {
    var n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  function uniq(arr) {
    var out = [], seen = {};
    for (var i = 0; i < arr.length; i++) {
      var k = String(arr[i]);
      if (!seen[k]) { seen[k] = 1; out.push(arr[i]); }
    }
    return out;
  }

  function splitList(value) {
    if (!value) return [];
    var parts = String(value).split(',');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var p = safeDecode(parts[i]);
      if (p) out.push(p);
    }
    return uniq(out);
  }

  var ROMAN_TIER = { I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6 };

  function parseTiers(value) {
    var out = [];
    var list = splitList(value);
    for (var i = 0; i < list.length; i++) {
      var n = toInt(list[i]);
      if (n === null) n = ROMAN_TIER[String(list[i]).toUpperCase()] || null;
      if (n !== null && n >= 1 && n <= 6 && out.indexOf(n) < 0) out.push(n);
    }
    return out;
  }

  function encodeList(arr) {
    var out = [];
    for (var i = 0; i < arr.length; i++) out.push(encodeURIComponent(String(arr[i])));
    return out.join(',');
  }

  /* ---------------- 初始化 ---------------- */
  function init(payload) {
    data = payload;
    maps.op = indexBy(payload.operators, function (o) { return o.name; });
    maps.item = indexBy(payload.items, function (o) { return o.name; });
    maps.strategy = indexBy(payload.strategies, function (o) { return o.key; });
    maps.covenant = indexBy(payload.covenants, function (o) { return o.name; });
    var byId = indexBy(payload.covenants, function (o) { return o.id; });
    for (var id in byId) {
      if (byId.hasOwnProperty(id) && !maps.covenant[id]) maps.covenant[id] = byId[id];
    }
    return data;
  }

    for (var i = 0; i < list.length; i++) m[keyFn(list[i])] = list[i];
    return m;
  }

  function getData() { return data; }

  function entity(view, key) {
    if (!key) return null;
    var m = maps[view];
    return (m && m[key]) || null;
  }

  function listOf(view) {
    if (!data) return [];
    if (view === 'op') return data.operators;
    if (view === 'item') return data.items;
    if (view === 'strategy') return data.strategies;
    if (view === 'covenant') return data.covenants;
    return [];
  }

  function covenantByName(name) {
    return (maps.covenant && maps.covenant[name]) || null;
  }

  /* ---------------- URL 解析 ---------------- */
  function parseHash(hash) {
    var next = clone(DEFAULTS);
    var raw = String(hash || '').replace(/^#/, '');
    if (!raw) return next;

    var qi = raw.indexOf('?');
    var path = qi < 0 ? raw : raw.slice(0, qi);
    var query = qi < 0 ? '' : raw.slice(qi + 1);

    var segs = path.split('/');
    var parts = [];
    for (var i = 0; i < segs.length; i++) {
      if (segs[i]) parts.push(safeDecode(segs[i]));
    }
    var view = parts[0] || 'op';
    view = VIEW_OF_PATH[view] || 'op';
    next.view = view;
    if (parts[1]) next.sel = parts[1];

    if (!query) return next;
    var pairs = query.split('&');
    for (var p = 0; p < pairs.length; p++) {
      if (!pairs[p]) continue;
      var idx = pairs[p].indexOf('=');
      var key = idx < 0 ? pairs[p] : pairs[p].slice(0, idx);
      var val = idx < 0 ? '' : pairs[p].slice(idx + 1);
      switch (key) {
        case 'q': next.q = safeDecode(val.replace(/\+/g, ' ')); break;
        case 'tier': next.tiers = parseTiers(val); break;
        case 'tag': next.tags = splitList(val); break;
        case 'tm': next.tagMode = val === 'or' ? 'or' : 'and'; break;
        case 'trg': next.triggers = splitList(val); break;
        case 'price': next.prices = onlyNums(splitList(val)); break;
        case 'itype': next.itypes = splitList(val); break;
        case 'icat': next.icats = splitList(val); break;
        case 'otype': next.otypes = splitList(val); break;
        case 'kind': next.kinds = splitList(val); break;
        case 'sort': next.sort = val || 'default'; break;
        case 'hidden': next.hidden = oflag(val); break;

    if (s.tiers && s.tiers.length) qs.push('tier=' + encodeList(s.tiers));
    if (s.tags && s.tags.length) qs.push('tag=' + encodeList(s.tags));
    if (s.tags && s.tags.length && s.tagMode === 'or') qs.push('tm=or');
    if (s.triggers && s.triggers.length) qs.push('trg=' + encodeList(s.triggers));
    if (s.prices && s.prices.length) qs.push('price=' + encodeList(s.prices));
    if (s.itypes && s.itypes.length) qs.push('itype=' + encodeList(s.itypes));
    if (s.icats && s.icats.length) qs.push('icat=' + encodeList(s.icats));
    if (s.otypes && s.otypes.length) qs.push('otype=' + encodeList(s.otypes));
    if (s.kinds && s.kinds.length) qs.push('kind=' + encodeList(s.kinds));
    if (s.sort !== 'default') qs.push('sort=' + encodeURIComponent(s.sort));

  function currentHash() {

  }

  function writeUrl(hash, push) {
    if (hash === currentHash()) return;
    writing = true;
    try {
      if (push && global.history && global.history.pushState) {

      } else if (global.history && global.history.replaceState) {
        global.history.replaceState(null, '', hash);
      } else {

    return function () {
      var i = listeners.indexOf(fn);

  function notify() {
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](state); } catch (e) {
        if (global.console && console.error) console.error(e);

  function commit(next, opts) {
    opts = opts || {};
    var changed = !eq(state, next);
    state = next;
    writeUrl(buildUrl(next), !!opts.push);
    if (changed) notify();
    return changed;
  }

  function set(patch, opts) {
    var next = clone(state);
    for (var k in patch) {
      if (patch.hasOwnProperty(k)) next[k] = patch[k];
    }
    return commit(next, opts);
  }

  /** 切换一级视图：保留关键词，清掉只属于上一个视图的筛选 */
  function switchView(view, opts) {
    if (VIEWS.indexOf(view) < 0) return false;

    // 再点一次当前 tab：不清筛选，只关掉详情
    if (view === state.view) {
      if (!state.sel) return false;
      return set({ sel: null }, opts);
    }

    var next = clone(DEFAULTS);
    next.view = view;
    next.q = state.q;
    return commit(next, opts);
  }

  function resetFilters() {
    var next = clone(DEFAULTS);
    next.view = state.view;
    next.q = '';
    return commit(next, { push: false });
  }

  /** 从地址栏同步（浏览器前进/后退、手动改 hash） */
  function syncFromUrl() {
    var next = parseHash(currentHash());
    if (eq(next, state)) return false;
    state = next;
    notify();
    return true;
  }

  function loadFromUrl() {
    state = parseHash(currentHash());
    return state;
  }

  /** 当前选中项是否仍然有效（切换视图或改名后自动丢弃） */
  function validateSelection() {
    if (!state.sel) return false;
    if (!entity(state.view, state.sel)) {
      var next = clone(state);
      next.sel = null;
      state = next;
      writeUrl(buildUrl(state), false);
      notify();
      return true;
    }
    return false;
  }

  function activeFilterCount(s) {
    s = s || state;
    var n = 0;
    if (s.q) n++;
    if (s.tiers.length) n++;
    if (s.tags.length) n++;
    if (s.triggers.length) n++;
    if (s.prices.length) n++;
    if (s.itypes.length) n++;
    if (s.icats.length) n++;
    if (s.otypes.length) n++;
    if (s.kinds.length) n++;
    if (s.hidden) n++;
    return n;
  }

  global.Store = {
    VIEWS: VIEWS,
    DEFAULTS: DEFAULTS,
    init: init,
    getData: getData,
    entity: entity,
    listOf: listOf,
    covenantByName: covenantByName,
    parseHash: parseHash,
    buildUrl: buildUrl,
    subscribe: subscribe,
    set: set,
    switchView: switchView,
    resetFilters: resetFilters,
    loadFromUrl: loadFromUrl,
    syncFromUrl: syncFromUrl,
    validateSelection: validateSelection,
    activeFilterCount: activeFilterCount,
    equals: eq,
    isWriting: function () { return writing; },
    get state() { return state; }
  };
})(window);

<script>
/* ==========================================================================
   search.js — 索引、分词、筛选、排序、高亮
   --------------------------------------------------------------------------
   · 数据量 312 条，全量线性扫描 < 2ms，不做倒排索引，代码更短更好维护。
   · 每个条目的 haystack 在启动时预建一次（小写、字段拼接）。
   · 高亮在渲染时做：先转义再加 <mark>，避免任何 HTML 注入。
   ========================================================================== */
(function (global) {
  'use strict';

  var SEP = '\u0001';
  var index = { op: [], item: [], strategy: [], covenant: [] };
  var data = null;

  /* ---------------- 初始化索引 ---------------- */
  function init(payload) {
    data = payload;

    index.op = payload.operators.map(function (o) {
      return {
        e: o,
        h: low([
          o.name, o.tierLabel, o.type, (o.tags || []).join(' '),
          o.normalText, o.eliteText, o.normalTrigger, o.eliteTrigger, o.price
        ].join(SEP))
      };
    });

    index.item = payload.items.map(function (o) {
      return {
        e: o,
        h: low([
          o.name, o.type, o.tier, o.normalText, o.eliteText, o.price,
          o.hasElite ? o.elitePrice : '', o.fuseCount ? '合成' : ''
        ].join(SEP))
      };
    });

    index.strategy = payload.strategies.map(function (o) {
      var st = [];
      for (var i = 0; i < o.stages.length; i++) {
        st.push(o.stages[i].effect, o.stages[i].state, o.stages[i].rule);
      }
      return {
        e: o,
        h: low([o.role, o.name, o.category, o.text, o.unlock, o.banned]
          .concat(st).join(SEP))
      };
    });

    index.covenant = payload.covenants.map(function (o) {
      return {
        e: o,
        h: low([
          o.name, o.desc, (o.activation.empower || []).join(' '),
          (o.members || []).join(' '), kindLabel(o.activation.kind)
        ].join(SEP))
      };
    });

    return index;
  }

  function low(s) {
    return String(s == null ? '' : s).toLowerCase();
  }

  function kindLabel(kind) {
    if (kind === 'count') return '人数';
    if (kind === 'count_layer') return '人数+层数';
    if (kind === 'elite') return '精锐数';
    return '特殊';
  }

  /* ---------------- 分词 / 匹配 ---------------- */
  function tokens(q) {
    var out = [];
    if (!q) return out;
    var parts = String(q).toLowerCase().split(/[\s\u3000]+/);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p && out.indexOf(p) < 0) out.push(p);
    }
    return out;
  }

  function matchHay(hay, toks) {
    for (var i = 0; i < toks.length; i++) {
      if (hay.indexOf(toks[i]) < 0) return false;
    }
    return true;
  }

  function anyOverlap(list, selected) {
    if (!selected || !selected.length) return true;
    for (var i = 0; i < selected.length; i++) {
      if (list.indexOf(selected[i]) >= 0) return true;
    }
    return false;
  }

  function allMatch(list, selected) {
    if (!selected || !selected.length) return true;
    for (var i = 0; i < selected.length; i++) {
      if (list.indexOf(selected[i]) < 0) return false;
    }
    return true;
  }

  /* ---------------- 筛选 ---------------- */
  /**
   * @param {string} view
   * @param {object} st  Store.state
   * @param {object} [opts] {skipTags:true} 用于计算盟约 chip 计数
   */
  function filter(view, st, opts) {
    opts = opts || {};
    var recs = index[view] || [];
    var toks = tokens(st.q);
    var out = [];

    for (var i = 0; i < recs.length; i++) {
      var rec = recs[i];
      var e = rec.e;

      if (toks.length && !matchHay(rec.h, toks)) continue;

      if (view === 'op') {
        if (st.tiers.length && st.tiers.indexOf(e.tier) < 0) continue;
        if (st.prices.length && st.prices.indexOf(e.price) < 0) continue;
        if (st.otypes.length && st.otypes.indexOf(e.type) < 0) continue;
        if (st.triggers.length) {
          var trg = e.normalTriggers.concat(e.eliteTriggers);
          if (!anyOverlap(trg, st.triggers)) continue;
        }
        if (!st.hidden && e.hidden) continue;
        if (!opts.skipTags && st.tags.length) {
          if (st.tagMode === 'and' ? !allMatch(e.tags, st.tags) : !anyOverlap(e.tags, st.tags)) continue;
        }
      } else if (view === 'item') {
        if (st.tiers.length && st.tiers.indexOf(e.tier) < 0) continue;
        if (st.itypes.length && st.itypes.indexOf(e.type) < 0) continue;
        if (st.prices.length && e.price != null && st.prices.indexOf(e.price) < 0) continue;
      } else if (view === 'strategy') {
        if (st.icats.length && st.icats.indexOf(e.category) < 0) continue;
      } else if (view === 'covenant') {
        if (st.kinds.length && st.kinds.indexOf(e.activation.kind) < 0) continue;
      }

      out.push(e);

  /* ---------------- 排序 ---------------- */
  function cmpName(a, b) {
    try {
      return String(a).localeCompare(String(b), 'zh-Hans-CN');
    } catch (err) {

    }
  }

    if (a.tier !== b.tier) return a.tier - b.tier;
    return cmpName(a.name || a.role, b.name || b.role);
  }

  function sortList(view, list, sort) {
    var arr = list.slice();
    if (sort === 'name') {
      arr.sort(function (a, b) {
        return cmpName(a.name || a.role || '', b.name || b.role || '');
      });
    } else if (sort === 'price') {
      arr.sort(function (a, b) {
        var pa = a.price == null ? 99 : a.price;
        var pb = b.price == null ? 99 : b.price;
        if (pa !== pb) return pa - pb;
        return byTierName(a, b);
      });
    } else if (sort === 'tagcount') {
      arr.sort(function (a, b) {
        var ta = (a.tags || []).length;
        var tb = (b.tags || []).length;
        if (ta !== tb) return tb - ta;
        return byTierName(a, b);
      });
    } else if (sort === 'members') {
      arr.sort(function (a, b) {
        if (a.memberCount !== b.memberCount) return b.memberCount - a.memberCount;
        return cmpName(a.name, b.name);
      });
    } else if (sort === 'category') {
      arr.sort(function (a, b) {
        var c = cmpName(a.category, b.category);
        if (c) return c;
        return cmpName(a.role || a.name, b.role || b.name);
      });
    } else if (sort === 'hp') {
      arr.sort(function (a, b) {
        if (a.hp !== b.hp) return b.hp - a.hp;
        return cmpName(a.role || a.name, b.role || b.name);
      });
    } else if (view === 'op' || view === 'item') {
      arr.sort(byTierName);
    } else if (view === 'strategy') {
      // 默认按角色名，和「策略以角色为主体」的展示口径一致
      arr.sort(function (a, b) {
        return cmpName(a.role || '', b.role || '');
      });
    } else if (view === 'covenant') {
      arr.sort(function (a, b) {
        if (a.memberCount !== b.memberCount) return b.memberCount - a.memberCount;
        return cmpName(a.name, b.name);
      });
    }
    return arr;
  }

  /* ---------------- 分面计数 ---------------- */
  function countFacet(list, valuesOf) {
    var m = {};
    for (var i = 0; i < list.length; i++) {
      var vals = valuesOf(list[i]);
      for (var j = 0; j < vals.length; j++) {
        m[vals[j]] = (m[vals[j]] || 0) + 1;
      }
    }
    return m;
  }

  /* ---------------- 高亮 / 文本格式化 ---------------- */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }

  function highlight(text, toks) {

    if (!toks || !toks.length || !s) return esc(s);

    var lower = s.toLowerCase();

      var tok = toks[t];

      var from = 0, at;

        ranges.push([at, at + tok.length]);
        from = at + tok.length;
      }

    if (!ranges.length) return esc(s);

    ranges.sort(function (a, b) { return a[0] - b[0]; });

    var merged = [ranges[0]];
    for (var i = 1; i < ranges.length; i++) {
      var cur = merged[merged.length - 1];
      if (ranges[i][0] <= cur[1]) {
        if (ranges[i][1] > cur[1]) cur[1] = ranges[i][1];
      } else {
        merged.push(ranges[i]);
      }
    }

    var out = '', pos = 0;
    for (var k = 0; k < merged.length; k++) {
      out += esc(s.slice(pos, merged[k][0]));
      out += '<mark>' + esc(s.slice(merged[k][0], merged[k][1])) + '</mark>';
      pos = merged[k][1];
    }
    out += esc(s.slice(pos));
    return out;
  }

  var TAG_RE = /(【[^】]{1,24}】|<[^<>]{1,24}>)/g;

  /** 【盟约】 与 <触发时机> 着色，换行保留，关键词高亮 */
  function format(text, toks) {
    var s = String(text == null ? '' : text);
    if (!s) return '';
    var out = '';
    var last = 0, m;
    TAG_RE.lastIndex = 0;
    while ((m = TAG_RE.exec(s)) !== null) {
      out += highlight(s.slice(last, m.index), toks);
      var chunk = m[0];
      var cls = chunk.charAt(0) === '【' ? 'kw' : 'trg';
      out += '<span class="' + cls + '">' + esc(chunk) + '</span>';
      last = m.index + chunk.length;
    }
    out += highlight(s.slice(last), toks);
    return out.replace(/\n/g, '<br>');
  }

  /* ---------------- 对外 ---------------- */
  global.Search = {
    init: init,
    tokens: tokens,
    filter: filter,
    sortList: sortList,
    countFacet: countFacet,
    esc: esc,
    highlight: highlight,
    format: format,
    kindLabel: kindLabel,
    index: index
  };
})(window);

</script>

      refs.toolbar.hidden = true;
      refs.toolbar.innerHTML = '';
      refs.empty.hidden = true;
      refs.cards.hidden = false;
      refs.cards.className = 'cards is-about';
      refs.cards.innerHTML = aboutHtml(st);
      renderDrawer(st, toks);
      updateTitle(st);
      return currentList;
    }

    refs.filters.hidden = false;
    refs.toolbar.hidden = false;
    refs.cards.className = 'cards';

    currentList = Search.filter(st.view, st);
    renderFilters(st);
    renderToolbar(st);
    renderCards(st, toks);
    renderDrawer(st, toks);
    updateTitle(st);
    return currentList;
  }

  function updateTitle(st) {
    var t = {
      op: '干员图鉴',
      item: '道具图鉴',
      strategy: '策略图鉴',
      covenant: '盟约图鉴',
      about: '关于'
    }[st.view] || '卫戍协议小助手';
    document.title = t + ' · 卫戍协议小助手';
  }

  function renderTabs(st) {
    var tabs = refs.tabs ? refs.tabs.querySelectorAll('[data-view]') : [];
    for (var i = 0; i < tabs.length; i++) {
      var on = tabs[i].getAttribute('data-view') === st.view;
      tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
      tabs[i].tabIndex = on ? 0 : -1;
    }
  }

  /* ======================================================================
     筛选面板
     ====================================================================== */
  function facetBase(st, facet) {
    var copy = {};
    for (var k in st) if (st.hasOwnProperty(k)) copy[k] = st[k];
    copy.tiers = st.tiers.slice();
    copy.tags = st.tags.slice();
    copy.triggers = st.triggers.slice();
    copy.prices = st.prices.slice();
    copy.itypes = st.itypes.slice();
    copy.icats = st.icats.slice();
    copy.otypes = st.otypes.slice();
    copy.kinds = st.kinds.slice();

    if (facet === 'tags') {
      return Search.filter(st.view, copy, { skipTags: true });
    }
    copy[facet] = [];
    return Search.filter(st.view, copy);
  }

  function groupHtml(opts) {
    var st = Store.state;
    var sel = st[opts.id];
    var isArr = Array.isArray(sel);
    var active = opts.toggle ? !!sel : (isArr ? sel.length > 0 : !!sel);
    var counts = opts.counts || {};

    var chips = '';
    for (var i = 0; i < opts.items.length; i++) {
      var it = opts.items[i];
      var val = it.v;
      var pressed = opts.toggle ? !!sel : (isArr ? sel.indexOf(val) >= 0 : sel === val);
      var c = counts[String(val)];
      var count = (it.count === false) ? null : (c == null ? 0 : c);
      var extra = '';
      if (it.tier) extra += ' tier-chip" data-tier="' + it.tier;
      chips += '<button type="button" class="chip' + extra + '"' +
        ' data-fid="' + opts.id + '" data-fval="' + esc(String(val)) + '"' +
        ' aria-pressed="' + (pressed ? 'true' : 'false') + '"' +
        (it.hue != null ? ' title="' + esc(it.label) + '"' : '') + '>' +
        (it.hue != null ? '<i class="dot" style="--h:' + it.hue + '"></i>' : '') +
        esc(it.label) +
        (count != null ? '<span class="chip-count">' + count + '</span>' : '') +
        '</button>';
    }

    var modeHtml = '';
    if (opts.mode) {
      modeHtml = '<div class="seg" role="group" aria-label="盟约匹配方式">' +
        '<button type="button" data-tm="and" aria-pressed="' + (st.tagMode === 'and' ? 'true' : 'false') + '">全部</button>' +
        '<button type="button" data-tm="or" aria-pressed="' + (st.tagMode === 'or' ? 'true' : 'false') + '">任一</button>' +
        '</div>';
    }

    return '<div class="fgroup"' + (opts.wide ? ' data-wide' : '') + '>' +
      '<div class="fgroup-head"><span class="fgroup-title">' + esc(opts.title) + '</span>' +
      (active ? '<button type="button" class="fgroup-clear" data-fclear="' + opts.id + '">清除</button>' : '') +
      '</div>' +
      '<div class="chips">' + chips + '</div>' +
      modeHtml +
      '</div>';
  }

  function renderFilters(st) {
    var groups = buildGroups(st);
    var html = '<div class="filters-head"><span class="filters-title">筛选</span>' +
      '<span class="filters-head-actions">' +
      '<button type="button" class="fgroup-clear" data-reset="1">全部清空</button>' +
      '<button type="button" class="fgroup-clear filters-x" data-close-filters="1" aria-label="关闭筛选">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>' +
      '</span></div>';

    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (!g) continue;
      var base = (g.countsFrom === 'none') ? [] : facetBase(st, g.id);
      g.counts = g.countOf ? Search.countFacet(base, g.countOf) : {};
      html += groupHtml(g);
    }

    if (st.view === 'op') {
      html += '<div class="filters-foot">' +
        '<button type="button" class="btn btn-primary" data-close-filters="1">查看结果（' + currentList.length + '）</button>' +
        '</div>';
    } else {
      html += '<div class="filters-foot">' +
        '<button type="button" class="btn" data-close-filters="1">收起</button>' +
        '</div>';
    }

    refs.filters.innerHTML = html;
  }

  function buildGroups(st) {
    var groups = [];

    if (st.view === 'op') {
      groups.push({
        id: 'tiers', title: '阶数', wide: false,
        items: data.tiers.map(function (t, i) {
          return { v: i + 1, label: t, tier: String(i + 1) };
        }),
        countOf: function (o) { return [o.tier]; }
      });
      groups.push({
        id: 'tags', title: '盟约', wide: true, mode: true,
        items: data.covenants.map(function (c) {
          return { v: c.name, label: c.name, hue: hue(c.name) };
        }),
        countOf: function (o) { return o.tags; }
      });
      groups.push({
        id: 'triggers', title: '触发时机', wide: true,
        items: triggerOptions(),
        countOf: function (o) { return o.normalTriggers.concat(o.eliteTriggers); }
      });
      groups.push({
        id: 'prices', title: '售价', wide: false,
        items: [1, 2, 3, 4].map(function (n) { return { v: n, label: '◈' + n }; }),
        countOf: function (o) { return [o.price]; }
      });
      groups.push({
        id: 'otypes', title: '条目类型', wide: true,
        items: ['特许条目', '普通条目', '自选配置'].map(function (t) { return { v: t, label: t }; }),
        countOf: function (o) { return [o.type]; }
      });
      groups.push({
        id: 'hidden', title: '其他', wide: false, toggle: true,
        items: [{ v: '1', label: '显示隐藏条目', count: false }],
        countsFrom: 'none'
      });
      return groups;
    }

    if (st.view === 'item') {
      groups.push({
        id: 'itypes', title: '类型', wide: true,
        items: ['装备', '消耗道具', '合成成品'].map(function (t) { return { v: t, label: t }; }),
        countOf: function (o) { return [o.type]; }
      });
      groups.push({
        id: 'tiers', title: '阶数', wide: false,
        items: [1, 2, 3, 4, 5, 6].map(function (n) {
          return { v: n, label: n + ' 阶', tier: String(n) };
        }),
        countOf: function (o) { return [o.tier]; }
      });
      groups.push({
        id: 'prices', title: '普通售价', wide: false,
        items: [1, 2, 3, 4, 5, 6].map(function (n) { return { v: n, label: '◈' + n }; }),
        countOf: function (o) { return [o.price]; }
      });
      return groups;
    }

    if (st.view === 'strategy') {
      groups.push({
        id: 'icats', title: '类别', wide: true,
        items: ['通用策略', '盟约策略'].map(function (t) { return { v: t, label: t }; }),
        countOf: function (o) { return [o.category]; }
      });
      return groups;
    }

    if (st.view === 'covenant') {
      groups.push({
        id: 'kinds', title: '激活方式', wide: true,
        items: [
          { v: 'count', label: '人数' },
          { v: 'count_layer', label: '人数 + 层数' },
          { v: 'elite', label: '精锐数' },
          { v: 'special', label: '特殊' }
        ],
        countOf: function (o) { return [o.activation.kind]; }
      });
      return groups;
    }

    return groups;
  }

  function triggerOptions() {
    var seen = {};
    var out = [];
    var ops = data.operators;
    for (var i = 0; i < ops.length; i++) {
      var t = ops[i].normalTriggers.concat(ops[i].eliteTriggers);
      for (var j = 0; j < t.length; j++) {
        if (!seen[t[j]]) { seen[t[j]] = 1; out.push(t[j]); }
      }
    }
    var order = ['获得时', '进入休整期时', '休整期开始时', '休整期结束时', '战斗中',
      '战斗开始时', '战斗结束时', '售出时', '刷新时'];
    out.sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia < 0) ia = 99;
      if (ib < 0) ib = 99;
      if (ia !== ib) return ia - ib;
      return a.localeCompare(b, 'zh-Hans-CN');
    });
    return out.map(function (t) { return { v: t, label: t }; });
  }

  /* ======================================================================
     工具条
     ====================================================================== */
  function renderToolbar(st) {
    var total = currentList.length;
    var viewTotal = Store.listOf(st.view).length;
    var nActive = Store.activeFilterCount(st);

    var sortOpts = sortOptions(st.view);
    var sortHtml = '<label class="sort">排序<select id="sort" aria-label="排序方式">';
    for (var i = 0; i < sortOpts.length; i++) {
      sortHtml += '<option value="' + esc(sortOpts[i].v) + '"' +
        (st.sort === sortOpts[i].v ? ' selected' : '') + '>' + esc(sortOpts[i].label) + '</option>';
    }
    sortHtml += '</select></label>';

    var filterBtn = '<button type="button" class="btn btn-filter" data-filters-toggle="1">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-filter"/></svg>筛选' +
      (nActive ? '<span class="badge">' + nActive + '</span>' : '') + '</button>';

    var countHtml = '<div class="result-count">共 <b>' + total + '</b> 条' +
      (total !== viewTotal ? '<span style="color:var(--fg3)"> / ' + viewTotal + '</span>' : '') +
      '</div>';

    var chips = activeFilterChips(st);

    refs.toolbar.innerHTML =
      filterBtn + countHtml +
      '<div class="toolbar-spacer"></div>' +
      sortHtml +
      (nActive ? '<button type="button" class="btn" data-reset="1"><svg class="ico" aria-hidden="true"><use href="#i-reset"/></svg>重置</button>' : '') +
      (chips ? '<div class="active-filters">' + chips + '</div>' : '');
  }

  function sortOptions(view) {
    if (view === 'op') {
      return [
        { v: 'default', label: '阶数 → 名称' },
        { v: 'name', label: '名称' },
        { v: 'price', label: '售价' },
        { v: 'tagcount', label: '盟约数' }
      ];
    }
    if (view === 'item') {
      return [
        { v: 'default', label: '阶数 → 名称' },
        { v: 'name', label: '名称' },
        { v: 'price', label: '售价' }
      ];
    }
    if (view === 'strategy') {
      return [
        { v: 'default', label: '角色名' },
        { v: 'category', label: '类别 → 角色' },
        { v: 'name', label: '策略名' },
        { v: 'hp', label: '生命值' }
      ];
    }
    return [
      { v: 'default', label: '成员数' },
      { v: 'name', label: '名称' }
    ];
  }

  function activeFilterChips(st) {
    var out = [];
    var i;

    if (st.q) out.push(afChip('q', '搜索：' + st.q));
    if (st.tiers.length) {
      var tl = [];
      for (i = 0; i < st.tiers.length; i++) {
        tl.push(st.view === 'item' ? String(st.tiers[i]) : data.tiers[st.tiers[i] - 1]);
      }
      out.push(afChip('tiers', '阶数 ' + tl.join('/')));
    }
    if (st.tags.length) {
      var names = [];
      for (i = 0; i < st.tags.length; i++) names.push(st.tags[i]);
      out.push(afChip('tags', '盟约 ' + (st.tagMode === 'or' ? '任一：' : '全部：') + names.join(' + ')));
    }
    if (st.triggers.length) out.push(afChip('triggers', '时机 ' + st.triggers.join('/')));
    if (st.prices.length) out.push(afChip('prices', '售价 ' + st.prices.join('/')));
    if (st.itypes.length) out.push(afChip('itypes', st.itypes.join('/')));
    if (st.icats.length) out.push(afChip('icats', st.icats.join('/')));
    if (st.otypes.length) out.push(afChip('otypes', st.otypes.join('/')));
    if (st.kinds.length) {
      var kl = [];
      for (i = 0; i < st.kinds.length; i++) kl.push(KIND_LABEL[st.kinds[i]] || st.kinds[i]);
      out.push(afChip('kinds', kl.join('/')));
    }
    if (st.hidden) out.push(afChip('hidden', '含隐藏'));

    return out.join('');
  }

  function afChip(id, label) {
    return '<span class="af">' + esc(label) +
      '<button type="button" data-fclear="' + id + '" aria-label="移除筛选：' + esc(label) + '">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button></span>';
  }

  /* ======================================================================
     卡片
     ====================================================================== */
  function renderCards(st, toks) {
    var list = currentList;
    if (!list.length) {
      refs.cards.innerHTML = '';
      refs.cards.hidden = true;
      refs.empty.hidden = false;
      return;
    }
    refs.cards.hidden = false;
    refs.empty.hidden = true;

    var parts = [];
    for (var i = 0; i < list.length; i++) {
      parts.push(cardHtml(st.view, list[i], toks, st));
    }
    refs.cards.innerHTML = parts.join('');
  }

  function cardHtml(view, e, toks, st) {
    if (view === 'op') return opCard(e, toks, st);
    if (view === 'item') return itemCard(e, toks, st);
    if (view === 'strategy') return strategyCard(e, toks, st);
    return covenantCard(e, toks, st);
  }

  function cardOpen(view, key, label, extraClass) {
    return '<div class="card' + (extraClass ? ' ' + extraClass : '') + '" role="button" tabindex="0"' +
      ' data-sel="' + esc(key) + '" aria-label="' + esc(label) + '">';
  }

  function tagsHtml(tags) {
    if (!tags || !tags.length) {
      return '<span class="tag tag-muted">无盟约</span>';
    }
    var out = '';
    for (var i = 0; i < tags.length; i++) {
      out += '<button type="button" class="tag" data-tag="' + esc(tags[i]) + '"' +
        ' style="--h:' + hue(tags[i]) + '" title="按【' + esc(tags[i]) + '】筛选">' +
        '<i class="dot"></i>' + esc(tags[i]) + '</button>';
    }
    return out;
  }

  function trgHtml(list) {
    if (!list || !list.length) return '';
    var out = '';
    for (var i = 0; i < list.length; i++) {
      out += '<span class="trg">' + esc(list[i]) + '</span>';
    }
    return out;
  }

  function opCard(o, toks, st) {
    var active = st.sel === o.name ? 'is-active' : '';
    var label = '干员 ' + o.name + '，' + o.tierLabel + ' 阶，售价 ' + o.price +
      '，盟约 ' + (o.tags.length ? o.tags.join('、') : '无');

    return cardOpen('op', o.name, label, active) +
      '<div class="card-top">' +
      avatarHtml(o, o.name, 40) +
      '<div class="card-title">' + Search.highlight(o.name, toks) + '</div>' +
      '<div class="card-badges">' +
      '<span class="tier" data-tier="' + o.tier + '">' + esc(o.tierLabel) + '</span>' +
      '<span class="price">' + o.price + '</span>' +
      '</div></div>' +
      '<div class="card-tags">' + tagsHtml(o.tags) + '</div>' +
      '<div class="eff">' +
      '<div class="eff-col"><div class="eff-h"><b>普通</b>' + trgHtml(o.normalTriggers) + '</div>' +
      '<p>' + Search.format(o.normalText, toks) + '</p></div>' +
      '<div class="eff-col"><div class="eff-h"><b class="elite">精锐</b>' + trgHtml(o.eliteTriggers) + '</div>' +
      '<p>' + Search.format(o.eliteText, toks) + '</p></div>' +
      '</div>' +
      '<div class="card-foot">' +
      '<span class="pill">' + esc(o.type) + '</span>' +
      (o.hidden ? '<span class="pill pill-warn">隐藏条目</span>' : '') +
      '<span class="sp"></span><span>详情 ›</span>' +
      '</div>' +
      '</div>';
  }

  function itemCard(o, toks, st) {
    var active = st.sel === o.name ? 'is-active' : '';
    var label = '道具 ' + o.name + '，' + o.type + '，' + o.tier + ' 阶，售价 ' + o.price;
    var foot = '<span class="pill">' + esc(o.type) + '</span>';
    if (o.fuseCount) foot += '<span class="pill">合成需 ' + o.fuseCount + ' 件</span>';

    return cardOpen('item', o.name, label, active) +
      '<div class="card-top">' +
      '<div class="card-title">' + Search.highlight(o.name, toks) + '</div>' +
      '<div class="card-badges">' +
      '<span class="tier" data-tier="' + o.tier + '">' + o.tier + '</span>' +
      '<span class="price">' + o.price + '</span>' +
      '</div></div>' +
      '<div class="eff">' +
      '<div class="eff-col"><div class="eff-h"><b>普通</b></div>' +
      '<p>' + Search.format(o.normalText, toks) + '</p></div>' +
      '<div class="eff-col"><div class="eff-h"><b class="elite">精锐</b>' +
      (o.hasElite ? '' : '<span class="pill">无进阶</span>') + '</div>' +
      '<p>' + Search.format(o.eliteText, toks) + '</p></div>' +
      '</div>' +
      '<div class="card-foot">' + foot +
      '<span class="sp"></span><span>精锐售价 ' +
      (o.hasElite ? '◈' + o.elitePrice : '—') + '</span>' +
      '</div>' +
      '</div>';
  }

  function strategyCard(s, toks, st) {
    var active = st.sel === s.key ? 'is-active' : '';
    var label = '角色 ' + s.role + ' 的策略「' + s.name + '」，' + s.category + '，生命值 ' + s.hp;

    // 策略以「角色」为主体：大头像是角色，策略名作为副标题；效果统一放详情。
    return cardOpen('strategy', s.key, label, active) +
      '<div class="card-top">' +
      avatarHtml(null, s.role, 44) +
      '<div class="card-main">' +
      '<div class="card-title">' + Search.highlight(s.role, toks) + '</div>' +
      '<div class="card-sub">策略「' + Search.highlight(s.name, toks) + '」</div>' +
      '</div>' +
      '<div class="card-badges"><span class="pill">HP ' + s.hp + '</span></div>' +
      '</div>' +
      '<div class="card-foot">' +
      '<span class="pill">' + esc(s.category) + '</span>' +
      '<span class="pill">' + s.stages.length + ' 个阶段</span>' +
      '<span class="sp"></span><span>详情 ›</span>' +
      '</div>' +
      '</div>';
  }

  function covenantCard(c, toks, st) {
    var active = st.sel === c.name ? 'is-active' : '';
    var label = '盟约 ' + c.name + '，' + (KIND_LABEL[c.activation.kind] || '') +
      '，成员 ' + c.memberCount + ' 名';

    var rule = activationShort(c);

    var members = '';
    for (var i = 0; i < Math.min(c.members.length, 6); i++) {
      members += '<span>' + esc(c.members[i]) + '</span>';
    }
    if (c.members.length > 6) members += '<span>+' + (c.members.length - 6) + '</span>';

    return cardOpen('covenant', c.name, label, active) +
      '<div class="card-top">' +
      '<div class="card-title"><span class="tag" style="--h:' + hue(c.name) + ';font-size:13px">' +
      '<i class="dot"></i>' + Search.highlight(c.name, toks) + '</span></div>' +
      '<div class="card-badges"><span class="pill">' + esc(KIND_LABEL[c.activation.kind] || c.activation.kind) + '</span></div>' +
      '</div>' +
      '<p class="desc">' + Search.format(c.desc, toks) + '</p>' +
      '<div class="card-foot">' +
      '<span class="pill">' + esc(rule) + '</span>' +
      '<span class="pill">成员 ' + c.memberCount + '</span>' +
      (c.garrison ? '<span class="pill pill-elite">含整备区</span>' : '') +
      '</div>' +
      (members ? '<div class="members-mini">' + members + '</div>' : '') +
      '</div>';
  }

  function activationShort(c) {
    var a = c.activation;
    if (a.kind === 'count') return '在场 ' + a.threshold + ' 人激活';
    if (a.kind === 'count_layer') return a.threshold + ' 人激活 / ' + (a.nodes.join('·') || '-') + ' 层';
    if (a.kind === 'elite') return '精锐 ' + a.threshold + ' 名';
    if (c.name === '独行') return '仅 1 人时生效';
    if (c.name === '调和') return '核心盟约 +1 人';
    return '特殊规则';
  }

  /* ======================================================================
     详情
     ====================================================================== */
  function renderDrawer(st, toks) {
    var drawer = refs.drawer;
    if (!st.sel || st.view === 'about') {
      drawer.hidden = true;
      drawer.innerHTML = '';
      document.body.classList.remove('has-detail');
      document.body.classList.remove('detail-open');
      return;
    }
    var e = Store.entity(st.view, st.sel);
    if (!e) {
      drawer.hidden = true;
      drawer.innerHTML = '';
      document.body.classList.remove('has-detail');
      document.body.classList.remove('detail-open');
      return;
    }

    var html = '';
    if (st.view === 'op') html = opDetail(e, toks);
    else if (st.view === 'item') html = itemDetail(e, toks);
    else if (st.view === 'strategy') html = strategyDetail(e, toks);
    else html = covenantDetail(e, toks);

    drawer.innerHTML = html;
    drawer.hidden = false;
    document.body.classList.add('has-detail');
    if (global.matchMedia && global.matchMedia('(max-width: 1023px)').matches) {
      document.body.classList.add('detail-open');

  }

  function closeBtn() {
    return '<button type="button" class="d-close" data-close="1" aria-label="关闭详情">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>';
  }

  function actionBar() {

      '<button type="button" class="btn" data-copy="1"><svg class="ico" aria-hidden="true"><use href="#i-share"/></svg>复制链接</button>' +
      '<button type="button" class="btn" data-close="1">关闭</button>' +
      '</div>';
  }

  function opDetail(o, toks) {

      '<div class="d-head-main"><h2 class="d-title">' + Search.highlight(o.name, toks) + '</h2>' +
      '<div class="d-sub" style="margin-bottom:0">' + esc(o.tierLabel) + ' 阶 · ' + esc(o.type) +

      '</div>';

    html += '<div class="d-tags">' + tagsHtml(o.tags) + '</div>';

    html += '<div class="d-sec"><h3>普通</h3><div class="d-box">' +
      '<h4>' + (trgHtml(o.normalTriggers) || '<span style="color:var(--fg3)">无触发时机</span>') + '</h4>' +
      '<p>' + Search.format(o.normalText, toks) + '</p></div></div>';

    html += '<div class="d-sec"><h3>精锐</h3><div class="d-box">' +
      '<h4>' + (trgHtml(o.eliteTriggers) || '<span style="color:var(--fg3)">无触发时机</span>') + '</h4>' +

    }

    html += actionBar();

  }

  function itemDetail(o, toks) {
    var html = '<div class="d-head"><h2 class="d-title">' + Search.highlight(o.name, toks) + '</h2>' + closeBtn() + '</div>';
    html += '<div class="d-sub">' + esc(o.type) + ' · ' + o.tier + ' 阶 · 普通售价 ◈' + o.price +
      ' · 精锐售价 ' + (o.hasElite ? '◈' + o.elitePrice : '—（无进阶形态）') + '</div>';

    html += '<div class="d-meta">' +
      '<span class="pill">' + esc(o.type) + '</span>' +

      '</div>';

    html += '<div class="d-sec"><h3>普通效果</h3><div class="d-box">' +
      '<p>' + Search.format(o.normalText, toks) + '</p></div></div>';

    var asResult = null, asPart = [];

      html += '<div class="d-sec"><h3>合成方式</h3><div class="d-box">' +

        esc(asResult.m2) + '</b>（' + esc(asResult.m2Tier) + ' 阶） → <b>' + esc(asResult.result) + '</b></p>' +
        '<p style="margin-top:6px;color:var(--fg3)">' + esc(asResult.effect) + '</p></div></div>';
    }
    if (asPart.length) {
      html += '<div class="d-sec"><h3>可合成</h3>';

          '<h4>' + esc(asPart[k].result) + '</h4>' +

      }

    }

    if (data.buffs && data.buffs.length) {
      var related = [];

        html += '<div class="d-sec"><h3>相关补给</h3>';

  function strategyDetail(s, toks) {

    } else {
      html += '<div class="d-box"><p>' +
        (c.activation.kind === 'elite'
          ? '该盟约没有固定成员：所有干员的精锐状态均可参与激活，按精锐数量判定。'
          : '表中未列出成员。') + '</p></div>';

  function firstLine(s) {
    var t = String(s || '').split('\n')[0];

  /* ======================================================================
     关于页

  function aboutHtml(st) {

      '<h3>版本</h3>' +

      '<p><button type="button" class="btn" data-copy="1">复制当前页面链接</button></p>' +

  }

  /* ======================================================================
     页脚

  function renderFooter() {
    var c = data.counts;
    refs.footer.innerHTML = '<div class="footer-inner">' +
      '<span class="footer-meta">数据版本 ' + esc(data.version) + '</span>' +
      '<span class="dot-sep">·</span>' +

      '<span class="dot-sep">·</span>' +
      '<span>干员 ' + c.operators + ' / 道具 ' + c.items + ' / 策略 ' + c.strategies + ' / 盟约 ' + c.covenants + '</span>' +
      '</div>' +
      '<div class="footer-inner" style="margin-top:4px">' +

  /* ======================================================================
     对外

  global.UI = {

</script>
<script>
/* ==========================================================================
   app.js — 启动、路由、事件绑定
   --------------------------------------------------------------------------
   依赖顺序：data/data.js → store.js → search.js → ui.js → app.js
   注意：全部使用 ES2017 及以下语法，避免 B站 / QQ / 微信内置 WebView 老内核
   不认识可选链、空值合并等新语法导致整站白屏。
   ========================================================================== */
(function (global) {
  'use strict';

  var Store = global.Store;
  var Search = global.Search;
  var UI = global.UI;

  var els = {};
  var debounceTimer = null;
  var THEME_KEY = 'gs-theme';
  var AVATAR_KEY = 'gs-avatars';

  /* ---------------- 启动 ---------------- */
  function boot() {
    els = {
      q: document.getElementById('q'),
      qclear: document.getElementById('qclear'),
      tabs: document.getElementById('tabs'),
      toolbar: document.getElementById('toolbar'),
      filters: document.getElementById('filters'),
      cards: document.getElementById('cards'),
      drawer: document.getElementById('drawer'),
      scrim: document.getElementById('scrim'),
      theme: document.getElementById('theme'),
      share: document.getElementById('share'),
      avatars: document.getElementById('avatars')
    };

    initTheme();

    var data = global.GARRISON_DATA;
    if (!data || !data.operators) {
      showFatal();
      return;
    }

    initAvatarPref();

    Store.init(data);
    Search.init(data);
    UI.init();

    Store.loadFromUrl();
    Store.validateSelection();

    Store.subscribe(function () {
      UI.render();
      refreshLayout();
    });

    UI.render();
    syncInputFromState();
    bindEvents();
    refreshLayout();
    if (Store.state.sel) {
      global.setTimeout(function () { scrollActiveIntoView('center'); }, 60);
    }
    document.body.setAttribute('data-ready', '1');
  }

  function scrollActiveIntoView(block) {
    var el = document.querySelector('.card.is-active');
    if (el && el.scrollIntoView) {
      el.scrollIntoView({ block: block || 'nearest', behavior: 'auto' });
    }
  }

  function showFatal() {
    var box = document.getElementById('cards');
    var msg = document.createElement('div');
    msg.className = 'empty';
    msg.innerHTML = '<p class="empty-t">数据没有加载成功</p>' +
      '<p class="empty-d">页面缺少 <code>data/data.js</code>。' +
      '如果你在本地打开，请先运行 <code>python tools/build_web_data.py</code> 生成数据；' +
      '如果是部署版，请确认 data 目录随站点一起上传。</p>';
    box.appendChild(msg);
  }

  /* ---------------- 主题 ---------------- */
  function initTheme() {
    var t = 'dark';
    try {
      var saved = global.localStorage && global.localStorage.getItem(THEME_KEY);
      if (saved === 'light' || saved === 'dark') t = saved;
    } catch (e) { /* 隐私模式 / 第三方 iframe 里 localStorage 可能抛异常 */ }
    applyTheme(t);
  }

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f2f5f9' : '#0b0f14');
  }

  function toggleTheme() {
    var now = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(now);
    try {
      if (global.localStorage) global.localStorage.setItem(THEME_KEY, now);
    } catch (e) { /* 忽略 */ }
  }

  /* ---------------- 头像开关（纯展示偏好，不进 URL） ---------------- */
  function initAvatarPref() {
    var btn = els.avatars;
    if (global.GARRISON_NO_AVATARS) {
      document.body.classList.add('no-avatars');
      if (btn) btn.hidden = true;
      return;
    }
    var data = global.GARRISON_DATA || {};
    var ops = data.operators || [];
    var hasAny = false;
    for (var i = 0; i < ops.length; i++) {
      if (ops[i].avatar) { hasAny = true; break; }
    }
    if (btn) btn.hidden = !hasAny;
    if (!hasAny) return;
    var on = true;
    try {
      var saved = global.localStorage && global.localStorage.getItem(AVATAR_KEY);
      if (saved === '0') on = false;
    } catch (e) { /* 隐私模式 */ }
    applyAvatars(on);
  }

  function applyAvatars(on) {
    document.body.classList.toggle('no-avatars', !on);
    var btn = els.avatars;
    if (btn) {
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.title = on ? '隐藏头像' : '显示头像';
    }
  }

  function toggleAvatars() {
    var show = document.body.classList.contains('no-avatars');
    applyAvatars(show);
    try {
      if (global.localStorage) global.localStorage.setItem(AVATAR_KEY, show ? '1' : '0');
    } catch (e) { /* 忽略 */ }
  }

  /* ---------------- 事件 ---------------- */
  function bindEvents() {
    // 搜索
    els.q.addEventListener('input', function () {
      var v = els.q.value;
      els.qclear.hidden = !v;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () {
        Store.set({ q: v, sel: null });
      }, 80);
    });
    els.q.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        clearSearch();
        els.q.blur();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(debounceTimer);
        Store.set({ q: els.q.value, sel: null });
        els.q.blur();
      }
    });

    els.qclear.addEventListener('click', function () {
      clearSearch();
      els.q.focus();
    });

    // 顶栏
    els.theme.addEventListener('click', toggleTheme);
    els.share.addEventListener('click', copyLink);
    if (els.avatars) els.avatars.addEventListener('click', toggleAvatars);
    document.addEventListener('error', onImgError, true);

    // 统一委托
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKeydown);

    window.addEventListener('hashchange', onUrlChange);
    window.addEventListener('popstate', onUrlChange);

    var rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(refreshLayout, 120);
    });

    var mq = global.matchMedia ? global.matchMedia('(max-width: 1023px)') : null;
    if (mq) {
      var onChange = function () { refreshLayout(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }

  function onImgError(e) {
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.classList.contains('avatar-img')) {
      t.classList.add('is-broken');
      t.removeAttribute('src');
    }
  }

  function onUrlChange() {
    if (Store.isWriting()) return;
    Store.syncFromUrl();
    syncInputFromState();
    closeOverlays(false);
  }

  function onKeydown(e) {
    var editable = isEditable(e.target);

    if (e.key === '/' && !editable) {
      e.preventDefault();
      els.q.focus();
      els.q.select();
      return;
    }

    if (e.key === 'Escape') {
      if (document.body.classList.contains('filters-open')) {
        e.preventDefault();
        toggleFilters(false);
        return;
      }
      if (Store.state.sel) {
        e.preventDefault();
        Store.set({ sel: null });
        return;
      }
      if (document.activeElement === els.q && els.q.value) {
        e.preventDefault();
        clearSearch();
        return;
      }
      return;
    }

    if (editable) return;

    // 卡片上的 Enter / 空格（焦点在卡片内的小按钮时交给按钮自己处理）
    var card = e.target && e.target.closest ? e.target.closest('.card') : null;
    if (card && e.target === card && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')) {
      e.preventDefault();
      selectKey(card.getAttribute('data-sel'));
      return;
    }

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      if (Store.state.view === 'about') return;
      e.preventDefault();
      stepSelection(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (Store.state.view === 'about') return;
      e.preventDefault();
      stepSelection(-1);
    }
  }

  function onClick(e) {
    var t = e.target;
    if (!t || !t.closest) return;

    // 1) 盟约标签（卡片内 / 详情内）
    var tag = t.closest('[data-tag]');
    if (tag) {
      e.preventDefault();
      var name = tag.getAttribute('data-tag');
      toggleFilters(false);
      Store.set({
        view: 'op', q: '', tiers: [], tags: [name], tagMode: 'and',
        triggers: [], prices: [], itypes: [], icats: [], otypes: [], kinds: [],
        hidden: false, sel: null
      }, { push: true });
      els.cards.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }

    // 2) 卡片
    var card = t.closest('[data-sel]');
    if (card && els.cards.contains(card)) {
      selectKey(card.getAttribute('data-sel'));
      return;
    }

    // 3) 详情内的交叉引用
    var cov = t.closest('[data-cov]');
    if (cov) {
      Store.set({ view: 'covenant', sel: cov.getAttribute('data-cov'), q: '', tiers: [], tags: [], triggers: [], prices: [], itypes: [], icats: [], otypes: [], kinds: [] }, { push: true });
      return;
    }
    var item = t.closest('[data-item]');
    if (item) {
      Store.set({ view: 'item', sel: item.getAttribute('data-item'), q: '' }, { push: true });
      return;
    }
    var op = t.closest('[data-op]');
    if (op) {
      var opName = op.getAttribute('data-op');
      Store.set({ view: 'op', sel: opName }, { push: true });
      return;
    }

    // 4) 面板控制
    var fid = t.closest('[data-fid]');
    if (fid) {
      toggleFacet(fid.getAttribute('data-fid'), fid.getAttribute('data-fval'));
      return;
    }
    var fclear = t.closest('[data-fclear]');
    if (fclear) {
      clearFacet(fclear.getAttribute('data-fclear'));
      return;
    }
    var tm = t.closest('[data-tm]');
    if (tm) {
      Store.set({ tagMode: tm.getAttribute('data-tm') });
      return;
    }
    if (t.closest('[data-reset]')) {
      clearTimeout(debounceTimer);
      Store.resetFilters();
      syncInputFromState();
      toggleFilters(false);
      return;
    }
    if (t.closest('[data-filters-toggle]')) {
      toggleFilters();
      return;
    }
    if (t.closest('[data-close-filters]')) {
      toggleFilters(false);
      return;
    }
    if (t.closest('[data-close]')) {
      Store.set({ sel: null });
      return;
    }
    if (t.closest('[data-copy]')) {
      copyLink();
      return;
    }
    var tab = t.closest('[data-view]');
    if (tab) {
      clearTimeout(debounceTimer);
      closeOverlays(false);
      Store.switchView(tab.getAttribute('data-view'), { push: true });
      window.scrollTo({ top: 0, behavior: 'auto' });
      return;
    }

    // 5) 遮罩
    if (t === els.scrim) {
      if (document.body.classList.contains('filters-open')) toggleFilters(false);
      else if (Store.state.sel) Store.set({ sel: null });
    }
  }

  // 排序下拉（change 事件）
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'sort') {
      Store.set({ sort: e.target.value });
    }
  });

  /* ---------------- 交互实现 ---------------- */
  function clearSearch() {
    clearTimeout(debounceTimer);
    els.q.value = '';
    els.qclear.hidden = true;
    Store.set({ q: '', sel: null });
  }

  function syncInputFromState() {
    if (document.activeElement === els.q) return;
    var q = Store.state.q || '';
    if (els.q.value !== q) els.q.value = q;
    els.qclear.hidden = !q;
  }

  function toggleFacet(fid, raw) {
    var st = Store.state;
    var patch = {};
    if (fid === 'hidden') {
      patch.hidden = !st.hidden;
    } else if (fid === 'tiers' || fid === 'prices') {
      var n = parseInt(raw, 10);
      if (isNaN(n)) return;
      patch[fid] = toggleIn(st[fid], n);
    } else {
      patch[fid] = toggleIn(st[fid], raw);
    }
    Store.set(patch);
    if (window.innerWidth < 640) {
      // 抽屉里的计数会跟着更新，保持在抽屉内
    }
  }

  function toggleIn(arr, v) {
    var out = [];
    for (var i = 0; i < arr.length; i++) if (arr[i] !== v) out.push(arr[i]);
    if (out.length === arr.length) out.push(v);
    return out;
  }

  function clearFacet(fid) {
    var patch = {};
    if (fid === 'q') patch.q = '';
    else if (fid === 'hidden') patch.hidden = false;
    else patch[fid] = [];
    Store.set(patch);
    if (fid === 'q') syncInputFromState();
  }

  function selectKey(key) {
    if (!key) return;
    Store.set({ sel: key }, { push: true });
    if (window.innerWidth < 1024) {
      // 移动端：让详情露出
      global.setTimeout(function () {
        if (els.drawer && !els.drawer.hidden) els.drawer.scrollTop = 0;
      }, 0);
    }
  }

  function stepSelection(delta) {
    var list = UI.getList();
    if (!list || !list.length) return;
    var keyOf = function (e) {
      return Store.state.view === 'strategy' ? e.key : e.name;
    };
    var cur = Store.state.sel;
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (keyOf(list[i]) === cur) { idx = i; break; }
    }
    var next = idx < 0 ? (delta > 0 ? 0 : list.length - 1) : idx + delta;
    if (next < 0) next = 0;
    if (next >= list.length) next = list.length - 1;
    Store.set({ sel: keyOf(list[next]) });

    var active = document.querySelector('.card.is-active');
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function toggleFilters(force) {
    var on = (typeof force === 'boolean') ? force : !document.body.classList.contains('filters-open');
    document.body.classList.toggle('filters-open', on);
    if (on) {
      document.body.classList.remove('detail-open');
      els.filters.scrollTop = 0;
    }
    syncScrim();
  }

  function closeOverlays(closeDetail) {
    document.body.classList.remove('filters-open');
    if (closeDetail) {
      document.body.classList.remove('detail-open');
      if (Store.state.sel) Store.set({ sel: null });
    } else if (!Store.state.sel) {
      document.body.classList.remove('detail-open');
    }
    syncScrim();
  }

  function syncScrim() {
    var on = document.body.classList.contains('filters-open') ||
      document.body.classList.contains('detail-open');
    els.scrim.hidden = !on;
  }

  function refreshLayout() {
    var w = window.innerWidth;
    if (w >= 640) document.body.classList.remove('filters-open');

    var hasSel = !!Store.state.sel && Store.state.view !== 'about';
    var hasEntity = hasSel && !!Store.entity(Store.state.view, Store.state.sel);
    document.body.classList.toggle('has-detail', hasEntity);
    if (w >= 1024) {
      document.body.classList.remove('detail-open');
    } else {
      document.body.classList.toggle('detail-open', hasEntity);
    }
    syncScrim();
  }

  /* ---------------- 复制链接 ---------------- */
  function copyLink() {
    var url = global.location.href;
    var ok = function () { toast('链接已复制'); };
    if (global.navigator && global.navigator.clipboard && global.navigator.clipboard.writeText) {
      global.navigator.clipboard.writeText(url).then(ok, function () { legacyCopy(url); });
    } else {
      legacyCopy(url);
    }
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? '链接已复制' : '复制失败，请手动复制地址栏');
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    // 强制重排后再加 class，保证动画每次都触发
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1700);
  }

  function isEditable(el) {
    if (!el || !el.tagName) return false;
    var tag = el.tagName.toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable === true;
  }

  /* ---------------- 入口 ---------------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
</html>
